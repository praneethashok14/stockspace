name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Lets you re-run from the GitHub UI without pushing a new commit —
  # useful for retrying a failed deploy or redeploying the current main.
  workflow_dispatch:

# Only one deploy at a time, and if a newer push comes in while an
# older run is still deploying, cancel the older run — the newer code
# is what we want live anyway.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    # Only the main branch gets to touch production. Keeps a stray tag
    # push or a reusable-workflow mistake from accidentally deploying.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Full history isn't needed; a shallow clone is enough for the
        # wrangler build + the asset copy step.
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        working-directory: cloudflare
        run: npm ci

      - name: Deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Reuses the local flow: prepare-assets → wrangler deploy →
        # pin the new version to 100% traffic → /api/health smoke test.
        run: npm run deploy
