<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>StockSpace</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StockSpace">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    /* StockSpace — "inside the fridge": a cool graphite ramp, the brand's
       cobalt as the one accent, amber/red only for low stock and expiry.
       Spacing on a 4px grid; radius 8 controls, 12 cards, 16 panels. */
    :root {
      color-scheme: light dark;
      --font: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-display: "Bricolage Grotesque", var(--font);
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Page background. Users can swap it in Settings; see --bg-image. */
      --bg-ambient: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #eef0f3;
      --surface-hover: #f3f4f6;
      --text: #15171c;
      --text-2: #4c5361;
      --muted: #6b7280;
      --border: rgba(21, 23, 28, 0.09);
      --border-strong: rgba(21, 23, 28, 0.16);
      --accent: #0b5fff;
      --accent-text: #ffffff;
      --accent-ink: color-mix(in oklab, var(--accent) 88%, black);
      --accent-soft: color-mix(in srgb, var(--accent) 9%, transparent);
      --danger: #c4262e;
      --danger-bg: color-mix(in srgb, #c4262e 9%, transparent);
      --warning: #9a5800;
      --warning-bg: color-mix(in srgb, #d98a1c 13%, transparent);
      --success: #1f7a45;
      --success-bg: color-mix(in srgb, #1f7a45 10%, transparent);
      --focus: var(--accent);
      /* Freezer-label tag for dates: masking-tape off-white. */
      --label-bg: #f4f0e6;
      --label-text: #4a4336;

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;

      --shadow: 0 1px 2px rgba(15, 17, 22, 0.05);
      --shadow-lg: 0 8px 24px rgba(15, 17, 22, 0.08), 0 1px 2px rgba(15, 17, 22, 0.05);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-ambient: #111317;
        --surface: #171a1f;
        --surface-2: #1f232a;
        --surface-hover: #1c2026;
        --text: #eceef2;
        --text-2: #a6acb8;
        --muted: #8a909c;
        --border: rgba(236, 238, 242, 0.08);
        --border-strong: rgba(236, 238, 242, 0.16);
        --accent-ink: color-mix(in oklab, var(--accent) 62%, white);
        --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
        --danger: #f2777c; --danger-bg: color-mix(in srgb, #f2777c 12%, transparent);
        --warning: #f0b45a; --warning-bg: color-mix(in srgb, #f0b45a 12%, transparent);
        --success: #5cc98a; --success-bg: color-mix(in srgb, #5cc98a 12%, transparent);
        --label-bg: #2a2823;
        --label-text: #e3dccb;
        --shadow: none;
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
    }
    html[data-theme="light"] {
      color-scheme: light;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-ambient: #111317;
      --surface: #171a1f;
      --surface-2: #1f232a;
      --surface-hover: #1c2026;
      --text: #eceef2;
      --text-2: #a6acb8;
      --muted: #8a909c;
      --border: rgba(236, 238, 242, 0.08);
      --border-strong: rgba(236, 238, 242, 0.16);
      --accent-ink: color-mix(in oklab, var(--accent) 62%, white);
      --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
      --danger: #f2777c; --danger-bg: color-mix(in srgb, #f2777c 12%, transparent);
      --warning: #f0b45a; --warning-bg: color-mix(in srgb, #f0b45a 12%, transparent);
      --success: #5cc98a; --success-bg: color-mix(in srgb, #5cc98a 12%, transparent);
      --label-bg: #2a2823;
      --label-text: #e3dccb;
      --shadow: none;
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
      /* Optional user image sits above the page colour. */
      background:
        var(--bg-image, none) center/cover no-repeat fixed,
        var(--bg-ambient) fixed;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; }
    h2 { font-size: 20px; line-height: 1.2; margin: 0 0 12px; }
    h3 { font-size: 16px; line-height: 1.3; margin: 0 0 8px; }
    a { color: var(--accent-ink); }
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* Buttons: secondary by default (raised surface + hairline).
       Primary = filled accent. Ghost = flat. */
    button {
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      padding: 0 12px;
      min-height: 36px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transform-origin: center;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease),
                  color 150ms var(--ease), transform 150ms var(--ease);
    }
    @media (pointer: coarse) {
      button { min-height: 44px; }
    }
    button:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: var(--text);
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    /* JS adds this briefly after a rail drag so the release eases back. */
    .liquid-press { transition: transform 160ms var(--ease) !important; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: transparent;
    }
    button.primary:hover:not(:disabled) {
      background: color-mix(in oklab, var(--accent) 90%, black);
      color: var(--accent-text);
      border-color: transparent;
    }
    button.danger {
      background: transparent;
      color: var(--danger);
      border-color: transparent;
    }
    button.danger:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
    button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-2);
    }
    button.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); border-color: transparent; }
    button.ghost.danger { color: var(--text-2); }
    button.ghost.danger:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger); }
    button.icon {
      min-width: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
    }
    @media (pointer: coarse) {
      button.icon { min-width: 44px; }
    }
    button svg { width: 16px; height: 16px; flex-shrink: 0; }
    button.with-icon { display: inline-flex; align-items: center; gap: 8px; }

    input, select, textarea {
      font: inherit;
      /* 16px minimum prevents iOS Safari auto-zoom on focus */
      font-size: max(16px, 1rem);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      min-height: 40px;
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    input[type="radio"], input[type="checkbox"] {
      width: auto;
      min-height: 0;
      padding: 0;
      margin: 0;
      border-radius: 0;
      background: initial;
      border: initial;
      -webkit-appearance: auto;
      appearance: auto;
      accent-color: var(--accent);
      flex-shrink: 0;
      box-shadow: none;
    }
    textarea { min-height: 80px; resize: vertical; }
    label { display: block; margin-top: 12px; font-size: 14px; font-weight: 500; }
    label > small { display: block; font-weight: 400; color: var(--muted); margin-top: 4px; font-size: 13px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .stack { display: grid; gap: 12px; }
    .stack > p { margin: 0; }
    main.app > .card + .card,
    main.app > section + section,
    main.app > .card + section,
    main.app > section + .card { margin-top: 16px; }
    .muted { color: var(--muted); }

    /* Pills are small quiet tags now: 20px tall, 4px radius, no border. */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      background: var(--surface-2);
      color: var(--text-2);
    }
    .pill.danger { background: var(--danger-bg); color: var(--danger); }
    .pill.warning { background: var(--warning-bg); color: var(--warning); }
    .pill.success { background: var(--success-bg); color: var(--success); }
    .pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
    .pill.muted { background: transparent; color: var(--muted); padding: 0; }

    /* Signature: dates sit on a flat freezer label, set in mono. */
    .date-label {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: 0.01em;
      white-space: nowrap;
      background: var(--label-bg);
      color: var(--label-text);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .date-label.soon { color: var(--warning); }
    .date-label.expired { color: var(--danger); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      white-space: nowrap;
      color: var(--text-2);
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status.low { color: var(--warning); }
    .status.empty { color: var(--danger); }
    .status.opened { color: var(--accent-ink); }
    .status.unopened { color: var(--muted); }

    /* Stock level: quantity against twice the alert threshold. The tick
       marks the threshold itself. */
    .stock {
      position: relative;
      display: inline-block;
      width: 64px;
      height: 4px;
      border-radius: 2px;
      background: var(--surface-2);
      flex-shrink: 0;
    }
    .stock::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--fill, 0%);
      border-radius: 2px;
      background: var(--text-2);
    }
    .stock::after {
      content: "";
      position: absolute;
      left: var(--tick, 50%);
      top: -3px;
      width: 1px;
      height: 10px;
      background: var(--muted);
    }
    .stock.low::before { background: var(--warning); }
    .stock.empty::before { background: var(--danger); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: border-color 150ms var(--ease), background-color 150ms var(--ease);
    }
    .card.interactive:hover:not(:disabled),
    .appliance-tile:hover:not(:disabled),
    .dash-stat-link:hover:not(:disabled) {
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    html, body { overflow-x: hidden; }

    /* --chrome drives the top bar + rail. It defaults to the card surface;
       users can override it in Settings and applyCustomTheme() picks a
       readable text colour. */
    :root {
      --chrome: #ffffff;
      --chrome-text: #15171c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --chrome: #0c0d10; --chrome-text: #eceef2; }
    }
    html[data-theme="dark"] { --chrome: #0c0d10; --chrome-text: #eceef2; }
    :root {
      --chrome-hover: color-mix(in srgb, var(--chrome-text) 7%, transparent);
      --chrome-border: color-mix(in srgb, var(--chrome-text) 9%, transparent);
      --chrome-strong: color-mix(in srgb, var(--chrome-text) 14%, transparent);
      --chrome-muted: color-mix(in srgb, var(--chrome-text) 62%, transparent);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      min-height: 100dvh; /* respects mobile browser UI chrome */
    }
    header.app {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding:
        max(8px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        8px
        max(16px, env(safe-area-inset-left));
      background: var(--chrome);
      border-bottom: 1px solid var(--chrome-border);
      color: var(--chrome-text);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header.app h1 {
      font-size: 16px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex-wrap: wrap;
      color: var(--chrome-text);
    }
    header.app h1 .wordmark {
      display: inline-flex;
      align-items: center;
      line-height: 1;
      color: var(--chrome-text);
    }
    header.app h1 button.wordmark-btn {
      background: transparent;
      border: 0;
      padding: 4px;
      margin: -4px;
      min-height: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    header.app h1 button.wordmark-btn:hover:not(:disabled) {
      background: var(--chrome-hover);
    }
    header.app h1 .wordmark-img {
      /* Integer px heights avoid sub-pixel rasterisation on retina. */
      height: 28px;
      width: auto;
      display: block;
      max-width: min(220px, 46vw);
      image-rendering: -webkit-optimize-contrast;
    }
    header.app h1 .account-name {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      color: var(--chrome-muted);
      padding-left: 12px;
      border-left: 1px solid var(--chrome-border);
      line-height: 20px;
    }
    @media (max-width: 540px) {
      header.app h1 .wordmark-img { height: 24px; max-width: 40vw; }
    }
    header.app button {
      background: transparent;
      color: var(--chrome-text);
      border-color: transparent;
    }
    header.app button:hover:not(:disabled) {
      background: var(--chrome-hover);
      border-color: transparent;
      color: var(--chrome-text);
    }
    header.app button.primary {
      background: var(--accent);
      color: var(--accent-text);
    }
    header.app .pill {
      background: var(--chrome-hover);
      color: var(--chrome-text);
    }
    header.app .header-search {
      flex: 0 1 400px;
      min-width: 140px;
      max-width: 400px;
      min-height: 36px;
      margin: 0 auto;
      padding: 0 12px;
      font-size: 15px;
      background: var(--chrome-hover);
      color: var(--chrome-text);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      width: auto;
    }
    header.app .header-search::placeholder { color: var(--chrome-muted); }
    header.app .header-search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    header.app button.theme-btn,
    header.app button.install-btn,
    header.app button.density-btn {
      min-height: 36px;
      min-width: 36px;
      align-self: center;
      color: var(--chrome-muted);
    }
    header.app button.theme-btn:hover:not(:disabled),
    header.app button.install-btn:hover:not(:disabled),
    header.app button.density-btn:hover:not(:disabled) { color: var(--chrome-text); }
    header.app button.install-btn,
    header.app button.density-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 14px;
      white-space: nowrap;
    }
    @media (max-width: 720px) {
      /* On narrow viewports the search gets its own row below the header's
         top row (wordmark, extras), so it has room to breathe. */
      header.app { flex-wrap: wrap; }
      header.app .header-search {
        flex: 1 1 100%;
        max-width: none;
        margin: 0;
        order: 10;
      }
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 264px;
      max-width: 85vw;
      background: var(--chrome);
      color: var(--chrome-text);
      padding:
        max(12px, env(safe-area-inset-top))
        12px
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      overflow-y: auto;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 300ms var(--ease);
      border-right: 1px solid var(--chrome-border);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar h2 {
      color: var(--chrome-muted);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      margin: 24px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar .sb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--chrome-text);
      border: 1px solid transparent;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      min-height: 36px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
      box-shadow: none;
    }
    /* Scoped to .sidebar (not .sb-item) so .sb-close and any future sidebar
       icons also get sized correctly. */
    .sidebar .sb-icon {
      flex: 0 0 auto;
      display: inline-flex;
      width: 18px;
      height: 18px;
      color: var(--chrome-muted);
    }
    .sidebar .sb-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sidebar .sb-item[aria-current="true"] .sb-icon { color: var(--accent-ink); }
    .sidebar .sb-close:hover:not(:disabled) {
      background: var(--chrome-hover);
    }
    .sidebar .sb-item:hover:not(:disabled) {
      background: var(--chrome-hover);
      border-color: transparent;
      color: var(--chrome-text);
    }
    .sidebar .sb-item[aria-current="true"] {
      background: var(--chrome-hover);
      border-color: var(--chrome-border);
      color: var(--chrome-text);
    }
    .sidebar .sb-item .sb-meta {
      display: block;
      font-size: 12px;
      color: var(--chrome-muted);
      margin-top: 2px;
    }
    .sidebar .sb-add {
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0 12px;
      min-height: 36px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .sidebar .sb-add:hover:not(:disabled) {
      background: color-mix(in oklab, var(--accent) 90%, black);
      color: var(--accent-text);
    }
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.4);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms var(--ease);
    }
    .sidebar-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    /* Push the layout right when the sidebar is docked on wide screens.
       On narrower viewports we fall back to the overlay behaviour above. */
    @media (min-width: 760px) {
      body.sidebar-visible { padding-left: 264px; }
      body.sidebar-visible .sidebar-backdrop { opacity: 0; pointer-events: none; }
    }
    main.app {
      padding: 24px 16px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }
    @media (min-width: 760px) {
      main.app { padding: 32px; }
    }
    .toasts {
      position: fixed;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(16px, env(safe-area-inset-left));
      z-index: 100;
      display: grid;
      gap: 8px;
      max-width: 400px;
      margin-left: auto;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
    }
    .toast.error { color: var(--danger); }
    .toast.success { color: var(--text); }
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.45);
      display: grid;
      place-items: center;
      padding: 16px;
      z-index: 50;
    }
    .dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 520px;
      width: 100%;
      /* Cap the dialog to the viewport and let its own body scroll, so tall
         forms (Add item, etc.) don't overflow the fold on any screen size. */
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      overscroll-behavior: contain;
      box-shadow: var(--shadow-lg);
    }
    .dialog h2 { margin-top: 0; }
    .center-screen {
      display: grid;
      place-items: center;
      min-height: 70vh;
    }
    .center-screen .card { max-width: 400px; width: 100%; padding: 32px; }
    .center-screen .card h2 { font-size: 24px; margin-bottom: 4px; }
    .pin-input {
      font-family: var(--font-mono);
      font-size: 24px;
      letter-spacing: 0.4em;
      text-align: center;
    }

    /* ---- Inventory groups and rows ---- */
    .inv-group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .inv-group summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-weight: 500;
    }
    .inv-group summary::-webkit-details-marker { display: none; }
    .inv-group summary::before {
      content: "";
      width: 6px;
      height: 6px;
      margin: 0 4px 0 2px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform 150ms var(--ease);
    }
    .inv-group[open] summary::before { transform: rotate(45deg); }
    .inv-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      min-height: 64px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      align-items: center;
    }
    .inv-item:first-of-type { border-top: 0; }
    .inv-right {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: flex-end;
    }
    .inv-item .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      align-items: center;
      margin-top: 4px;
      font-size: 13px;
    }
    .inv-item .meta-text { color: var(--muted); }
    .inv-item .name { font-weight: 500; font-size: 15px; }
    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .qty-controls button.icon {
      min-width: 32px;
      min-height: 32px;
      width: 32px;
      height: 32px;
      font-size: 16px;
    }
    .qty-value {
      min-width: 64px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .inv-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .inv-actions button { min-height: 32px; padding: 0 8px; font-size: 13px; }
    .stock-slot { display: inline-block; width: 64px; flex-shrink: 0; }
    @media (min-width: 761px) {
      .inv-actions { min-width: 248px; flex-wrap: nowrap; }
    }
    .filters {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-bottom: 16px;
    }

    /* ---- Dashboard ---- */
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(164px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (max-width: 540px) {
      .dash-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    }
    /* Dashed "Add new" tile at the end of the appliance-summaries grid. */
    .dash-add-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 96px;
      background: transparent;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      box-shadow: none;
    }
    .dash-add-card:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent-ink);
      background: transparent;
    }
    .dash-add-card .dash-add-plus { display: inline-flex; }
    .dash-add-card .dash-add-plus svg { width: 18px; height: 18px; }
    /* Dashboard module wrapper: vertical rhythm between modules and the
       edit-mode controls (drag handle, up/down, visibility). */
    .dash-module { margin-bottom: 24px; }
    .dash-module:last-child { margin-bottom: 0; }
    .dash-module-edit {
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 12px;
      background: transparent;
    }
    .dash-module-edit.hidden-mod { opacity: 0.55; }
    .dash-module-edit.dragging { opacity: 0.4; }
    .dash-module-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .dash-module-head strong { font-weight: 500; }
    .dash-drag {
      cursor: grab;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      user-select: none;
      padding: 0 4px;
    }
    .dash-module-edit.dragging .dash-drag { cursor: grabbing; }
    .dash-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      cursor: pointer;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }
    .dash-toggle input[type="checkbox"] {
      width: auto; min-height: 0; margin: 0; cursor: pointer;
    }
    .dash-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    .dash-section-head h2 { margin: 0; }
    .dash-section-head .count {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }
    section.card.list-card { padding: 20px 4px 4px; }
    section.card.list-card > .dash-section-head { padding: 0 16px 8px; }
    /* ---- Stat tile: label, figure, optional hint. Numbers only. ---- */
    .dash-stat {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      min-height: 112px;
      padding: 16px 20px;
      overflow: hidden;

    }
    .dash-stat .stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

      font-size: 13px;
      font-weight: 400;
      color: var(--text-2);
    }
    .dash-stat .big {
      font-size: 32px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 0;
    }
    .dash-stat .stat-hint {
      align-self: end;
      font-size: 12px;
      color: var(--muted);

    /* When a stat card is clickable it renders as a <button>; strip the

    .dash-stat-link {
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
      min-height: 0;
      border-radius: var(--radius);
      border-color: var(--border);
      background: var(--surface);
    }
    .dash-stat.danger .big { color: var(--danger); }
    .dash-stat.warning .big { color: var(--warning); }
    .dash-stat.danger .stat-label::before,
    .dash-stat.warning .stat-label::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 6px 1px 0;
      border-radius: 50%;
      background: var(--warning);

    .dash-stat.danger .stat-label::before { background: var(--danger); }

    /* ---- Appliance tile ---- */
    .appliance-tile {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 20px;
      text-align: left;
      min-height: 152px;
      min-width: 0;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--text);
      font-weight: 400;
    }
    .appliance-tile .tile-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .appliance-tile .tile-icon {
      width: 36px; height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text-2);
      flex-shrink: 0;
    }
    .appliance-tile .tile-icon svg { width: 18px; height: 18px; }
    .appliance-tile .tile-name {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
    }
    .appliance-tile .tile-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .appliance-tile .tile-count {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: auto;
    }
    .appliance-tile .tile-count b {
      font-size: 28px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .appliance-tile .tile-count span {
      font-size: 13px;
      color: var(--muted);
    }
    .appliance-tile .tile-preview {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;

    /* ---- Primary nav (narrow screens only; the rail owns it on desktop) ---- */
    .primary-nav-wrap {
      display: flex;
      justify-content: center;
      margin: 0 0 16px;
      width: 100%;
    }
    @media (min-width: 760px) {
      .primary-nav-wrap { display: none; }
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
      flex-shrink: 0;
    }
    @media (min-width: 760px) {
      /* 3-column grid so the search stays visually centred no matter
         how wide the wordmark gets, while extras pin to the right. */
      header.app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        column-gap: 16px;
        align-items: center;
      }
      header.app > h1 { justify-self: start; }
      header.app > .header-search {
        justify-self: center;
        flex: 0 1 360px;
        max-width: 360px;
        width: 360px;
        margin: 0;
      }
      header.app > .header-right { grid-column: 3; justify-self: end; margin-left: 0; }

    .primary-nav {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .primary-nav::-webkit-scrollbar { display: none; }
    .primary-nav button {
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-2);
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .primary-nav button svg { width: 18px; height: 18px; }
    .primary-nav button:hover:not(:disabled) { color: var(--text); background: var(--surface-2); border-color: transparent; }
    .primary-nav button[aria-current="true"] {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .primary-nav button[aria-current="true"] svg { color: var(--accent-ink); }
    .primary-nav button.lock-btn:hover:not(:disabled) {
      color: var(--danger);
      background: var(--danger-bg);
    }
    /* On narrow screens the row drops labels so every item fits at a
       glance; a tooltip keeps names reachable. */
    @media (max-width: 640px) {
      .primary-nav button { padding: 0 12px; min-width: 44px; justify-content: center; }
      .primary-nav button .nav-label { display: none; }
    }

    /* ---- Left rail: full-height chrome column next to the top bar ---- */
    .rail {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 64px;

      align-items: center;

        8px
        max(12px, env(safe-area-inset-bottom))

      border-right: 1px solid var(--chrome-border);
      z-index: 40;

    @media (min-width: 760px) {
      .rail { display: flex; }
      body { padding-left: 64px; }
    }
    /* Push the Lock button down to the bottom; nav items hug the top. */
    .rail .rail-spacer { flex: 1; }
    .rail button {
      position: relative;
      z-index: 1;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: var(--radius-sm);
      min-height: 0;
      background: transparent;
      border: 1px solid transparent;
      color: var(--chrome-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .rail button svg { width: 18px; height: 18px; }
    .rail button:hover:not(:disabled) {
      color: var(--chrome-text);
      background: var(--chrome-hover);
      border-color: transparent;
    }
    .rail button[aria-current="true"] {
      /* The selected surface lives on .rail-indicator so it can slide
         between buttons; the button itself just colours the icon. */
      color: var(--accent-ink);
      background: transparent;
      border-color: transparent;
    }
    .rail-indicator {
      position: absolute;
      left: 50%;
      top: 0;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      transform: translate(-50%, 0);
      background: var(--chrome-hover);
      border: 1px solid var(--chrome-border);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: transform 300ms var(--ease), opacity 150ms var(--ease);
    }
    /* While the user is dragging, the indicator tracks the pointer directly. */
    .rail.dragging .rail-indicator { transition: none; }
    .rail button:active:not(:disabled) { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      .rail-indicator { transition: opacity 120ms ease; }
      .rail button:active:not(:disabled) { transform: none; }
    }
    .rail button.lock-btn:hover:not(:disabled) {
      color: var(--danger);
      background: var(--danger-bg);
    }
    .rail .rail-sep {
      height: 1px;
      width: 24px;
      background: var(--chrome-border);
      margin: 4px 0;
    }
    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
    }
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    /* One entrance: the main view fades and rises a few pixels. */
    main.app { animation: rise 300ms var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (max-width: 760px) {
      .inv-item { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .inv-right { justify-content: flex-start; flex-wrap: wrap; gap: 8px 16px; }
      .inv-actions { flex-basis: 100%; justify-content: flex-start; }
      .stock-slot { display: none; }
    }
    @media (max-width: 540px) {
      header.app {
        padding-top: max(4px, env(safe-area-inset-top));
        padding-bottom: 8px;
        gap: 8px;
      }
      /* The account name is redundant with the sidebar on phones. */
      header.app h1 .account-name { display: none; }
      main.app { padding: 16px 12px 32px; padding-left: max(12px, env(safe-area-inset-left));
                 padding-right: max(12px, env(safe-area-inset-right)); }
      .card { padding: 16px; }
      section.card.list-card { padding: 16px 0 4px; }
      section.card.list-card > .dash-section-head { padding: 0 12px 8px; }
      .dash-stat { min-height: 96px; padding: 12px 16px; }
      .dash-stat .big { font-size: 28px; }

      .inv-item { padding: 12px; }
      .inv-group summary { padding: 8px 12px; flex-wrap: wrap; }

      /* Dialog becomes a bottom sheet on narrow screens */
      .dialog-backdrop { padding: 0; align-items: flex-end; }
      .dialog {
        max-width: 100%;
        width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        overflow-y: auto;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding: 20px 16px;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }
    }
    @media (max-width: 380px) {
      .dash-stat .big { font-size: 24px; }
      .filters { grid-template-columns: 1fr 1fr; }
    }

<body>
  <div class="layout" id="root">
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="live"></div>
    <!-- header + main injected by render() -->
  </div>
  <div class="toasts" id="toasts" aria-live="assertive" aria-atomic="false"></div>
  <div id="busy" class="loading" hidden style="position:fixed;bottom:0.6rem;left:0.6rem;z-index:200;padding:0.3rem 0.6rem;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)">
    <span class="spinner" aria-hidden="true"></span>
    <span id="busy-text">Working…</span>
  </div>

  <script>
    "use strict";

    // ---------- utilities ----------

    const $root = document.getElementById("root");
    const $toasts = document.getElementById("toasts");
    const $live = document.getElementById("live");

    /** Create a DOM element with safe text content (never innerHTML). */
    function h(tag, attrs = {}, children = []) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "html") throw new Error("innerHTML not permitted");
        else if (k === "text") el.textContent = v;
        else if (k === "dataset") {
          for (const [dk, dv] of Object.entries(v)) el.dataset[dk] = dv;
        } else if (k.startsWith("on") && typeof v === "function") {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v === true) el.setAttribute(k, "");
        else el.setAttribute(k, v);
      }
      const list = Array.isArray(children) ? children : [children];
      for (const c of list) {
        if (c == null || c === false) continue;
        if (typeof c === "string" || typeof c === "number") {
          el.appendChild(document.createTextNode(String(c)));
        } else if (c instanceof Node) {
          el.appendChild(c);
        }
      }
      return el;
    }

    function pluralize(word, count) {
      if (count === 1) return word;
      const w = String(word).toLowerCase();
      if (w === "person") return "people";
      if (w.endsWith("y") && !["ay", "ey", "oy", "uy"].some(s => w.endsWith(s))) return w.slice(0, -1) + "ies";
      if (w.endsWith("s") || w.endsWith("sh") || w.endsWith("ch") || w.endsWith("x") || w.endsWith("z")) return w + "es";
      if (w.endsWith("f") || w.endsWith("fe")) return w.replace(/(f|fe)$/, "ves");
      return w + "s";
    }

    function toast(message, kind = "info") {
      const el = h("div", { class: "toast " + kind, role: "status", text: message });
      $toasts.appendChild(el);
      setTimeout(() => el.remove(), 4500);
      $live.textContent = message;
    }

    function announce(msg) {
      $live.textContent = msg;
    }

    function formatDate(iso) {
      if (!iso) return "";
      // ISO date "YYYY-MM-DD"; render as local day for user clarity.
      const [y, m, d] = iso.split("-").map(Number);
      if (!y || !m || !d) return iso;
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function expirationState(iso) {
      if (!iso) return "none";
      const [y, m, d] = iso.split("-").map(Number);
      if (!y) return "none";
      const target = new Date(y, m - 1, d);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      target.setHours(0, 0, 0, 0);
      const diffDays = Math.floor((target - today) / 86400000);
      if (diffDays < 0) return "expired";
      if (diffDays <= 7) return "soon";
      return "ok";
    }

    // Low-quantity alert: true when the item's current count is at or below
    // its user-set threshold. Threshold of 0 (or missing on a legacy item)
    // silences the alert. For packs we compare whole-number pack_count; for
    // individual we compare decimal quantity.
    function itemIsLow(item) {
      if (!item) return false;

    async function api(path, { method = "GET", body = null } = {}) {
      if (/\/(undefined|null)(\/|$|\?)/.test(path)) {
        console.error("api(): refusing to call URL with undefined/null id segment:", path);
        throw new ApiError(
          "Internal error: tried to call " + path + ". Please reload the app.",
          0,
          { client: true },
        );
      }
      const opts = {
        method,
        credentials: "same-origin",
        headers: { "accept": "application/json" },
      };
      if (body !== null) {
        opts.headers["content-type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      if (state.csrfToken && method !== "GET" && method !== "HEAD") {
        opts.headers["x-stockspace-csrf"] = state.csrfToken;
      }
      let resp;
      try {
        resp = await fetch(path, opts);
      } catch (err) {
        throw new ApiError("Network error. Is the backend running?", 0, { network: true });
      }
      if (resp.status === 401) {
        // Session expired or missing. Force relock without wiping the configured flag.
        state.authenticated = false;
        state.csrfToken = null;
        wipePrivateState();
        render();
      }
      if (resp.status === 204) return null;
      const ct = resp.headers.get("content-type") || "";
      const data = ct.includes("application/json") ? await resp.json() : await resp.text();
      if (!resp.ok) {
        const msg = data && data.error ? data.error.message : (typeof data === "string" ? data : resp.statusText);
        const code = data && data.error ? data.error.code : null;
        throw new ApiError(msg || "Request failed", resp.status, { code, data });
      }
      return data;
    }

    class ApiError extends Error {
      constructor(message, status, extra = {}) {
        super(message);

        Object.assign(this, extra);

      state.appliances = [];
      state.groups = [];
      state.items = [];

      state.busyItems.clear();

    async function checkAuth() {
      try {
        const status = await api("/api/auth/status");
        state.hasAccounts = !!status.has_accounts;
        state.accountNames = Array.isArray(status.account_names) ? status.account_names : [];
      } catch (e) {
        state.hasAccounts = false;
        state.accountNames = [];
      }
      try {
        const sess = await api("/api/auth/session");
        if (sess && sess.authenticated) {
          state.authenticated = true;
          state.csrfToken = sess.csrf_token || null;
          state.accountId = sess.account_id || null;
          state.accountName = sess.account_name || null;
          state.familyId = sess.family_id || null;
          state.familyRole = sess.family_role || null;
          await loadServerPrefs();
          await reloadInventory();
        }
      } catch (_) {
        /* session endpoint failures mean "not authenticated" */
      }
    }

    async function signup(name, pin) {
      const resp = await api("/api/auth/signup", { method: "POST", body: { name, pin } });
      state.authenticated = true;
      state.hasAccounts = true;
      state.csrfToken = resp.csrf_token || null;
      state.accountId = resp.account_id || null;
      state.accountName = resp.account_name || null;
      state.familyId = null;
      state.familyRole = null;
      // A fresh account has no server prefs yet; seed from the current local
      // state so this device's choice carries over as the account's baseline.
      queueServerPrefsSave();
      try {
        await reloadInventory();
      } catch (err) {
        if (err.status === 401) {
          throw new ApiError(
            "Account was created but the session cookie was blocked by the browser. " +
            "Enable cookies for this site and reload.",
            401,
          );
        }
        throw err;
      }
    }

    async function login(name, pin) {
      const resp = await api("/api/auth/login", { method: "POST", body: { name, pin } });
      state.authenticated = true;
      state.csrfToken = resp.csrf_token || null;
      state.accountId = resp.account_id || null;
      state.accountName = resp.account_name || null;
      state.familyId = resp.family_id || null;
      state.familyRole = resp.family_role || null;
      await loadServerPrefs();
      try {
        await reloadInventory();
      } catch (err) {
        if (err.status === 401) {
          throw new ApiError(
            "Logged in but the session cookie was blocked by the browser. " +
            "Enable cookies for this site and reload.",
            401,
          );
        }
        throw err;
      }
    }

      state.accountId = null;
      state.accountName = null;

      } catch (_) {}
      state.authMode = "login";
      render();
      announce("Session locked.");

      state.csrfToken = null;
      wipePrivateState();
      render();

      const rightSide = h("div", { class: "header-right" }, extras.filter(Boolean));
      if (!headerSearch) title.style.flex = "1";
      const header = h("header", { class: "app" }, [
        title, headerSearch, rightSide,
      ].filter(Boolean));
      // Preserve focus + caret while typing causes a re-render.
      if (headerSearch && state.filters.q) {
        queueMicrotask(() => {
          const el = document.querySelector("header.app .header-search");
          if (!el || document.activeElement === el) return;
          el.focus();
          try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {}
        });
      }
      return header;
    }

    function cycleTheme() {
      const next = { auto: "light", light: "dark", dark: "auto" };
      const current = document.documentElement.dataset.theme || "auto";
      const nextTheme = next[current];
      if (nextTheme === "auto") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = nextTheme;
      try { localStorage.setItem("stockspace_theme", nextTheme); } catch (_) {}
      applyCustomTheme();
      queueServerPrefsSave();
      render();
    }

    function toggleDensity() {
      const next = { full: "compact", compact: "grid", grid: "full" };
      state.density = next[state.density] || "full";
      try { localStorage.setItem("stockspace_density", state.density); } catch (_) {}
      queueServerPrefsSave();
      render();
    }

    // ---------- Custom theme (user-chosen chrome + bg) ----------

    function effectiveColorScheme() {
      const dt = document.documentElement.dataset.theme;
      if (dt === "light" || dt === "dark") return dt;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    // Luminance-based contrast text colour. For a user-picked chrome bg we
    // return either our default dark text or default light text, whichever
    // reads better.
    function contrastText(hex) {
      if (typeof hex !== "string" || !/^#[0-9a-f]{6}$/i.test(hex)) return null;
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return lum > 0.55 ? "#15171c" : "#eceef2";
    }

    // True when the resolved chrome text is light, i.e. the chrome is dark
    // and needs the light-content wordmark.
    function chromeIsDark() {
      const txt = getComputedStyle(document.documentElement)
        .getPropertyValue("--chrome-text").trim().toLowerCase();
      return txt !== "#15171c";
    }

    function applyCustomTheme() {
      const scheme = effectiveColorScheme();
      const t = state.customTheme;
      const chrome = scheme === "dark" ? t.chromeDark : t.chromeLight;
      const bg = scheme === "dark" ? t.bgDark : t.bgLight;
      const bgImage = scheme === "dark" ? t.bgImageDark : t.bgImageLight;
      const root = document.documentElement;
      if (chrome) {
        root.style.setProperty("--chrome", chrome);
        const txt = contrastText(chrome);
        if (txt) root.style.setProperty("--chrome-text", txt);
      } else {
        root.style.removeProperty("--chrome");
        root.style.removeProperty("--chrome-text");
      }
      // Solid-color background override; replaces the ambient gradient when set.
      if (bg && !/gradient\(/.test(bg)) {
        root.style.setProperty("--bg-ambient", bg);
      } else {
        root.style.removeProperty("--bg-ambient");
      }
      // Image background (data URL or http URL). Blurred glass surfaces will
      // pick up its color — the whole app sits on top of this.
      if (bgImage) {
        root.style.setProperty("--bg-image", "url(" + JSON.stringify(bgImage) + ")");
      } else {
        root.style.removeProperty("--bg-image");
      }
      // Optional user accent color override.
      if (t.accent) {
        root.style.setProperty("--accent", t.accent);
      } else {
        root.style.removeProperty("--accent");
      }
      // Sync the browser URL-bar / status-bar color to the resolved chrome.
      const resolved = chrome || getComputedStyle(root).getPropertyValue("--chrome").trim();
      if (resolved) {
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
          meta.removeAttribute("media");
          meta.setAttribute("content", resolved);
        }
      }
      // Keep the wordmark variant in sync with chrome darkness — not just
      // light/dark MODE, but the actual chrome colour's luminance. That way a
      // user who picks a dark chrome in light mode still gets the white-
      // content wordmark, and vice versa. This runs on every theme change
      // without waiting for the next render pass.
      try {
        const src = chromeIsDark() ? "/icons/wordmark-on-dark.svg" : "/icons/wordmark-on-light.svg";
        for (const img of document.querySelectorAll(".wordmark-img")) {
          if (img.getAttribute("src") !== src) img.setAttribute("src", src);
        }
      } catch (_) {}
    }

    function saveCustomTheme() {
      try { localStorage.setItem("stockspace_custom_theme", JSON.stringify(state.customTheme)); }
      catch (_) {}
      queueServerPrefsSave();
    }

    // ---------- Server-synced preferences ----------
    //
    // The things we sync: theme (auto/light/dark), density, and the custom-
    // theme chrome/bg colours + accent. Deliberately NOT bgImageLight/Dark —
    // those are inlined data URLs that can get large, so they stay in
    // localStorage per device.
    //
    // On login we GET /api/account/preferences and merge in whatever the
    // server has (server wins for conflicting fields; a user who picks dark
    // on their phone should see dark on their laptop next time). On every
    // change we debounce-save back. localStorage is still written so first
    // paint on reload doesn't flash the wrong colours while we wait for the
    // server.
    function snapshotSyncedPrefs() {
      const t = state.customTheme || {};
      const theme = document.documentElement.dataset.theme || "auto";
      return {
        theme,
        density: state.density || "full",
        customTheme: {
          chromeLight: t.chromeLight || null,
          chromeDark: t.chromeDark || null,
          bgLight: t.bgLight || null,
          bgDark: t.bgDark || null,
          accent: t.accent || null,
        },
      };
    }

    let _prefsSaveTimer = null;
    let _prefsLastSerialized = null;
    function queueServerPrefsSave() {
      if (!state.authenticated) return;
      if (_prefsSaveTimer) clearTimeout(_prefsSaveTimer);
      _prefsSaveTimer = setTimeout(async () => {
        _prefsSaveTimer = null;
        const prefs = snapshotSyncedPrefs();
        const serialized = JSON.stringify(prefs);
        if (serialized === _prefsLastSerialized) return;
        try {
          await api("/api/account/preferences", {
            method: "PUT",
            body: { prefs },
          });
          _prefsLastSerialized = serialized;
        } catch (_) {
          // Non-fatal — localStorage still holds the newest value.
        }
      }, 400);
    }

    async function loadServerPrefs() {
      if (!state.authenticated) return;
      let resp;
      try {
        resp = await api("/api/account/preferences");
      } catch (_) {
        return;
      }
      const prefs = resp && resp.prefs && typeof resp.prefs === "object" ? resp.prefs : null;
      if (!prefs) return;
      _prefsLastSerialized = JSON.stringify({
        theme: prefs.theme,
        density: prefs.density,
        customTheme: prefs.customTheme,
      });
      if (prefs.theme === "light" || prefs.theme === "dark") {
        document.documentElement.dataset.theme = prefs.theme;
        try { localStorage.setItem("stockspace_theme", prefs.theme); } catch (_) {}
      } else if (prefs.theme === "auto") {
        delete document.documentElement.dataset.theme;
        try { localStorage.setItem("stockspace_theme", "auto"); } catch (_) {}
      }
      if (prefs.density === "full" || prefs.density === "compact" || prefs.density === "grid") {
        state.density = prefs.density;
        try { localStorage.setItem("stockspace_density", state.density); } catch (_) {}
      }
      const ct = prefs.customTheme && typeof prefs.customTheme === "object" ? prefs.customTheme : null;
      if (ct) {
        state.customTheme.chromeLight = typeof ct.chromeLight === "string" ? ct.chromeLight : null;
        state.customTheme.chromeDark = typeof ct.chromeDark === "string" ? ct.chromeDark : null;
        state.customTheme.bgLight = typeof ct.bgLight === "string" ? ct.bgLight : null;
        state.customTheme.bgDark = typeof ct.bgDark === "string" ? ct.bgDark : null;
        state.customTheme.accent = typeof ct.accent === "string" ? ct.accent : null;
        try { localStorage.setItem("stockspace_custom_theme", JSON.stringify(state.customTheme)); } catch (_) {}
      }
      applyCustomTheme();
    }

    // Wrapped version — used only on narrow screens inside each view.

    }

    // Thin left rail — icon-only, docked mid-left on wide screens. Mirrors
    // the reel's visual language exactly: pill-shaped glass column with
    // circular icon buttons stacked, active state in amber.
    let $rail = null;
    function ensureRail() {
      if ($rail) return;
      $rail = document.createElement("aside");
      $rail.className = "rail";
      $rail.setAttribute("aria-label", "Shortcuts");
      document.body.appendChild($rail);
      attachRailLiquidDrag($rail);
    }

    // iOS 26/27 "Liquid Glass" drag: pressing a rail button and dragging
    // along the rail stretches the active-pill indicator toward the
    // pointer, previews whichever button you're hovering, then settles
    // on release — either back home or on a new view. Honors
    // prefers-reduced-motion by skipping the stretch.
    function attachRailLiquidDrag(rail) {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let drag = null;  // null when idle, object while dragging
      let onMove = null, onUp = null;

      // Block the default click; we route navigation ourselves on pointerup
      // so a drag that ends over a different button navigates there and
      // a drag that ends over the same button doesn't double-fire.
      rail.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-view], button.lock-btn");
        if (btn && drag !== false) { /* fall through */ }
      }, true);

      rail.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        const startBtn = e.target.closest("button[data-view], button.lock-btn");
        if (!startBtn) return;
        const indicator = rail.querySelector(".rail-indicator");
        if (!indicator) return;
        const railBox = rail.getBoundingClientRect();
        const activeBtn = rail.querySelector('button[aria-current="true"]') || startBtn;
        const anchorBox = activeBtn.getBoundingClientRect();
        drag = {
          startBtn,
          pointerId: e.pointerId,
          anchorY: anchorBox.top - railBox.top,
          anchorH: anchorBox.height,
          anchorW: anchorBox.width,
          startY: e.clientY,
          moved: false,
        };
        rail.classList.add("dragging");
        e.preventDefault();  // stop the browser from synthesising a click

        onMove = (ev) => {
          if (!drag || ev.pointerId !== drag.pointerId) return;
          const dy = ev.clientY - drag.startY;
          if (Math.abs(dy) > 3) drag.moved = true;
          if (reduceMotion) return;
          const over = document.elementFromPoint(ev.clientX, ev.clientY);
          const hoverBtn = over && over.closest
            ? over.closest(".rail button[data-view], .rail button.lock-btn")
            : null;
          const rb = rail.getBoundingClientRect();
          let targetY = drag.anchorY, targetH = drag.anchorH;
          if (hoverBtn) {
            const hb = hoverBtn.getBoundingClientRect();
            targetY = hb.top - rb.top;
            targetH = hb.height;
          }
          // Capsule stretch between the anchor button and the hovered one.
          const top = Math.min(drag.anchorY, targetY);
          const bot = Math.max(drag.anchorY + drag.anchorH, targetY + targetH);
          indicator.style.transform = `translate(-50%, ${top}px)`;
          indicator.style.height = `${bot - top}px`;
          indicator.style.width = `${drag.anchorW}px`;
          indicator.style.borderRadius = `${drag.anchorW / 2}px`;
          indicator.style.opacity = "1";
        };
        onUp = (ev) => {
          if (!drag || ev.pointerId !== drag.pointerId) return;
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          rail.classList.remove("dragging");
          const indicator = rail.querySelector(".rail-indicator");
          if (indicator) indicator.style.borderRadius = "";  // revert to CSS
          const over = document.elementFromPoint(ev.clientX, ev.clientY);
          const target = (over && over.closest(".rail button[data-view], .rail button.lock-btn"))
            || drag.startBtn;
          drag = null;
          // Route via the button's own handler so navigation + state
          // changes stay in one place. Programmatic click bypasses the
          // click-suppression above.
          if (target && target.isConnected) target.click();
          requestAnimationFrame(positionRailIndicator);
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    }

    // iOS 26/27 Liquid-glass press on EVERY button (rail buttons too).
    // Press alone scales to ~0.94; drag then stretches the button along
    // the drag axis and compresses the perpendicular one, with the
    // translation following the pointer (damped). The result is a
    // liquid-blob deformation that leans into the drag. Release springs
    // back via a brief transition. Skipped under reduced motion.
    (function attachGlobalLiquidPress() {
      if (typeof document === "undefined") return;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) return;
      const STRETCH = 0.18;   // max added scale along the drag axis
      const SQUASH = 0.08;    // max taken from the perpendicular axis
      const LEAN = 10;        // max px of translation at full drag
      const RANGE = 70;       // px of pointer travel that saturates the effect
      let drag = null, onMove = null, onUp = null;

      document.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        const btn = e.target.closest && e.target.closest("button");
        if (!btn) return;
        if (btn.disabled) return;
        drag = { btn, sx: e.clientX, sy: e.clientY, pid: e.pointerId };
        // Kill any inflight spring-back transition so the follow is live.
        btn.style.transition = "transform 0ms linear";
        onMove = (ev) => {
          if (!drag || ev.pointerId !== drag.pid) return;
          const dx = ev.clientX - drag.sx;
          const dy = ev.clientY - drag.sy;
          // Normalised magnitudes along each axis (−1..1).
          const nx = Math.max(-1, Math.min(1, dx / RANGE));
          const ny = Math.max(-1, Math.min(1, dy / RANGE));
          // Non-uniform scale — stretch along the dominant drag axis,
          // squash the other. Base scale 0.94 (the press shrink).
          const base = 0.94;
          const sX = base + Math.abs(nx) * STRETCH - Math.abs(ny) * SQUASH;
          const sY = base + Math.abs(ny) * STRETCH - Math.abs(nx) * SQUASH;
          const tx = nx * LEAN;
          const ty = ny * LEAN;
          drag.btn.style.transform = `translate(${tx}px, ${ty}px) scale(${sX}, ${sY})`;
        };
        onUp = (ev) => {
          if (!drag) return;
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          const b = drag.btn;
          drag = null;
          // Spring back via a brief liquid-press transition, then clear.
          b.classList.add("liquid-press");
          b.style.transition = "";
          b.style.transform = "";
          window.setTimeout(() => b.classList.remove("liquid-press"), 320);
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    })();

    // Signature of what's currently inside the rail; only rebuild when
    // this changes, so the floating pill indicator can keep its own DOM
    // and animate between buttons instead of jumping on every render.
    let railSignature = "";
    function updateRail() {
      // Even on the lock / signup screen we keep the rail as a chrome
      // column so the frame of the app stays consistent. It just has no
      // interactive items until the user signs in.
      ensureRail();
      const entries = state.authenticated ? navEntries() : [];
      const nextSig = (state.authenticated ? "auth:" : "lock:") + entries.map(e => e[0]).join(",");
      if (nextSig !== railSignature) {
        rebuildRail(entries);
        railSignature = nextSig;
      }
      // Flip aria-current across the existing buttons and re-position the
      // indicator. The CSS transition on the indicator does the slide.
      for (const btn of $rail.querySelectorAll("button[data-view]")) {
        const v = btn.getAttribute("data-view");
        btn.setAttribute("aria-current", state.view === v ? "true" : "false");
      }
      requestAnimationFrame(positionRailIndicator);
    }

    function rebuildRail(entries) {
      $rail.textContent = "";
      // Floating active-pill — slides between buttons on page change.
      $rail.appendChild(h("span", { class: "rail-indicator", "aria-hidden": "true" }));
      for (const [view, label, iconName] of entries) {
        $rail.appendChild(h("button", {
          type: "button",
          title: label,
          "aria-label": label,
          "data-view": view,
          onClick: () => {
            if (view === state.view) return;
            state.view = view;
            if (view === "inventory" || view === "appliances") state.activeApplianceId = null;
            if (view === "settings") state.family = null;
            render();
          },
        }, [icon(iconName)]));
      }
      if (entries.length) {
        $rail.appendChild(h("div", { class: "rail-spacer", "aria-hidden": "true" }));
        $rail.appendChild(h("div", { class: "rail-sep", "aria-hidden": "true" }));
        $rail.appendChild(h("button", {
          type: "button",
          class: "lock-btn",
          title: "Lock",
          "aria-label": "Lock",
          onClick: () => lock(),
        }, [icon("lock")]));
      }
    }

    // Measure the currently-active nav button and park the floating
    // pill behind it. The CSS transition on transform/height does the
    // actual iOS-style slide between pages. On the very first position
    // we snap instantly (no slide from off-screen).
    function positionRailIndicator() {
      if (!$rail) return;
      const indicator = $rail.querySelector(".rail-indicator");
      const active = $rail.querySelector('button[aria-current="true"]');
      if (!indicator) return;
      if (!active) { indicator.style.opacity = "0"; return; }
      const railBox = $rail.getBoundingClientRect();
      const btnBox = active.getBoundingClientRect();
      const y = btnBox.top - railBox.top;
      const firstPlacement = indicator.style.opacity !== "1";
      if (firstPlacement) indicator.style.transition = "none";
      indicator.style.transform = `translate(-50%, ${y}px)`;
      indicator.style.height = `${btnBox.height}px`;
      indicator.style.width = `${btnBox.width}px`;
      indicator.style.opacity = "1";
      if (firstPlacement) {
        void indicator.offsetHeight;  // flush
        requestAnimationFrame(() => { indicator.style.transition = ""; });
      }
    }
    if (typeof window !== "undefined") {
      window.addEventListener("resize", () => requestAnimationFrame(positionRailIndicator));
    }

    function renderDashboard() {
      const main = h("main", { class: "app" });
      const editing = state.dashboardEditing;

      main.appendChild(primaryNav("dashboard"));

      // Toolbar: Edit layout / Done + (edit-only) Reset.
      const toolbar = h("div", {
        class: "row",
        style: "justify-content:flex-end;gap:8px;margin-bottom:16px;flex-wrap:wrap",
      }, [
        editing
          ? h("button", {
              type: "button", class: "ghost",
              onClick: () => {
                state.dashboardLayout = [
                  { id: "stats", visible: true },
                  { id: "lowstock", visible: true },
                  { id: "expiring", visible: true },
                  { id: "appliances", visible: true },
                ];
                saveDashboardLayout();
                render();
              },
              text: "Reset layout",
            })
          : null,
        h("button", {
          type: "button",
          class: editing ? "primary" : "ghost",
          onClick: () => {
            state.dashboardEditing = !state.dashboardEditing;
            if (!state.dashboardEditing) saveDashboardLayout();
            render();
          },
          text: editing ? "Done" : "Edit layout",
        }),
      ]);
      main.appendChild(toolbar);

      // Search short-circuit: when the header search has text, show a flat
      // result list instead of the normal dashboard. Only applies when NOT
      // editing (so you can rearrange with a query present).
      if (!editing && state.filters.q.trim()) {
        const matches = applyFilters(state.items);
        if (matches.length === 0) {
          main.appendChild(h("div", { class: "card empty" }, [
            h("h3", { style: "margin-top:0", text: "No matches" }),
            h("p", { class: "muted", text: `Nothing found for "${state.filters.q.trim()}". Try different terms or clear the search.` }),
          ]));
          return main;
        }
        const list = newItemsContainer();
        for (const i of matches) list.appendChild(renderInventoryItem(i, { showAppliance: true }));
        main.appendChild(h("section", { class: "card stack", "aria-label": "Search results" }, [
          h("h2", { style: "margin:0;font-size:1.1rem", text: `${matches.length} ${pluralize("result", matches.length)}` }),
          list,
        ]));
        return main;
      }

      // No-appliances empty state only when NOT editing (so the user can
      // still rearrange their layout on a fresh account).
      if (!editing && state.appliances.length === 0) {
        if (canEditStructure()) {
          main.appendChild(emptyState(
            "No appliances yet",
            "Start by adding a fridge or freezer.",
            () => { state.view = "appliances"; render(); },
            "Add an appliance",
          ));
        } else {
          main.appendChild(emptyState(
            "No appliances yet",
            "Your family's owners haven't added any appliances.",
          ));
        }
        return main;
      }

      // Render modules in layout order. In edit mode, every module shows
      // (even if invisible) wrapped with reorder + toggle controls. Outside
      // edit mode, only visible modules render.
      for (let idx = 0; idx < state.dashboardLayout.length; idx++) {
        const entry = state.dashboardLayout[idx];
        const mod = DASHBOARD_MODULES[entry.id];
        if (!mod) continue;
        if (!editing && !entry.visible) continue;

        const body = mod.render();
        if (!editing) {
          if (body) {
            body.classList.add("dash-module");
            main.appendChild(body);
          }
          continue;
        }

        // Edit-mode wrapper: drag handle, title, move buttons, visibility.
        const wrapper = h("div", {
          class: "dash-module dash-module-edit" + (entry.visible ? "" : " hidden-mod"),
          draggable: "true",
          "data-idx": String(idx),
        }, [
          h("div", { class: "dash-module-head" }, [
            h("span", { class: "dash-drag", title: "Drag to reorder", "aria-hidden": "true", text: "⋮⋮" }),
            h("strong", { text: mod.title, style: "flex:1" }),
            h("button", {
              type: "button", class: "ghost icon", title: "Move up",
              "aria-label": "Move " + mod.title + " up",
              disabled: idx === 0 ? "disabled" : null,
              onClick: () => { moveDashboardModule(idx, idx - 1); render(); },
              text: "↑",
            }),
            h("button", {
              type: "button", class: "ghost icon", title: "Move down",
              "aria-label": "Move " + mod.title + " down",
              disabled: idx === state.dashboardLayout.length - 1 ? "disabled" : null,
              onClick: () => { moveDashboardModule(idx, idx + 1); render(); },
              text: "↓",
            }),
            h("label", { class: "dash-toggle", title: entry.visible ? "Hide" : "Show" }, [
              h("input", {
                type: "checkbox",
                checked: entry.visible ? "checked" : null,
                onChange: (e) => {
                  entry.visible = e.target.checked;
                  saveDashboardLayout();
                  render();
                },
              }),
              h("span", { text: entry.visible ? "Visible" : "Hidden" }),
            ]),
          ]),
          body
            ? h("div", { class: "dash-module-body" }, [body])
            : h("div", { class: "dash-module-body muted", text: "(nothing to show right now)" }),
        ]);

        // Simple HTML5 drag + drop reorder. Mobile users have the ↑/↓ btns.
        wrapper.addEventListener("dragstart", (e) => {
          wrapper.classList.add("dragging");
          try { e.dataTransfer.setData("text/plain", String(idx)); } catch (_) {}
          if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
        });
        wrapper.addEventListener("dragend", () => wrapper.classList.remove("dragging"));
        wrapper.addEventListener("dragover", (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "move"; });
        wrapper.addEventListener("drop", (e) => {
          e.preventDefault();
          let fromIdx = -1;
          try { fromIdx = parseInt(e.dataTransfer.getData("text/plain"), 10); } catch (_) {}
          if (!Number.isFinite(fromIdx) || fromIdx < 0) return;
          const toIdx = idx;
          moveDashboardModule(fromIdx, toIdx);
          render();
        });

        main.appendChild(wrapper);
      }

      return main;
    }

    function applianceIconName(kind) {
      switch (kind) {
        case "fridge": return "fridge";

    function statCard(opts) {
      // Back-compat with the old positional signature: statCard(label, value, kind, onClick)
      if (typeof opts === "string") {
        opts = { label: opts, value: arguments[1], kind: arguments[2] || "", onClick: arguments[3] || null };
      }
      const { label, value, kind = "", hint = "", onClick = null } = opts;
      const children = [
        h("div", { class: "stat-head" }, [
          h("div", { class: "stat-label", text: label }),
        ]),
        h("div", { class: "big", text: String(value) }),
        hint ? h("div", { class: "stat-hint", text: hint }) : null,
      ].filter(Boolean);
      if (onClick) {
        return h("button", {
          type: "button",
          class: "card dash-stat dash-stat-link " + kind,
          onClick,
        }, children);
      }
      return h("div", { class: "card dash-stat " + kind }, children);
    }

    function computeTotals() {
      let expired = 0, soon = 0, low = 0;
      for (const i of state.items) {
        const s = expirationState(i.expiration_date);
        if (s === "expired") expired++;
        else if (s === "soon") soon++;
        if (itemIsLow(i)) low++;
      }
      return { expired, soon, low };
    }
