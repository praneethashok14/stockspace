    function buildHeader() {
      // Full SVG wordmark that sits on the chrome colour (its background rect
      // is removed so the chrome shows through). --chrome-text is `#11182c`
      // on bright chromes and `#e8ecf7` on dark ones, so we read it to pick
      // which colour variant to show.
      const chromeText = getComputedStyle(document.documentElement)
        .getPropertyValue("--chrome-text").trim().toLowerCase();
      const chromeIsDark = chromeText !== "#11182c";
      const wordmarkImg = h("img", {
        src: chromeIsDark ? "/icons/wordmark-on-dark.svg" : "/icons/wordmark-on-light.svg",
        alt: "StockSpace",
        class: "wordmark-img",
      });
      // Logo is a button when signed in: tap sends you to the dashboard.
      // Falls back to a plain span on auth screens.
      const wordmark = state.authenticated
        ? h("button", {
            type: "button",
            class: "wordmark wordmark-btn",
            "aria-label": "Go to dashboard",
            onClick: () => {
              state.view = "dashboard";
              state.family = null;
              if (state.sidebarOpen && window.innerWidth <= 720) state.sidebarOpen = false;
              render();
            },
          }, [wordmarkImg])
        : h("span", { class: "wordmark" }, [wordmarkImg]);
      const titleChildren = [wordmark];
      if (state.authenticated && state.accountName) {
        titleChildren.push(h("span", { class: "pill", style: "margin-left:0.5rem;font-weight:500", text: state.accountName }));
      }
      const title = h("h1", {}, titleChildren);

      // Primary nav now lives exclusively in the sidebar (sb-nav section),
      // so the header no longer carries Dashboard / Appliances / Settings /
      // Lock buttons on any screen size.

      // Global search lives in the header. Typing jumps to the dashboard
      // view (where the search short-circuit shows a flat result list).
      const headerSearch = state.authenticated
        ? h("input", {
            type: "search",
            inputmode: "search",
            class: "header-search",
            placeholder: "Search inventory…",
            "aria-label": "Search inventory",
            value: state.filters.q,
            onInput: (e) => {
              state.filters.q = e.target.value;
              if (e.target.value.trim() && state.view !== "dashboard") {
                state.view = "dashboard";
                state.activeApplianceId = null;
              }
              render();
            },
          })
        : null;

      // Theme toggle
      const currentTheme = document.documentElement.dataset.theme || "auto";
      const themeBtn = h("button", {
        type: "button",
        class: "icon ghost theme-btn",
        "aria-label": "Toggle theme (current: " + currentTheme + ")",
        onClick: cycleTheme,
        text: currentTheme === "dark" ? "☾" : (currentTheme === "light" ? "☀" : "◐"),
      });

      // Row density toggle: cycles full → compact → grid → full. Shown as a
      // text pill (not an icon) so it reads clearly as a label and doesn't
      // get confused with the hamburger sidebar button next to it.
      const nextDensity = { full: "compact", compact: "grid", grid: "full" }[state.density];
      const densityGlyph = state.density === "grid" ? "▦" : (state.density === "compact" ? "▤" : "❏");
      const densityLabel = state.density.charAt(0).toUpperCase() + state.density.slice(1);
      const densityBtn = state.authenticated
        ? h("button", {
            type: "button",
            class: "ghost density-btn",
            "aria-label": "Switch to " + nextDensity + " view (current: " + state.density + ")",
            title: "Switch to " + nextDensity + " view",
            onClick: toggleDensity,
            text: densityGlyph + " " + densityLabel,
          })
        : null;

      // Install button (visible only when the browser has fired beforeinstallprompt
      // and the app is not already installed). Tapping triggers the native prompt.
      const extras = [densityBtn, themeBtn].filter(Boolean);
      if (state.installPromptAvailable && !state.isInstalled) {
        extras.unshift(h("button", {
          type: "button",
          class: "ghost install-btn",
          title: "Install StockSpace",
          onClick: triggerInstall,
        }, [icon("download"), h("span", { text: "Install" })]));
      }

      // Nav is handled by the left rail on desktop and the in-view
      // .primary-nav-wrap on mobile — the header stays clean, carrying
      // only wordmark + search + extras (no nav pills here).
      // Search sits as its own flex child of header.app so it can wrap
      // to a new row at narrow widths; extras cluster together on the
      // right via .header-right.
      const rightSide = h("div", { class: "header-right" }, extras.filter(Boolean));
      if (!headerSearch) title.style.flex = "1";
      const header = h("header", { class: "app" }, [
        title, headerSearch, rightSide,
      ].filter(Boolean));
      // Preserve focus + caret while typing causes a re-render.
      if (headerSearch && state.filters.q) {
        queueMicrotask(() => {
          const el = document.querySelector("header.app .header-search");
          if (!el || document.activeElement === el) return;
          el.focus();
          try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {}
        });
      }
      return header;
    }

    function cycleTheme() {
      const next = { auto: "light", light: "dark", dark: "auto" };
      const current = document.documentElement.dataset.theme || "auto";
      const nextTheme = next[current];
      if (nextTheme === "auto") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = nextTheme;
      try { localStorage.setItem("stockspace_theme", nextTheme); } catch (_) {}
      applyCustomTheme();
      queueServerPrefsSave();
      render();
    }

    function toggleDensity() {
      const next = { full: "compact", compact: "grid", grid: "full" };
      state.density = next[state.density] || "full";
      try { localStorage.setItem("stockspace_density", state.density); } catch (_) {}
      queueServerPrefsSave();
      render();
    }

    // ---------- Custom theme (user-chosen chrome + bg) ----------

    function effectiveColorScheme() {
      const dt = document.documentElement.dataset.theme;
      if (dt === "light" || dt === "dark") return dt;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    // Luminance-based contrast text colour. For a user-picked chrome bg we
    // return either our default dark text or default light text, whichever
    // reads better.
    function contrastText(hex) {
      if (typeof hex !== "string" || !/^#[0-9a-f]{6}$/i.test(hex)) return null;
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return lum > 0.55 ? "#11182c" : "#e8ecf7";
    }

    function applyCustomTheme() {
      const scheme = effectiveColorScheme();
      const t = state.customTheme;
      const chrome = scheme === "dark" ? t.chromeDark : t.chromeLight;
      const bg = scheme === "dark" ? t.bgDark : t.bgLight;
      const bgImage = scheme === "dark" ? t.bgImageDark : t.bgImageLight;
      const root = document.documentElement;
      if (chrome) {
        root.style.setProperty("--chrome", chrome);
        const txt = contrastText(chrome);
        if (txt) root.style.setProperty("--chrome-text", txt);
      } else {
        root.style.removeProperty("--chrome");
        root.style.removeProperty("--chrome-text");
      }
      // Solid-color background override; replaces the ambient gradient when set.
      if (bg) {
        root.style.setProperty("--bg-ambient", bg);
      } else {
        root.style.removeProperty("--bg-ambient");
      }
      // Image background (data URL or http URL). Blurred glass surfaces will
      // pick up its color — the whole app sits on top of this.
      if (bgImage) {
        root.style.setProperty("--bg-image", "url(" + JSON.stringify(bgImage) + ")");
      } else {
        root.style.removeProperty("--bg-image");
      }
      // Optional user accent color override.
      if (t.accent) {
        root.style.setProperty("--accent", t.accent);
      } else {
        root.style.removeProperty("--accent");
      }
      // Sync the browser URL-bar / status-bar color to the resolved chrome.
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        const resolved = chrome || getComputedStyle(root).getPropertyValue("--chrome").trim();
        if (resolved) meta.setAttribute("content", resolved);
      }
      // Keep the wordmark variant in sync with chrome darkness — not just
      // light/dark MODE, but the actual chrome colour's luminance. That way a
      // user who picks a dark chrome in light mode still gets the white-
      // content wordmark, and vice versa. This runs on every theme change
      // without waiting for the next render pass.
      try {
        const txtVar = getComputedStyle(root).getPropertyValue("--chrome-text").trim().toLowerCase();
        const dark = txtVar !== "#11182c";
        const src = dark ? "/icons/wordmark-on-dark.svg" : "/icons/wordmark-on-light.svg";
        for (const img of document.querySelectorAll(".wordmark-img")) {
          if (img.getAttribute("src") !== src) img.setAttribute("src", src);
        }
      } catch (_) {}
    }

    function saveCustomTheme() {
      try { localStorage.setItem("stockspace_custom_theme", JSON.stringify(state.customTheme)); }
      catch (_) {}
      queueServerPrefsSave();
    }

    // ---------- Server-synced preferences ----------
    //
    // The things we sync: theme (auto/light/dark), density, and the custom-
    // theme chrome/bg colours + accent. Deliberately NOT bgImageLight/Dark —
    // those are inlined data URLs that can get large, so they stay in
    // localStorage per device.
    //
    // On login we GET /api/account/preferences and merge in whatever the
    // server has (server wins for conflicting fields; a user who picks dark
    // on their phone should see dark on their laptop next time). On every
    // change we debounce-save back. localStorage is still written so first
    // paint on reload doesn't flash the wrong colours while we wait for the
    // server.
    function snapshotSyncedPrefs() {
      const t = state.customTheme || {};
      const theme = document.documentElement.dataset.theme || "auto";
      return {
        theme,
        density: state.density || "full",
        customTheme: {
          chromeLight: t.chromeLight || null,
          chromeDark: t.chromeDark || null,
          bgLight: t.bgLight || null,
          bgDark: t.bgDark || null,
          accent: t.accent || null,
        },
      };
    }

    let _prefsSaveTimer = null;
    let _prefsLastSerialized = null;
    function queueServerPrefsSave() {
      if (!state.authenticated) return;
      if (_prefsSaveTimer) clearTimeout(_prefsSaveTimer);
      _prefsSaveTimer = setTimeout(async () => {
        _prefsSaveTimer = null;
        const prefs = snapshotSyncedPrefs();
        const serialized = JSON.stringify(prefs);
        if (serialized === _prefsLastSerialized) return;
        try {
          await api("/api/account/preferences", {
            method: "PUT",
            body: { prefs },
          });
          _prefsLastSerialized = serialized;
        } catch (_) {
          // Non-fatal — localStorage still holds the newest value.
        }
      }, 400);
    }

    async function loadServerPrefs() {
      if (!state.authenticated) return;
      let resp;
      try {
        resp = await api("/api/account/preferences");
      } catch (_) {
        return;
      }
      const prefs = resp && resp.prefs && typeof resp.prefs === "object" ? resp.prefs : null;
      if (!prefs) return;
      _prefsLastSerialized = JSON.stringify({
        theme: prefs.theme,
        density: prefs.density,
        customTheme: prefs.customTheme,
      });
      if (prefs.theme === "light" || prefs.theme === "dark") {
        document.documentElement.dataset.theme = prefs.theme;
        try { localStorage.setItem("stockspace_theme", prefs.theme); } catch (_) {}
      } else if (prefs.theme === "auto") {
        delete document.documentElement.dataset.theme;
        try { localStorage.setItem("stockspace_theme", "auto"); } catch (_) {}
      }
      if (prefs.density === "full" || prefs.density === "compact" || prefs.density === "grid") {
        state.density = prefs.density;
        try { localStorage.setItem("stockspace_density", state.density); } catch (_) {}
      }
      const ct = prefs.customTheme && typeof prefs.customTheme === "object" ? prefs.customTheme : null;
      if (ct) {
        state.customTheme.chromeLight = typeof ct.chromeLight === "string" ? ct.chromeLight : null;
        state.customTheme.chromeDark = typeof ct.chromeDark === "string" ? ct.chromeDark : null;
        state.customTheme.bgLight = typeof ct.bgLight === "string" ? ct.bgLight : null;
        state.customTheme.bgDark = typeof ct.bgDark === "string" ? ct.bgDark : null;
        state.customTheme.accent = typeof ct.accent === "string" ? ct.accent : null;
        try { localStorage.setItem("stockspace_custom_theme", JSON.stringify(state.customTheme)); } catch (_) {}
      }
      applyCustomTheme();
    }

    // ---------- auth screens ----------

    function renderSignup() {
      let name = "", pin = "", confirm = "";
      const nameInput = h("input", {
        type: "text", maxlength: "60", required: true,
        autocomplete: "username",
        placeholder: "e.g. Pranee",
        onInput: (e) => { name = e.target.value; },
      });
      const pinInput = h("input", {
        type: "password", inputmode: "numeric", pattern: "[0-9]*", autocomplete: "new-password",
        maxlength: "12", required: true, class: "pin-input",
        "aria-label": "New PIN",
        onInput: (e) => { pin = e.target.value; },
      });
      const confirmInput = h("input", {
        type: "password", inputmode: "numeric", pattern: "[0-9]*", autocomplete: "new-password",
        maxlength: "12", required: true, class: "pin-input",
        "aria-label": "Confirm PIN",
        onInput: (e) => { confirm = e.target.value; },
      });
      const msg = h("div", { class: "muted", role: "alert" });

      const form = h("form", {
        onSubmit: async (e) => {
          e.preventDefault();
          msg.textContent = "";
          if (!name.trim()) { msg.textContent = "Please enter a name."; return; }
          if (!/^\d{4,12}$/.test(pin)) { msg.textContent = "PIN must be 4–12 digits."; return; }
          if (pin !== confirm) { msg.textContent = "PINs don't match."; return; }
          await withBusy("Creating account…", async () => {
            try {
              await signup(name.trim(), pin);
              toast(`Welcome, ${state.accountName}!`, "success");
              render();
            } catch (err) {
              const text = err.status === 409
                ? "That name is already in use. Try another, or log in with an existing PIN."
                : (err.message || "Could not create account.");
              msg.textContent = text;
              toast(text, "error");
            }
          });
        },
      }, [
        h("p", { class: "muted", text: "Create your account with a name and a 4–12 digit PIN. Each account has its own private inventory." }),
        h("label", {}, ["Name", nameInput]),
        h("label", {}, ["New PIN", pinInput]),
        h("label", {}, ["Confirm PIN", confirmInput]),
        msg,
        h("div", { class: "row", style: "justify-content:space-between;margin-top:0.75rem;gap:0.5rem;flex-wrap:wrap" }, [
          h("button", { type: "button", class: "ghost",
              onClick: () => { state.authMode = "login"; render(); },
              text: "Login with existing account" }),
          h("button", { type: "submit", class: "primary", text: "Create account" }),
        ]),
      ]);

      const main = h("main", { class: "app" }, [
        h("div", { class: "center-screen" }, [
          h("div", { class: "card stack" }, [
            h("h2", { style: "margin-top:0", text: "Welcome to StockSpace" }),
            form,
          ]),
        ]),
      ]);
      queueMicrotask(() => nameInput.focus());
      return main;
    }

    function renderLogin() {
      let name = "";
      let pin = "";
      const nameControl = h("input", {
        type: "text", maxlength: "60", required: true,
        autocomplete: "username",
        placeholder: "Account name",
        onInput: (e) => { name = e.target.value; },
      });
      const pinInput = h("input", {
        type: "password", inputmode: "numeric", pattern: "[0-9]*", autocomplete: "current-password",
        maxlength: "12", required: true, class: "pin-input",
        "aria-label": "PIN",
        onInput: (e) => { pin = e.target.value; },
      });
      const msg = h("div", { role: "alert" });

      const form = h("form", {
        onSubmit: async (e) => {
          e.preventDefault();
          msg.textContent = "";
          if (!name || !name.trim()) { msg.textContent = "Enter your account name."; return; }
          if (!/^\d{4,12}$/.test(pin)) { msg.textContent = "Enter the 4–12 digit PIN."; return; }
          await withBusy("Signing in…", async () => {
            try {
              await login(name.trim(), pin);
              toast(`Welcome back, ${state.accountName}.`, "success");
              render();
            } catch (err) {
              const text = err.status === 429
                ? "Too many attempts. Please wait a bit before trying again."
                : err.status === 0
                  ? "Could not reach the server."
                  : "Incorrect name or PIN.";
              msg.textContent = text;
              toast(text, "error");
              try { pinInput.focus(); pinInput.select(); } catch (_) {}
            }
          });
        },
      }, [
        h("p", { class: "muted", text: "Log in to your StockSpace account." }),
        h("label", {}, ["Account", nameControl]),
        h("label", {}, ["PIN", pinInput]),
        msg,
        h("div", { class: "row", style: "justify-content:space-between;margin-top:0.75rem;gap:0.5rem;flex-wrap:wrap" }, [
          h("button", { type: "button", class: "ghost",
            onClick: () => { state.authMode = "signup"; render(); },
            text: "Or create a new account" }),
          h("button", { type: "submit", class: "primary", text: "Log in" }),
        ]),
      ]);

      const main = h("main", { class: "app" }, [
        h("div", { class: "center-screen" }, [
          h("div", { class: "card stack" }, [
            h("h2", { style: "margin-top:0", text: "StockSpace is locked" }),
            form,
          ]),
        ]),
      ]);
      queueMicrotask(() => nameControl.focus());
      return main;
    }

    // ---------- dashboard ----------

    // ---------- dashboard modules ----------
    // Each module has an id, a human title (shown in edit mode), and a
    // render() that returns a DOM node (or null to render nothing). Order
    // and visibility come from state.dashboardLayout.
    const DASHBOARD_MODULES = {
      stats: {
        title: "Overview stats",
        render: () => {
          const totals = computeTotals();
          return h("section", { class: "dash-grid", "aria-label": "Overview" }, [
            statCard({
              label: "Appliances", value: state.appliances.length, iconName: "fridge", tone: "blue",
            }),
            statCard({
              label: "Groups", value: state.groups.length, iconName: "layers", tone: "purple",
            }),
            statCard({
              label: "Items", value: state.items.length, iconName: "box", tone: "green",
              hint: "Tap to view all",
              onClick: () => {
                state.view = "inventory";
                state.activeApplianceId = null;
                render();
              },
            }),
            statCard({
              label: "Expired", value: totals.expired, kind: "danger", iconName: "warn", tone: "red",
            }),
            statCard({
              label: "Expiring ≤ 7 d", value: totals.soon, kind: "warning", iconName: "clock", tone: "yellow",
            }),
          ]);

        title: "Expiring or expired items",
        render: () => {
          if (state.appliances.length === 0) return null;
          const soonItems = state.items
            .map(i => ({ i, state: expirationState(i.expiration_date) }))
            .filter(x => x.state === "expired" || x.state === "soon")
            .sort((a, b) => (a.i.expiration_date || "").localeCompare(b.i.expiration_date || ""));
          if (soonItems.length === 0) return null;
          const list = newItemsContainer();
          for (const { i } of soonItems.slice(0, 20)) {
            list.appendChild(renderInventoryItem(i, { showAppliance: true }));
          }
          return h("section", { class: "card stack", "aria-labelledby": "soon-h" }, [
            h("h2", { id: "soon-h", style: "margin-top:0", text: "Expiring or expired" }),
            list,
          ]);
        },
      },
      appliances: {
        title: "Appliance summaries",
        render: () => {
          if (state.appliances.length === 0) return null;
          const grid = h("section", { class: "dash-grid", "aria-label": "Appliances" });
          for (const a of state.appliances) {
            const items = state.items.filter(i => i.appliance_id === a.id);
            const preview = items.slice(0, 2).map(i => h("span", { class: "pill", text: i.name }));
            if (items.length > 2) {
              preview.push(h("span", { class: "pill muted", text: "+" + (items.length - 2) + " more" }));
            }
            const subBits = [a.kind];
            if (a.location) subBits.push(a.location);
            if (state.familyId && a.owner_account_name && a.owner_account_id !== state.accountId) {
              subBits.push("by " + a.owner_account_name);
            }
            const card = h("button", {
              class: "appliance-tile",
              onClick: () => { state.activeApplianceId = a.id; state.view = "appliance"; render(); },
            }, [
              h("div", { class: "tile-head" }, [
                h("span", { class: "tile-icon" }, [icon(applianceIconName(a.kind))]),
                h("div", {}, [
                  h("div", { class: "tile-name", text: a.name }),
                  h("div", { class: "tile-sub", text: subBits.join(" · ") }),
                ]),
              ]),
              h("div", { class: "tile-count" }, [
                h("b", { text: String(items.length) }),
                h("span", { text: pluralize("item", items.length) }),
              ]),
              preview.length ? h("div", { class: "tile-preview" }, preview) : null,
            ]);
            grid.appendChild(card);
          }
          // Trailing dashed "+ Add new" card for owners/sole accounts, so you
          // can start a new appliance from the dashboard grid.
          if (canEditStructure()) {
            const addCard = h("button", {
              class: "card dash-add-card",
              "aria-label": "Add a new appliance",
              onClick: () => openApplianceDialog(),
            }, [
              h("span", { class: "dash-add-plus", text: "+" }),
              h("span", { text: "Add new" }),
            ]);
            grid.appendChild(addCard);
          }
          return grid;
        },
      },
    };

    function saveDashboardLayout() {
      try {
        localStorage.setItem(
          "stockspace_dashboard_layout",
          JSON.stringify(state.dashboardLayout),
        );
      } catch (_) {}
    }

    function moveDashboardModule(fromIdx, toIdx) {
      if (toIdx < 0 || toIdx >= state.dashboardLayout.length || fromIdx === toIdx) return;
      const [row] = state.dashboardLayout.splice(fromIdx, 1);
      state.dashboardLayout.splice(toIdx, 0, row);
      saveDashboardLayout();
    }

    // Nav entries used by both the header pill group and the thin left rail.
    function navEntries() {
      const list = [
        ["dashboard", "Dashboard", "home"],
        ["inventory", "All Inventory", "list"],
      ];
      if (state.appliances.length > 10) {
        list.push(["appliances", "Appliances", "fridge"]);
      }
      list.push(["settings", "Settings", "cog"]);
      return list;
    }

    // The glass pill nav itself (no wrapper). Used both in the header on
    // desktop and inside .primary-nav-wrap on narrow screens.
    function primaryNavInline(activeView) {
      const nav = h("nav", { class: "primary-nav", "aria-label": "Primary" });
      for (const [view, label, iconName] of navEntries()) {
        const isActive = view === activeView;
        nav.appendChild(h("button", {
          type: "button",
          title: label,
          "aria-current": isActive ? "true" : "false",
          onClick: () => {
            if (view === state.view) return;
            state.view = view;
            if (view === "inventory" || view === "appliances") state.activeApplianceId = null;
            if (view === "settings") state.family = null;
            render();
          },
        }, [icon(iconName), h("span", { class: "nav-label", text: label })]));
      }
      nav.appendChild(h("button", {
        type: "button",
        class: "lock-btn",
        title: "Lock",
        onClick: () => { lock(); },
      }, [icon("lock"), h("span", { class: "nav-label", text: "Lock" })]));
      return nav;
    }

    // Wrapped version — used only on narrow screens inside each view.
    function primaryNav(activeView) {
      return h("div", { class: "primary-nav-wrap" }, [primaryNavInline(activeView)]);
    }

    // Thin left rail — icon-only, docked mid-left on wide screens. Mirrors
    // the reel's visual language exactly: pill-shaped glass column with
    // circular icon buttons stacked, active state in amber.
    let $rail = null;
    function ensureRail() {
      if ($rail) return;
      $rail = document.createElement("aside");
      $rail.className = "rail";
      $rail.setAttribute("aria-label", "Shortcuts");
      document.body.appendChild($rail);
      attachRailLiquidDrag($rail);
    }

    // iOS 26/27 "Liquid Glass" drag: pressing a rail button and dragging
    // along the rail stretches the active-pill indicator toward the
    // pointer, previews whichever button you're hovering, then settles
    // on release — either back home or on a new view. Honors
    // prefers-reduced-motion by skipping the stretch.
    function attachRailLiquidDrag(rail) {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let drag = null;  // null when idle, object while dragging
      let onMove = null, onUp = null;

      // Block the default click; we route navigation ourselves on pointerup
      // so a drag that ends over a different button navigates there and
      // a drag that ends over the same button doesn't double-fire.
      rail.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-view], button.lock-btn");
        if (btn && drag !== false) { /* fall through */ }
      }, true);

      rail.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        const startBtn = e.target.closest("button[data-view], button.lock-btn");
        if (!startBtn) return;
        const indicator = rail.querySelector(".rail-indicator");
        if (!indicator) return;
        const railBox = rail.getBoundingClientRect();
        const activeBtn = rail.querySelector('button[aria-current="true"]') || startBtn;
        const anchorBox = activeBtn.getBoundingClientRect();
        drag = {
          startBtn,
          pointerId: e.pointerId,
          anchorY: anchorBox.top - railBox.top,
          anchorH: anchorBox.height,
          anchorW: anchorBox.width,
          startY: e.clientY,
          moved: false,
        };
        rail.classList.add("dragging");
        e.preventDefault();  // stop the browser from synthesising a click

        onMove = (ev) => {
          if (!drag || ev.pointerId !== drag.pointerId) return;
          const dy = ev.clientY - drag.startY;
          if (Math.abs(dy) > 3) drag.moved = true;
          if (reduceMotion) return;
          const over = document.elementFromPoint(ev.clientX, ev.clientY);
          const hoverBtn = over && over.closest
            ? over.closest(".rail button[data-view], .rail button.lock-btn")
            : null;
          const rb = rail.getBoundingClientRect();
          let targetY = drag.anchorY, targetH = drag.anchorH;
          if (hoverBtn) {
            const hb = hoverBtn.getBoundingClientRect();
            targetY = hb.top - rb.top;
            targetH = hb.height;
          }
          // Capsule stretch between the anchor button and the hovered one.
          const top = Math.min(drag.anchorY, targetY);
          const bot = Math.max(drag.anchorY + drag.anchorH, targetY + targetH);
          indicator.style.transform = `translate(-50%, ${top}px)`;
          indicator.style.height = `${bot - top}px`;
          indicator.style.width = `${drag.anchorW}px`;
          indicator.style.borderRadius = `${drag.anchorW / 2}px`;
          indicator.style.opacity = "1";
        };
        onUp = (ev) => {
          if (!drag || ev.pointerId !== drag.pointerId) return;
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          rail.classList.remove("dragging");
          const indicator = rail.querySelector(".rail-indicator");
          if (indicator) indicator.style.borderRadius = "";  // revert to CSS
          const over = document.elementFromPoint(ev.clientX, ev.clientY);
          const target = (over && over.closest(".rail button[data-view], .rail button.lock-btn"))
            || drag.startBtn;
          drag = null;
          // Route via the button's own handler so navigation + state
          // changes stay in one place. Programmatic click bypasses the
          // click-suppression above.
          if (target && target.isConnected) target.click();
          requestAnimationFrame(positionRailIndicator);
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    }

    // iOS 26/27 Liquid-glass press on EVERY button (rail buttons too).
    // Press alone scales to ~0.94; drag then stretches the button along
    // the drag axis and compresses the perpendicular one, with the
    // translation following the pointer (damped). The result is a
    // liquid-blob deformation that leans into the drag. Release springs
    // back via a brief transition. Skipped under reduced motion.
    (function attachGlobalLiquidPress() {
      if (typeof document === "undefined") return;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) return;
      const STRETCH = 0.18;   // max added scale along the drag axis
      const SQUASH = 0.08;    // max taken from the perpendicular axis
      const LEAN = 10;        // max px of translation at full drag
      const RANGE = 70;       // px of pointer travel that saturates the effect
      let drag = null, onMove = null, onUp = null;

      document.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 && e.pointerType === "mouse") return;
        const btn = e.target.closest && e.target.closest("button");
        if (!btn) return;
        if (btn.disabled) return;
        drag = { btn, sx: e.clientX, sy: e.clientY, pid: e.pointerId };
        // Kill any inflight spring-back transition so the follow is live.
        btn.style.transition = "transform 0ms linear";
        onMove = (ev) => {
          if (!drag || ev.pointerId !== drag.pid) return;
          const dx = ev.clientX - drag.sx;
          const dy = ev.clientY - drag.sy;
          // Normalised magnitudes along each axis (−1..1).
          const nx = Math.max(-1, Math.min(1, dx / RANGE));
          const ny = Math.max(-1, Math.min(1, dy / RANGE));
          // Non-uniform scale — stretch along the dominant drag axis,
          // squash the other. Base scale 0.94 (the press shrink).
          const base = 0.94;
          const sX = base + Math.abs(nx) * STRETCH - Math.abs(ny) * SQUASH;
          const sY = base + Math.abs(ny) * STRETCH - Math.abs(nx) * SQUASH;
          const tx = nx * LEAN;
          const ty = ny * LEAN;
          drag.btn.style.transform = `translate(${tx}px, ${ty}px) scale(${sX}, ${sY})`;
        };
        onUp = (ev) => {
          if (!drag) return;
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          const b = drag.btn;
          drag = null;
          // Spring back via a brief liquid-press transition, then clear.
          b.classList.add("liquid-press");
          b.style.transition = "";
          b.style.transform = "";
          window.setTimeout(() => b.classList.remove("liquid-press"), 320);
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    })();

    // Signature of what's currently inside the rail; only rebuild when
    // this changes, so the floating pill indicator can keep its own DOM
    // and animate between buttons instead of jumping on every render.
    let railSignature = "";
    function updateRail() {
      // Even on the lock / signup screen we keep the rail as a chrome
      // column so the frame of the app stays consistent. It just has no
      // interactive items until the user signs in.
      ensureRail();
      const entries = state.authenticated ? navEntries() : [];
      const nextSig = (state.authenticated ? "auth:" : "lock:") + entries.map(e => e[0]).join(",");
      if (nextSig !== railSignature) {
        rebuildRail(entries);
        railSignature = nextSig;
      }
      // Flip aria-current across the existing buttons and re-position the
      // indicator. The CSS transition on the indicator does the slide.
      for (const btn of $rail.querySelectorAll("button[data-view]")) {
        const v = btn.getAttribute("data-view");
        btn.setAttribute("aria-current", state.view === v ? "true" : "false");
      }
      requestAnimationFrame(positionRailIndicator);
    }

    function rebuildRail(entries) {
      $rail.textContent = "";
      // Floating active-pill — slides between buttons on page change.
      $rail.appendChild(h("span", { class: "rail-indicator", "aria-hidden": "true" }));
      for (const [view, label, iconName] of entries) {
        $rail.appendChild(h("button", {
          type: "button",
          title: label,
          "aria-label": label,
          "data-view": view,
          onClick: () => {
            if (view === state.view) return;
            state.view = view;
            if (view === "inventory" || view === "appliances") state.activeApplianceId = null;
            if (view === "settings") state.family = null;
            render();
          },
        }, [icon(iconName)]));
      }
      if (entries.length) {
        $rail.appendChild(h("div", { class: "rail-spacer", "aria-hidden": "true" }));
        $rail.appendChild(h("div", { class: "rail-sep", "aria-hidden": "true" }));
        $rail.appendChild(h("button", {
          type: "button",
          class: "lock-btn",
          title: "Lock",
          "aria-label": "Lock",
          onClick: () => lock(),
        }, [icon("lock")]));
      }
    }

    // Measure the currently-active nav button and park the floating
    // pill behind it. The CSS transition on transform/height does the
    // actual iOS-style slide between pages. On the very first position
    // we snap instantly (no slide from off-screen).
    function positionRailIndicator() {
      if (!$rail) return;
      const indicator = $rail.querySelector(".rail-indicator");
      const active = $rail.querySelector('button[aria-current="true"]');
      if (!indicator) return;
      if (!active) { indicator.style.opacity = "0"; return; }
      const railBox = $rail.getBoundingClientRect();
      const btnBox = active.getBoundingClientRect();
      const y = btnBox.top - railBox.top;
      const firstPlacement = indicator.style.opacity !== "1";
      if (firstPlacement) indicator.style.transition = "none";
      indicator.style.transform = `translate(-50%, ${y}px)`;
      indicator.style.height = `${btnBox.height}px`;
      indicator.style.width = `${btnBox.width}px`;
      indicator.style.opacity = "1";
      if (firstPlacement) {
        void indicator.offsetHeight;  // flush
        requestAnimationFrame(() => { indicator.style.transition = ""; });
      }
    }
    if (typeof window !== "undefined") {
      window.addEventListener("resize", () => requestAnimationFrame(positionRailIndicator));
    }

    function renderDashboard() {
      const main = h("main", { class: "app" });
      const editing = state.dashboardEditing;

      main.appendChild(primaryNav("dashboard"));

      // Toolbar: Edit layout / Done + (edit-only) Reset.
      const toolbar = h("div", {
        class: "row",
        style: "justify-content:flex-end;gap:0.4rem;margin-bottom:0.75rem;flex-wrap:wrap",
      }, [
        editing
          ? h("button", {
              type: "button", class: "ghost",
              onClick: () => {
                state.dashboardLayout = [
                  { id: "stats", visible: true },
                  { id: "expiring", visible: true },
                  { id: "appliances", visible: true },
                ];
                saveDashboardLayout();
                render();
              },
              text: "Reset layout",
            })
          : null,
        h("button", {
          type: "button",
          class: editing ? "primary" : "ghost",
          onClick: () => {
            state.dashboardEditing = !state.dashboardEditing;
            if (!state.dashboardEditing) saveDashboardLayout();
            render();
          },
          text: editing ? "Done" : "✎ Edit layout",
        }),
      ]);
      main.appendChild(toolbar);

      // Search short-circuit: when the header search has text, show a flat
      // result list instead of the normal dashboard. Only applies when NOT
      // editing (so you can rearrange with a query present).
      if (!editing && state.filters.q.trim()) {
        const matches = applyFilters(state.items);
        if (matches.length === 0) {
          main.appendChild(h("div", { class: "card empty" }, [
            h("h3", { style: "margin-top:0", text: "No matches" }),
            h("p", { class: "muted", text: `Nothing found for "${state.filters.q.trim()}". Try different terms or clear the search.` }),
          ]));
          return main;
        }
        const list = newItemsContainer();
        for (const i of matches) list.appendChild(renderInventoryItem(i, { showAppliance: true }));
        main.appendChild(h("section", { class: "card stack", "aria-label": "Search results" }, [
          h("h2", { style: "margin:0;font-size:1.1rem", text: `${matches.length} ${pluralize("result", matches.length)}` }),
          list,
        ]));
        return main;
      }

      // No-appliances empty state only when NOT editing (so the user can
      // still rearrange their layout on a fresh account).
      if (!editing && state.appliances.length === 0) {
        if (canEditStructure()) {
          main.appendChild(emptyState(
            "No appliances yet",
            "Start by adding a fridge or freezer.",
            () => { state.view = "appliances"; render(); },
            "Add an appliance",
          ));
        } else {
          main.appendChild(emptyState(
            "No appliances yet",
            "Your family's owners haven't added any appliances.",
          ));
        }
        return main;
      }

      // Render modules in layout order. In edit mode, every module shows
      // (even if invisible) wrapped with reorder + toggle controls. Outside
      // edit mode, only visible modules render.
      for (let idx = 0; idx < state.dashboardLayout.length; idx++) {
        const entry = state.dashboardLayout[idx];
        const mod = DASHBOARD_MODULES[entry.id];
        if (!mod) continue;
        if (!editing && !entry.visible) continue;

        const body = mod.render();
        if (!editing) {
          if (body) {
            body.classList.add("dash-module");
            main.appendChild(body);
          }
          continue;
        }

        // Edit-mode wrapper: drag handle, title, move buttons, visibility.
        const wrapper = h("div", {
          class: "dash-module dash-module-edit" + (entry.visible ? "" : " hidden-mod"),
          draggable: "true",
          "data-idx": String(idx),
        }, [
          h("div", { class: "dash-module-head" }, [
            h("span", { class: "dash-drag", title: "Drag to reorder", "aria-hidden": "true", text: "⋮⋮" }),
            h("strong", { text: mod.title, style: "flex:1" }),
            h("button", {
              type: "button", class: "ghost icon", title: "Move up",
              "aria-label": "Move " + mod.title + " up",
              disabled: idx === 0 ? "disabled" : null,
              onClick: () => { moveDashboardModule(idx, idx - 1); render(); },
              text: "↑",
            }),
            h("button", {
              type: "button", class: "ghost icon", title: "Move down",
              "aria-label": "Move " + mod.title + " down",
              disabled: idx === state.dashboardLayout.length - 1 ? "disabled" : null,
              onClick: () => { moveDashboardModule(idx, idx + 1); render(); },
              text: "↓",
            }),
            h("label", { class: "dash-toggle", title: entry.visible ? "Hide" : "Show" }, [
              h("input", {
                type: "checkbox",
                checked: entry.visible ? "checked" : null,
                onChange: (e) => {
                  entry.visible = e.target.checked;
                  saveDashboardLayout();
                  render();
                },
              }),
              h("span", { text: entry.visible ? "Visible" : "Hidden" }),
            ]),
          ]),
          body
            ? h("div", { class: "dash-module-body" }, [body])
            : h("div", { class: "dash-module-body muted", text: "(nothing to show right now)" }),
        ]);

        // Simple HTML5 drag + drop reorder. Mobile users have the ↑/↓ btns.
        wrapper.addEventListener("dragstart", (e) => {
          wrapper.classList.add("dragging");
          try { e.dataTransfer.setData("text/plain", String(idx)); } catch (_) {}
          if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
        });
        wrapper.addEventListener("dragend", () => wrapper.classList.remove("dragging"));
        wrapper.addEventListener("dragover", (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "move"; });
        wrapper.addEventListener("drop", (e) => {
          e.preventDefault();
          let fromIdx = -1;
          try { fromIdx = parseInt(e.dataTransfer.getData("text/plain"), 10); } catch (_) {}
          if (!Number.isFinite(fromIdx) || fromIdx < 0) return;
          const toIdx = idx;
          moveDashboardModule(fromIdx, toIdx);
          render();
        });

        main.appendChild(wrapper);
      }

      return main;
    }

    // Compact icon helpers. Each returns an inline SVG string so we can drop
    // it into innerHTML without pulling in a sprite system.
    function icon(name) {
      const paths = {
        box:      '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5"/><path d="M12 12v9"/>',
        layers:   '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
        clock:    '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        warn:     '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17v.5"/>',
        fridge:   '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 11h14"/><path d="M8 7v2M8 14v3"/>',
        freezer:  '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 7v10M8 9l8 6M16 9l-8 6"/>',
        shelf:    '<path d="M3 5h18M3 12h18M3 19h18"/>',
        pkg:      '<path d="m12 2 10 5v10l-10 5L2 17V7l10-5Z"/><path d="M2 7l10 5 10-5"/><path d="M12 12v10"/>',
        home:     '<path d="M3 11.5 12 3l9 8.5V21H3V11.5Z"/><path d="M9 21v-7h6v7"/>',
        list:     '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
        cog:      '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4.9a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.5a7 7 0 0 0-2 1.2l-2.4-.9-2 3.5 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.5 2.4-.9a7 7 0 0 0 2 1.2L10 21h4l.5-2.5a7 7 0 0 0 2-1.2l2.4.9 2-3.5-2-1.5a7 7 0 0 0 .1-1.2Z"/>',
        lock:     '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4"/>',
        download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/>',
      };
      const d = paths[name] || paths.box;
      const svg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
      const span = document.createElement("span");
      span.innerHTML = svg;
      return span.firstChild;
    }

    function applianceIconName(kind) {
      switch (kind) {
        case "fridge": return "fridge";
        case "freezer": return "freezer";
        case "shelf": return "shelf";
        default: return "pkg";
      }
    }

    // Palette for stat tile icon chips. Keyed by `tone` on the opts.
    const STAT_TONES = {
      amber:  "#ff8a3d",
      blue:   "#5aa8ff",
      green:  "#4bd38f",
      red:    "#ff6273",
      yellow: "#ffc85a",
      purple: "#b388ff",
    };

    function statCard(opts) {
      // Back-compat with the old positional signature: statCard(label, value, kind, onClick)
      if (typeof opts === "string") {
        opts = { label: opts, value: arguments[1], kind: arguments[2] || "", onClick: arguments[3] || null };
      }
      const { label, value, kind = "", iconName = "box", hint = "", onClick = null, tone = "amber" } = opts;
      const tint = STAT_TONES[tone] || STAT_TONES.amber;
      const children = [
        h("div", { class: "stat-head" }, [
          h("div", { class: "stat-label", text: label }),
          h("span", { class: "stat-icon" }, [icon(iconName)]),
        ]),
        h("div", { class: "big", text: String(value) }),
        hint ? h("div", { class: "stat-hint", text: hint }) : null,
      ].filter(Boolean);
      const style = "--accent-tint:" + tint + ";";
      if (onClick) {
        return h("button", {
          type: "button",
          class: "card dash-stat dash-stat-link " + kind,
          style,
          onClick,
        }, children);
      }
      return h("div", { class: "card dash-stat " + kind, style }, children);
    }

    function computeTotals() {
      let expired = 0, soon = 0;
      for (const i of state.items) {
        const s = expirationState(i.expiration_date);
        if (s === "expired") expired++;
        else if (s === "soon") soon++;
      }
      return { expired, soon };
    }

    function openApplianceDialog(existing) {
      const isEdit = !!existing;
      const data = {
        name: existing?.name || "",
        kind: existing?.kind || "fridge",
        location: existing?.location || "",
        description: existing?.description || "",
      };
      const err = h("div", { role: "alert", class: "muted" });
      openDialog({
        title: isEdit ? "Edit appliance" : "Add appliance",
        body: h("form", {
          id: "appliance-form",
          onSubmit: async (e) => {
            e.preventDefault();
            err.textContent = "";
            if (!data.name.trim()) { err.textContent = "Name is required."; return; }
            await withBusy("Saving…", async () => {
              try {
                if (isEdit) {
                  await api("/api/appliances/" + encodeURIComponent(existing.id), {
                    method: "PATCH",
                    body: {
                      name: data.name,
                      kind: data.kind,
                      location: data.location,
                      description: data.description,
                    },
                  });
                } else {
                  await api("/api/appliances", {
                    method: "POST",
                    body: {
                      name: data.name,
                      kind: data.kind,
                      location: data.location || null,
                      description: data.description || null,
                    },
                  });
                }
                await reloadInventory();
                toast(isEdit ? "Appliance updated." : "Appliance added.", "success");
                closeDialog();
                render();
              } catch (e2) {
                err.textContent = e2.message;
              }
            });
          },
        }, [
          h("label", {}, ["Name",
            h("input", { type: "text", required: true, maxlength: "200", value: data.name,
              onInput: (e) => { data.name = e.target.value; } }),
          ]),
          h("label", {}, ["Type",
            selectEl([
              ["fridge", "Fridge"],
              ["freezer", "Freezer"],
              ["shelf", "Shelf"],
              ["other", "Other"],
            ], data.kind, (v) => { data.kind = v; }),
          ]),
          h("label", {}, ["Location (optional)",
            h("input", { type: "text", value: data.location, maxlength: "200",
              onInput: (e) => { data.location = e.target.value; } }),
          ]),
          h("label", {}, ["Description (optional)",
            h("textarea", { onInput: (e) => { data.description = e.target.value; }, text: data.description }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: closeDialog },
          { label: isEdit ? "Save" : "Add", primary: true, submit: "appliance-form" },
        ],
      });
    }

    async function deleteApplianceFlow(appliance) {
      const items = state.items.filter(i => i.appliance_id === appliance.id);
      const groups = state.groups.filter(g => g.appliance_id === appliance.id);
      const totalChildren = items.length + groups.length;
      if (totalChildren === 0) {
        if (!confirm(`Delete "${appliance.name}"? This cannot be undone.`)) return;
        await withBusy("Deleting…", async () => {
          await api("/api/appliances/" + encodeURIComponent(appliance.id), { method: "DELETE" });
          await reloadInventory();
          toast("Appliance deleted.", "success");
          render();
        });
        return;
      }
      // Non-empty: let the user choose a strategy.
      let strategy = "move";
      let moveTo = state.appliances.find(a => a.id !== appliance.id)?.id || "";
      const err = h("div", { class: "muted", role: "alert" });
      const moveSelect = selectEl(
        state.appliances.filter(a => a.id !== appliance.id).map(a => [a.id, a.name]),
        moveTo,
        (v) => { moveTo = v; },
      );
      openDialog({
        title: `Delete "${appliance.name}"`,
        body: h("div", { class: "stack" }, [
          h("p", { text: `This appliance holds ${items.length} ${pluralize("item", items.length)} and ${groups.length} ${pluralize("group", groups.length)}. Choose what happens to them:` }),
          h("fieldset", { style: "border:none;padding:0" }, [
            radioEl("del-strat", "move", strategy === "move", "Move contents to another appliance", (v) => { strategy = v; }),
            moveSelect,
            radioEl("del-strat", "cascade", strategy === "cascade", "Delete contents permanently", (v) => { strategy = v; }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: closeDialog },
          { label: "Delete appliance", primary: true, danger: true, onClick: async () => {
              err.textContent = "";
              if (strategy === "move") {
                if (!moveTo) { err.textContent = "Pick a destination appliance."; return; }
              }
              await withBusy("Deleting…", async () => {
                try {
                  let url = "/api/appliances/" + encodeURIComponent(appliance.id) + "?strategy=" + strategy;
                  if (strategy === "move") url += "&move_to=" + encodeURIComponent(moveTo);
                  await api(url, { method: "DELETE" });
                  await reloadInventory();
                  toast("Appliance deleted.", "success");
                  closeDialog();
                  render();
                } catch (e2) {
                  err.textContent = e2.message;
                }
              });
            } },
        ],
      });
    }

    function renderFilters() {
      const wrap = h("div", { class: "card stack" });
      wrap.appendChild(h("div", { class: "filters" }, [
        h("label", {}, ["Search",
          h("input", { type: "search", placeholder: "Name or group", value: state.filters.q,
            onInput: (e) => { state.filters.q = e.target.value; render(); } }),
        ]),
        h("label", {}, ["Appliance",
          selectEl(
            [["", "Any"]].concat(state.appliances.map(a => [a.id, a.name])),
            state.filters.applianceId,
            (v) => { state.filters.applianceId = v; render(); },
          ),
        ]),
        h("label", {}, ["Tracking",
          selectEl([
            ["", "Any"],
            ["individual", "Individual"],
            ["pack", "Pack"],
          ], state.filters.tracking, (v) => { state.filters.tracking = v; render(); }),
        ]),
        h("label", {}, ["Pack status",
          selectEl([
            ["", "Any"],
            ["opened", "Opened"],
            ["unopened", "Unopened"],
          ], state.filters.packStatus, (v) => { state.filters.packStatus = v; render(); }),
        ]),
        h("label", {}, ["Expiration",
          selectEl([
            ["", "Any"],
            ["expired", "Expired"],
            ["soon", "Expiring ≤7 days"],
            ["ok", "Fine"],
            ["none", "No date"],
          ], state.filters.expiration, (v) => { state.filters.expiration = v; render(); }),
        ]),
        state.tags.length > 0
          ? h("label", {}, ["Tag",
              selectEl(
                [["", "Any"]].concat(state.tags.map(t => [t.id, t.name])),
                state.filters.tag,
                (v) => { state.filters.tag = v; render(); },
              ),
            ])
          : null,
        h("label", {}, ["Sort",
          selectEl([
            ["name", "Name"],
            ["expiration", "Expiration"],
            ["quantity", "Quantity"],
            ["appliance", "Appliance"],
          ], state.sort, (v) => { state.sort = v; render(); }),
        ]),
      ]));
      if (Object.values(state.filters).some(Boolean)) {
        wrap.appendChild(h("div", { class: "row", style: "justify-content:flex-end" }, [
          h("button", { class: "ghost", onClick: clearFilters, text: "Clear filters" }),
        ]));
      }
      return wrap;
    }

    function clearFilters() {
      state.filters = { q: "", applianceId: "", category: "", tracking: "", packStatus: "", expiration: "", tag: "" };
      render();
    }

    function applyFilters(items) {
      const f = state.filters;
      const q = (f.q || "").trim().toLowerCase();
      let out = items.filter(i => {
        if (f.applianceId && i.appliance_id !== f.applianceId) return false;
        if (f.tracking && i.tracking !== f.tracking) return false;
        if (f.packStatus) {
          if (i.tracking !== "pack") return false;
          if (i.pack_status !== f.packStatus) return false;
        }
        if (f.expiration) {
          if (expirationState(i.expiration_date) !== f.expiration) return false;
        }
        if (f.tag) {
          if (!Array.isArray(i.tag_ids) || !i.tag_ids.includes(f.tag)) return false;
        }
        if (q) {
          const groupName = i.group_id ? (state.groups.find(g => g.id === i.group_id)?.name || "") : "";
          const applianceName = state.appliances.find(a => a.id === i.appliance_id)?.name || "";
          const parts = [
            i.name,
            groupName,
            applianceName,
            i.category,
            i.notes,
            i.tracking === "individual" ? i.unit : i.pack_label,
            i.tracking === "pack" ? i.pack_status : "",
          ].filter(Boolean);
          const hay = parts.join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      out.sort(compareItems);
      return out;
    }

    function compareItems(a, b) {
      switch (state.sort) {
        case "expiration":
          return (a.expiration_date || "~").localeCompare(b.expiration_date || "~");
        case "quantity": {
          const qa = a.tracking === "individual" ? (a.quantity || 0) : (a.pack_count || 0);
          const qb = b.tracking === "individual" ? (b.quantity || 0) : (b.pack_count || 0);
          return qb - qa;
        }
        case "appliance": {
          const an = state.appliances.find(x => x.id === a.appliance_id)?.name || "";
          const bn = state.appliances.find(x => x.id === b.appliance_id)?.name || "";
          return an.localeCompare(bn) || a.name.localeCompare(b.name);
        }
        default:
          return a.name.localeCompare(b.name);
      }
    }

    // ---------- items rendering ----------

    const GRID_LAYOUT_STYLE =
      "display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.6rem;padding:0.6rem";

    function tagPillsFor(item) {
      if (!Array.isArray(item.tag_ids) || item.tag_ids.length === 0) return [];
      const byId = new Map(state.tags.map(t => [t.id, t]));
      const out = [];
      for (const tid of item.tag_ids) {
        const t = byId.get(tid);
        if (!t) continue; // orphaned (deleted tag) — silently drop
        out.push(h("span", { class: "pill accent", text: t.name }));
      }
      return out;
    }

    function newItemsContainer() {
      return state.density === "grid"
        ? h("div", { style: GRID_LAYOUT_STYLE })
        : h("div", { class: "stack" });
    }

    function renderGroupedItems(items, groups, opts) {
      const container = h("div", { class: "stack" });
      // Grouped items first (one <details> per group, nested by depth),
      // then ungrouped flat.
      const groupMap = new Map(groups.map(g => [g.id, g]));
      const byGroup = new Map();
      const ungrouped = [];
      for (const item of items) {
        if (item.group_id && groupMap.has(item.group_id)) {
          if (!byGroup.has(item.group_id)) byGroup.set(item.group_id, []);
          byGroup.get(item.group_id).push(item);
        } else {
          ungrouped.push(item);
        }
      }
      // Even empty groups are displayed so the user can see them.
      for (const g of groups) if (!byGroup.has(g.id)) byGroup.set(g.id, []);
      // Walk groups in tree order (DFS) so nested groups render under
      // their parents in the correct sequence; indent by depth.
      const applianceId = groups[0]?.appliance_id;
      const tree = applianceId ? buildGroupTree(applianceId) : [];
      const inThisBatch = new Set(groups.map(g => g.id));
      for (const { g, depth } of tree) {
        if (!inThisBatch.has(g.id)) continue;
        const groupItems = byGroup.get(g.id) || [];
        const summaryActions = [
          h("button", { class: "ghost", onClick: (e) => { e.preventDefault(); e.stopPropagation(); openItemDialog(null, g.appliance_id, g.id); }, text: "+ Variant" }),
          h("button", { class: "ghost", onClick: (e) => { e.preventDefault(); e.stopPropagation(); openGroupDialog(null, g.appliance_id, g.id); }, text: "+ Subgroup" }),
          h("button", { class: "ghost", onClick: (e) => { e.preventDefault(); e.stopPropagation(); openGroupDialog(g); }, text: "Edit" }),
          h("button", { class: "ghost danger", onClick: (e) => { e.preventDefault(); e.stopPropagation(); deleteGroupFlow(g); }, text: "Delete" }),
        ];
        const summary = h("summary", {}, [
          h("strong", { text: g.name }),
          h("span", { class: "pill", text: groupItems.length + " " + pluralize("variant", groupItems.length) }),
          h("div", { class: "row", style: "margin-left:auto" }, summaryActions),
        ]);
        const indent = depth > 0
          ? `margin-left:${Math.min(depth, 4) * 1.1}rem;`
          : "";
        const details = h("details", {
          class: "inv-group",
          open: true,
          style: indent,
        }, [summary]);
        if (groupItems.length === 0) {
          details.appendChild(h("div", { class: "inv-item" }, [
            h("div", { class: "muted", text: "No variants yet." }),
          ]));
        } else {
          groupItems.sort(compareItems);
          if (state.density === "grid") {
            const body = h("div", { style: GRID_LAYOUT_STYLE });
            for (const item of groupItems) body.appendChild(renderInventoryItem(item, opts));
            details.appendChild(body);
          } else {
            for (const item of groupItems) details.appendChild(renderInventoryItem(item, opts));
          }
        }
        container.appendChild(details);
      }
      if (ungrouped.length > 0) {
        ungrouped.sort(compareItems);

        // Visually pair ungrouped pack-based items that are variants of the
        // same thing: same appliance, same case-insensitive name, same
        // pack_label. If two or more such items exist, show them under one
        // mini-heading so opened/unopened pairs appear together.
        const pairKey = (item) =>
          item.tracking === "pack"
            ? item.appliance_id + "|" +
              (item.name || "").trim().toLowerCase() + "|" +
              (item.pack_label || "").toLowerCase()
            : null;
        const packClusters = new Map(); // key -> items[]
        const singles = [];
        for (const i of ungrouped) {
          const k = pairKey(i);
          if (!k) { singles.push(i); continue; }
          if (!packClusters.has(k)) packClusters.set(k, []);
          packClusters.get(k).push(i);
        }
        // Clusters of size 1 are just singles.
        for (const [k, arr] of packClusters) {
          if (arr.length < 2) {
            singles.push(...arr);
            packClusters.delete(k);
          }
        }

        const wrap = h("div", { class: "inv-group" }, [
          h("div", { style: "padding:0.75rem 1rem;background:var(--surface-2);font-weight:600" }, [
            h("span", { text: "Ungrouped" }),
          ]),
        ]);

        if (state.density === "grid") {
          // Grid mode flattens pack-cluster headings — the photo tiles make
          // variants visually distinct enough on their own.
          const all = [...singles];
          for (const arr of packClusters.values()) all.push(...arr);
          all.sort(compareItems);
          const body = h("div", { style: GRID_LAYOUT_STYLE });
          for (const item of all) body.appendChild(renderInventoryItem(item, opts));
          wrap.appendChild(body);
        } else {
          // Render each pair/cluster as a nested mini-group with a shared heading.
          for (const arr of packClusters.values()) {
            arr.sort((a, b) => a.pack_status.localeCompare(b.pack_status));
            const header = arr[0];
            const sub = h("div", { style: "padding:0.5rem 1rem;background:var(--surface);font-weight:600;border-top:1px solid var(--border);display:flex;align-items:center;gap:0.5rem" }, [
              h("span", { text: header.name }),
              h("span", { class: "pill", text: `${arr.length} ${pluralize("variant", arr.length)}` }),
            ]);
            wrap.appendChild(sub);
            for (const item of arr) wrap.appendChild(renderInventoryItem(item, opts));
          }
          singles.sort(compareItems);
          for (const item of singles) wrap.appendChild(renderInventoryItem(item, opts));
        }
        container.appendChild(wrap);
      }
      return container;
    }

    function renderInventoryItem(item, opts = {}) {
      if (state.density === "compact") return renderInventoryItemCompact(item, opts);
      if (state.density === "grid") return renderInventoryItemGrid(item, opts);
      const busy = state.busyItems.has(item.id);
      const appliance = state.appliances.find(a => a.id === item.appliance_id);
      const metaChildren = [];
      if (opts.showAppliance && appliance) metaChildren.push(h("span", { class: "pill", text: appliance.name }));
      if (state.familyId && item.owner_account_name && item.owner_account_id !== state.accountId) {
        metaChildren.push(h("span", { class: "pill accent", text: item.owner_account_name }));
      }
      if (item.tracking === "individual") {
        metaChildren.push(h("span", { class: "pill", text: "individual" }));
      } else {
        metaChildren.push(h("span", { class: "pill accent", text: item.pack_status }));
      }
      if (item.category) metaChildren.push(h("span", { class: "pill", text: item.category }));
      for (const p of tagPillsFor(item)) metaChildren.push(p);
      if (item.expiration_date) {
        const st = expirationState(item.expiration_date);

    // ---------- Photo helpers (client-side resize + lightbox) ----------

    async function resizeImageToJpegBase64(file, maxDim = 1600, quality = 0.85) {
      // Load the image. createImageBitmap handles EXIF orientation on modern browsers.
      const bitmap = await createImageBitmap(file).catch(async () => {
        // Fallback for browsers without createImageBitmap on File.
        const url = URL.createObjectURL(file);
        try {
          const img = await new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = rej;
            i.src = url;
          });
          return img;
        } finally {
          URL.revokeObjectURL(url);
        }
      });
      const srcW = bitmap.width || bitmap.naturalWidth;
      const srcH = bitmap.height || bitmap.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(srcW, srcH));
      const w = Math.max(1, Math.round(srcW * scale));
      const h = Math.max(1, Math.round(srcH * scale));
      let blob;
      if (typeof OffscreenCanvas !== "undefined") {
        const canvas = new OffscreenCanvas(w, h);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(bitmap, 0, 0, w, h);
        blob = await canvas.convertToBlob({ type: "image/jpeg", quality });
      } else {
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
        blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", quality));
      }
      if (!blob) throw new Error("Could not encode JPEG.");
      // Convert blob to base64 (without the "data:...," prefix).
      const buf = await blob.arrayBuffer();
      const bytes = new Uint8Array(buf);
      // chunk to avoid stack blow on large arrays
      let bin = "";
      const CHUNK = 0x8000;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(bin);
    }

    async function uploadPhoto(item, file) {
      const b64 = await resizeImageToJpegBase64(file);
      const updated = await api(
        "/api/appliances/" + encodeURIComponent(item.appliance_id) +
        "/items/" + encodeURIComponent(item.id) + "/photo",
        { method: "POST", body: { image_base64: b64 } },
      );
      // Merge over the existing record so owner_account_id / owner_account_name
      // (added by /api/items) survive — the per-item response doesn't carry them.
      const idx = state.items.findIndex(i => i.id === updated.id);
      if (idx >= 0) state.items[idx] = { ...state.items[idx], ...updated };
      return updated;
    }

    async function deletePhoto(item) {

        "/api/appliances/" + encodeURIComponent(item.appliance_id) +
        "/items/" + encodeURIComponent(item.id) + "/photo",
        { method: "DELETE" },

      const idx = state.items.findIndex(i => i.id === item.id);

    function openPhotoLightbox(item) {
      const img = h("img", {
        src: "/api/appliances/" + encodeURIComponent(item.appliance_id) +

      });
      const backdrop = h("div", {
        class: "dialog-backdrop",
        onClick: (e) => { if (e.target === backdrop) backdrop.remove(); },
      }, [
        h("div", { class: "dialog", style: "padding:0.5rem;background:transparent;border:0;box-shadow:none" }, [img]),
      ]);
      document.body.appendChild(backdrop);
      const esc = (e) => { if (e.key === "Escape") { backdrop.remove(); document.removeEventListener("keydown", esc); } };
      document.addEventListener("keydown", esc);
    }

    function defaultIndividualDelta(unit) {
      // Unit-aware default increments. The user may edit the quantity directly
      // through the edit dialog for exact values.
      const u = (unit || "").toLowerCase();
      if (["g", "ml"].includes(u)) return 50;
      if (["kg", "l"].includes(u)) return 0.1;
      return 1;
    }

    function formatNumber(n) {
      if (n == null) return "0";
      const rounded = Math.round(n * 10000) / 10000;
      return String(rounded);
    }

    async function adjustItem(item, delta) {
      if (state.busyItems.has(item.id)) return;
      // If this adjustment would bring the quantity to zero (or below for
      // fractional units that over-shoot), remove the item instead of
      // leaving a zero-quantity record cluttering the list.
      const current = item.tracking === "individual" ? (item.quantity || 0) : (item.pack_count || 0);
      if (delta < 0 && current + delta <= 0) {
        state.busyItems.add(item.id);
        await withBusy("Deleting…", async () => {
          try {
            await api(
              "/api/appliances/" + encodeURIComponent(item.appliance_id) +
              "/items/" + encodeURIComponent(item.id),
              { method: "DELETE" },
            );
            await reloadInventory();
            toast(`"${item.name}" removed.`, "success");
          } catch (err) {
            toast("Could not remove item: " + err.message, "error");
          } finally {
            state.busyItems.delete(item.id);
            render();
          }
        });
        return;
      }
      state.busyItems.add(item.id);
      await withBusy("Saving…", async () => {
        try {
          const updated = await api(
            "/api/appliances/" + encodeURIComponent(item.appliance_id) +
            "/items/" + encodeURIComponent(item.id) + "/adjust",
            { method: "POST", body: { delta } },
          );
          const idx = state.items.findIndex(i => i.id === updated.id);
          if (idx >= 0) state.items[idx] = { ...state.items[idx], ...updated };
          announce("Quantity updated.");
        } catch (err) {
          if (err.status === 400) toast(err.message, "error");
          else toast("Could not update quantity: " + err.message, "error");
        } finally {
          state.busyItems.delete(item.id);
          render();
        }
      });
    }

    async function packTransfer(item, direction, mode) {
      if (state.busyItems.has(item.id)) return;
      state.busyItems.add(item.id);
      await withBusy("Updating…", async () => {
        try {
          const path =
            (direction === "open" ? "open" : "close") +
            "-" + (mode === "one" ? "one" : "all");
          await api(
            "/api/appliances/" + encodeURIComponent(item.appliance_id) +
            "/items/" + encodeURIComponent(item.id) + "/" + path,
            { method: "POST" },
          );
          await reloadInventory();
          const verb = direction === "open" ? "Opened" : "Marked unopened";
          toast(
            (mode === "one" ? `${verb} 1 pack.` : `${verb} all packs.`),
            "success",
          );
          render();
        } catch (err) {
          toast(err.message, "error");
        } finally {
          state.busyItems.delete(item.id);
          render();
        }
      });
    }

    async function deleteItemFlow(item) {
      if (!confirm(`Delete "${item.name}"? This cannot be undone.`)) return;
      await withBusy("Deleting…", async () => {
        try {
          await api(
            "/api/appliances/" + encodeURIComponent(item.appliance_id) +
            "/items/" + encodeURIComponent(item.id),
            { method: "DELETE" },
          );
          // Splice in place — avoids a full /api/items round-trip for a single-row delete.
          state.items = state.items.filter(i => i.id !== item.id);
          toast("Item deleted.", "success");
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    // ---------- item dialog ----------

    function openItemDialog(existing, applianceId, groupId) {
      const isEdit = !!existing;
      const data = {
        name: existing?.name || "",
        appliance_id: existing?.appliance_id || applianceId || state.appliances[0]?.id || "",
        group_id: existing?.group_id || groupId || "",
        tracking: existing?.tracking || "individual",
        quantity: existing?.tracking === "individual" ? existing.quantity : 1,
        unit: existing?.tracking === "individual" ? existing.unit : "",
        pack_count: existing?.tracking === "pack" ? existing.pack_count : 1,
        pack_label: existing?.tracking === "pack" ? existing.pack_label : "bag",
        pack_status: existing?.tracking === "pack" ? existing.pack_status : "unopened",
        expiration_date: existing?.expiration_date || "",
        category: existing?.category || "",
        notes: existing?.notes || "",
        tag_ids: Array.isArray(existing?.tag_ids) ? [...existing.tag_ids] : [],
      };
      const err = h("div", { class: "muted", role: "alert" });

      // Which groups are valid for the chosen appliance? Shown as a
      // tree indented by depth so nested groups read as hierarchy.
      function groupsForAppliance() {
        const tree = buildGroupTree(data.appliance_id);
        return [["", "— None —"]].concat(
          tree.map(({ g, depth }) => [g.id, "— ".repeat(depth) + g.name]),
        );
      }

      // Photo picker state (new file to upload, or "clear existing" flag).
      const photoState = { file: null, previewUrl: null, deleteExisting: false };
      const photoPreviewSlot = h("div", { style: "display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap" });

      // Tag picker: shows currently selected tags as removable chips plus an
      // input to add existing or create new. Typed names that don't match
      // trigger a POST /api/tags create under the hood.
      const tagChipsSlot = h("div", { style: "display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.3rem" });
      const tagInputEl = h("input", {
        type: "text", maxlength: "30",
        placeholder: "Pick or type a new tag",
        list: "tag-suggestions",
        onKeyDown: (e) => { if (e.key === "Enter") { e.preventDefault(); addTagFromInput(); } },
      });
      const tagDatalist = h("datalist", { id: "tag-suggestions" });
      function rebuildTagChips() {
        tagChipsSlot.textContent = "";
        const byId = new Map(state.tags.map(t => [t.id, t]));
        for (const tid of data.tag_ids) {
          const t = byId.get(tid);
          if (!t) continue;
          tagChipsSlot.appendChild(h("span", {
            class: "pill accent",
            style: "display:inline-flex;align-items:center;gap:0.3rem",
          }, [
            h("span", { text: t.name }),
            h("button", {
              type: "button",
              style: "padding:0;min-height:0;min-width:0;border:0;background:transparent;color:inherit;cursor:pointer;line-height:1",
              "aria-label": "Remove " + t.name,
              onClick: () => {
                data.tag_ids = data.tag_ids.filter(x => x !== tid);
                rebuildTagChips();
              },
              text: "×",
            }),
          ]));
        }
        tagDatalist.textContent = "";
        for (const t of state.tags) {
          if (data.tag_ids.includes(t.id)) continue;
          tagDatalist.appendChild(h("option", { value: t.name }));
        }
      }
      async function addTagFromInput() {
        const raw = (tagInputEl.value || "").trim().replace(/^#+/, "").trim();
        if (!raw) return;
        const existing = state.tags.find(t => t.name.toLowerCase() === raw.toLowerCase());
        if (existing) {
          if (!data.tag_ids.includes(existing.id)) data.tag_ids.push(existing.id);
          tagInputEl.value = "";
          rebuildTagChips();
          return;
        }
        await withBusy("Creating tag…", async () => {
          try {
            const created = await api("/api/tags", { method: "POST", body: { name: raw } });
            state.tags.push(created);
            data.tag_ids.push(created.id);
            tagInputEl.value = "";
            rebuildTagChips();
          } catch (e) {
            toast(e.message, "error");
          }

    function openGroupDialog(existing, applianceId, parentGroupId) {
      const isEdit = !!existing;

      // Build the parent dropdown. On edit, exclude self + descendants
      // (would create a cycle). Shows "(top-level)" plus every eligible
      // group in the same appliance, indented by depth for readability.
      function parentOptions() {
        const forbid = new Set();
        if (isEdit) {
          forbid.add(existing.id);
          for (const d of descendantGroupIds(existing.id)) forbid.add(d);
        }
        const tree = buildGroupTree(data.appliance_id);
        const opts = [["", "(top-level)"]];
        for (const node of tree) {
          if (forbid.has(node.g.id)) continue;
          opts.push([node.g.id, "— ".repeat(node.depth) + node.g.name]);
        }
        return opts;
      }

      let parentSelect = selectEl(parentOptions(), data.parent_group_id,
        (v) => { data.parent_group_id = v; });
      const parentLabel = h("label", {}, ["Parent group (optional)", parentSelect]);

      function rebuildParentSelect() {

        parentSelect = next;
      }

                    method: "POST",

                      name: data.name,

                closeDialog();
