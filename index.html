<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>StockSpace</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#1e2847">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StockSpace">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
  <style>
    :root {
      color-scheme: light dark;

      /* Ambient background — a layered gradient the whole app sits on.
         Users can swap it in Settings; see --bg-image. */
      --bg-ambient:
        radial-gradient(at 18% 10%, oklch(92% 0.09 55 / 0.70), transparent 55%),
        radial-gradient(at 85% 88%, oklch(90% 0.08 265 / 0.60), transparent 50%),
        linear-gradient(180deg, #f4f2ee 0%, #eceef5 100%);

      --surface: rgba(255, 255, 255, 0.62);
      --surface-2: rgba(255, 255, 255, 0.42);
      /* surface-hover is MORE opaque than surface so hover makes buttons
         read as raised, not fainter. */
      --surface-hover: rgba(255, 255, 255, 0.9);
      --text: #11182c;
      --muted: rgba(17, 24, 44, 0.62);
      --border: rgba(255, 255, 255, 0.6);
      --border-strong: rgba(17, 24, 44, 0.14);
      --accent: #ff6a1a;
      --accent-text: #ffffff;
      --danger: #c0303a;
      --danger-bg: color-mix(in srgb, #c0303a 14%, transparent);
      --warning: #a85e00;
      --warning-bg: color-mix(in srgb, #ff9b2b 18%, transparent);
      --success: #0e7c3a;
      --success-bg: color-mix(in srgb, #27c470 18%, transparent);
      --focus: var(--accent);

      --radius-sm: 12px;
      --radius: 18px;
      --radius-lg: 24px;

      /* Glass FX (Apple Liquid Glass 2025) */
      --glass-blur: 28px;
      --glass-sat: 1.65;
      --glass-displace: url(#liquidGlass);
      --glass-displace-soft: url(#liquidGlassSoft);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --glass-highlight-soft: inset 0 1px 0 rgba(255, 255, 255, 0.6);
      /* Chromatic rim — subtle magenta on the left, cyan on the right,
         emulating the sub-pixel refraction Apple's new material shows at
         the border of each surface. */
      --glass-chroma:
        inset 1.5px 0 0 rgba(255, 90, 170, 0.14),
        inset -1.5px 0 0 rgba(90, 170, 255, 0.14);
      --shadow: 0 10px 36px -16px rgba(16, 24, 40, 0.32), 0 2px 6px -2px rgba(16, 24, 40, 0.16);
      --shadow-lg: 0 24px 60px -24px rgba(16, 24, 40, 0.42), 0 6px 18px -8px rgba(16, 24, 40, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-ambient:
          radial-gradient(at 18% 12%, oklch(55% 0.15 55 / 0.42), transparent 55%),
          radial-gradient(at 85% 88%, oklch(45% 0.17 285 / 0.42), transparent 50%),
          linear-gradient(180deg, #0a0d18 0%, #060810 100%);
        --surface: rgba(255, 255, 255, 0.06);
        --surface-2: rgba(255, 255, 255, 0.035);
        --surface-hover: rgba(255, 255, 255, 0.14);
        --text: #e8ecf7;
        --muted: rgba(232, 236, 247, 0.62);
        --border: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.22);
        --danger: #ff8089; --danger-bg: color-mix(in srgb, #ff8089 18%, transparent);
        --warning: #ffbe55; --warning-bg: color-mix(in srgb, #ffbe55 16%, transparent);
        --success: #6cd38f; --success-bg: color-mix(in srgb, #6cd38f 16%, transparent);
        --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        --glass-highlight-soft: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        --shadow: 0 10px 40px -16px rgba(0, 0, 0, 0.6), 0 4px 12px -4px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, 0.75), 0 8px 20px -8px rgba(0, 0, 0, 0.55);
      }
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg-ambient:
        radial-gradient(at 18% 10%, oklch(92% 0.09 55 / 0.70), transparent 55%),
        radial-gradient(at 85% 88%, oklch(90% 0.08 265 / 0.60), transparent 50%),
        linear-gradient(180deg, #f4f2ee 0%, #eceef5 100%);
      --surface: rgba(255, 255, 255, 0.62);
      --surface-2: rgba(255, 255, 255, 0.42);
      --surface-hover: rgba(255, 255, 255, 0.9);
      --text: #11182c;
      --muted: rgba(17, 24, 44, 0.62);
      --border: rgba(255, 255, 255, 0.6);
      --border-strong: rgba(17, 24, 44, 0.14);
      --danger: #c0303a; --danger-bg: color-mix(in srgb, #c0303a 14%, transparent);
      --warning: #a85e00; --warning-bg: color-mix(in srgb, #ff9b2b 18%, transparent);
      --success: #0e7c3a; --success-bg: color-mix(in srgb, #27c470 18%, transparent);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --glass-highlight-soft: inset 0 1px 0 rgba(255, 255, 255, 0.6);
      --shadow: 0 10px 36px -16px rgba(16, 24, 40, 0.32), 0 2px 6px -2px rgba(16, 24, 40, 0.16);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg-ambient:
        radial-gradient(at 18% 12%, oklch(55% 0.15 55 / 0.42), transparent 55%),
        radial-gradient(at 85% 88%, oklch(45% 0.17 285 / 0.42), transparent 50%),
        linear-gradient(180deg, #0a0d18 0%, #060810 100%);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-2: rgba(255, 255, 255, 0.035);
      --surface-hover: rgba(255, 255, 255, 0.14);
      --text: #e8ecf7;
      --muted: rgba(232, 236, 247, 0.62);
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.22);
      --danger: #ff8089; --danger-bg: color-mix(in srgb, #ff8089 18%, transparent);
      --warning: #ffbe55; --warning-bg: color-mix(in srgb, #ffbe55 16%, transparent);
      --success: #6cd38f; --success-bg: color-mix(in srgb, #6cd38f 16%, transparent);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      --glass-highlight-soft: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      --shadow: 0 10px 40px -16px rgba(0, 0, 0, 0.6), 0 4px 12px -4px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, 0.75), 0 8px 20px -8px rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: var(--text);
      /* Optional user image sits above the ambient gradient; if --bg-image is
         unset the gradient alone shows through. */
      background:
        var(--bg-image, none) center/cover no-repeat fixed,
        var(--bg-ambient) fixed;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    a { color: var(--accent); }
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      border-radius: 10px;
    }

    /* Buttons = glass pills by default. Primary = filled accent. Ghost = flat. */
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.55rem 1rem;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      box-shadow: var(--glass-highlight-soft);
      transition: transform 120ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }
    button:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      color: var(--text);
    }
    /* Liquid-glass press feedback: a brief scale-down on press and a
       subtle lean toward the pointer while dragged, with a spring-back
       on release (JS adds the lean; CSS owns the spring). */
    button:active:not(:disabled) { transform: scale(0.94); }
    button {
      transform-origin: center;
      /* Transition folded into the shared button transition above, with
         the spring-feel cubic-bezier taking over for transform. */
    }
    .liquid-press { transition: transform 220ms cubic-bezier(.22, 1.4, .3, 1) !important; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.primary {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, white 15%), var(--accent));
      color: var(--accent-text);
      border-color: color-mix(in srgb, var(--accent) 70%, transparent);
      box-shadow: var(--glass-highlight-soft),
                  0 8px 22px -10px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    button.primary:hover:not(:disabled) { filter: brightness(1.06); }
    button.danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 55%, transparent);
    }
    button.ghost {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      border-color: transparent;
    }
    button.ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
    button.icon {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
    }

    input, select, textarea {
      font: inherit;
      /* 16px minimum prevents iOS Safari auto-zoom on focus */
      font-size: max(16px, 1rem);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.85rem;
      min-height: 44px;
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      box-shadow: var(--glass-highlight-soft);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--accent) 70%, var(--border-strong));
      box-shadow: var(--glass-highlight-soft),
                  0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
    }
    input[type="radio"], input[type="checkbox"] {
      width: auto;
      min-height: 0;
      padding: 0;
      margin: 0;
      border-radius: 0;
      background: initial;
      border: initial;
      -webkit-appearance: auto;
      appearance: auto;
      accent-color: var(--accent);
      flex-shrink: 0;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
    }
    textarea { min-height: 80px; resize: vertical; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    label > small { display: block; font-weight: 400; color: var(--muted); margin-top: 0.1rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .stack { display: grid; gap: 0.75rem; }
    .muted { color: var(--muted); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      box-shadow: var(--glass-highlight-soft);
    }
    .pill.danger { background: var(--danger-bg); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
    .pill.warning { background: var(--warning-bg); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 50%, transparent); }
    .pill.success { background: var(--success-bg); color: var(--success); border-color: color-mix(in srgb, var(--success) 50%, transparent); }
    .pill.accent { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem;
      box-shadow: var(--glass-highlight), var(--glass-chroma), var(--shadow);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) var(--glass-displace-soft);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      /* Spring-feel lift matching Framer whileHover={{y:-5}} from the reel. */
      transition: transform 260ms cubic-bezier(.2,.9,.3,1.2), box-shadow 260ms ease, border-color 180ms ease;
    }
    .card.interactive:hover:not(:disabled),
    .appliance-tile:hover:not(:disabled),
    .dash-stat-link:hover:not(:disabled) {
      transform: translateY(-5px);
      box-shadow: var(--glass-highlight), var(--glass-chroma), var(--shadow-lg);
      border-color: var(--border-strong);
    }
    @media (prefers-reduced-motion: reduce) {
      .card.interactive:hover, .appliance-tile:hover, .dash-stat-link:hover { transform: none; }
    }

    /* Safari <18 and some Android browsers don't honor backdrop-filter.
       Fall back to solid tints that still read as cards. */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :root {
        --surface: #ffffff;
        --surface-2: #eef1f8;
        --border: #d9dee9;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --surface: #151b2d;
          --surface-2: #1b2545;
          --border: #2a3457;
        }
      }
      html[data-theme="dark"] {
        --surface: #151b2d;
        --surface-2: #1b2545;
        --border: #2a3457;
      }
      .card, button, input, select, textarea, .pill, header.app, .sidebar, .dialog, .toast, .inv-group, .dash-module-edit {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
    }

    html, body { overflow-x: hidden; }

    /* --chrome drives the top bar + sidebar tint. User can override its hex in
       Settings; applyCustomTheme() picks a text contrast and the glass surface
       always renders translucently over the ambient background. */
    :root {
      --chrome: #1e2847;
      --chrome-text: #e8ecf7;
      --chrome-hover: color-mix(in srgb, var(--chrome-text) 14%, transparent);
      --chrome-border: color-mix(in srgb, var(--chrome-text) 22%, transparent);
      --chrome-strong: color-mix(in srgb, var(--chrome-text) 30%, transparent);
      --chrome-muted: color-mix(in srgb, var(--chrome-text) 65%, transparent);
    }
    .layout {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      min-height: 100dvh; /* respects mobile browser UI chrome */
    }
    header.app {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(1rem, env(safe-area-inset-right))
        0.75rem
        max(1rem, env(safe-area-inset-left));
      /* Glass bar: user-picked chrome hex is used as a translucent tint
         over the ambient background. No border between header and rail —
         the rail picks up the same chrome tint seamlessly directly below.
         The soft outer shadow is the only visual separator from content. */
      background: color-mix(in srgb, var(--chrome) 42%, transparent);
      backdrop-filter: blur(28px) saturate(1.65) var(--glass-displace);
      -webkit-backdrop-filter: blur(28px) saturate(1.65);
      box-shadow:
        var(--glass-highlight),
        var(--glass-chroma),
        0 10px 32px -24px rgba(0, 0, 0, 0.6);
      color: var(--chrome-text);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header.app h1 {
      font-size: 1.1rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
      flex-wrap: wrap;
      color: var(--chrome-text);
    }
    header.app h1 .wordmark {
      display: inline-flex;
      align-items: center;
      line-height: 1;
      color: var(--chrome-text);
    }
    header.app h1 button.wordmark-btn {
      background: transparent;
      border: 0;
      padding: 0.2rem 0.3rem;
      margin: -0.2rem -0.3rem;
      min-height: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    header.app h1 button.wordmark-btn:hover {
      background: var(--chrome-hover);
    }
    header.app h1 .wordmark-img {
      /* Integer px heights avoid sub-pixel rasterisation on retina. */
      height: 36px;
      width: auto;
      display: block;
      max-width: min(260px, 46vw);
      image-rendering: -webkit-optimize-contrast;
    }
    @media (max-width: 540px) {
      header.app h1 .wordmark-img { height: 28px; max-width: 40vw; }
    }
    header.app button {
      background: var(--chrome-hover);
      color: var(--chrome-text);
      border-color: var(--chrome-border);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: var(--glass-highlight-soft);
    }
    header.app button:hover:not(:disabled) {
      background: var(--chrome-strong);
      border-color: var(--chrome-strong);
    }
    header.app button.primary {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, white 15%), var(--accent));
      color: var(--accent-text);
      border-color: color-mix(in srgb, var(--accent) 70%, transparent);
      box-shadow: var(--glass-highlight-soft),
                  0 8px 22px -10px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    header.app .pill {
      background: var(--chrome-hover);
      border-color: var(--chrome-border);
      color: var(--chrome-text);
    }
    header.app .header-search {
      /* flex: 0 1 420px + margin:auto centers the pill in the remaining
         space between the title (left) and the extras (right). */
      flex: 0 1 420px;
      min-width: 140px;
      max-width: 420px;
      min-height: 36px;
      margin: 0 auto;
      padding: 0.4rem 0.9rem;
      font-size: 0.95rem;
      background: var(--chrome-hover);
      color: var(--chrome-text);
      border: 1px solid var(--chrome-border);
      border-radius: 999px;
      width: auto;
      box-shadow: var(--glass-highlight-soft);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    header.app .header-search::placeholder { color: var(--chrome-muted); }
    header.app .header-search:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--accent) 70%, var(--chrome-strong));
      box-shadow: var(--glass-highlight-soft),
                  0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    /* Pill-shape every header button EXCEPT the sidebar hamburger. The
       wordmark button lives inside the h1, not as a direct child of
       header.app, so this selector doesn't touch it. */
    header.app > button:not(.sidebar-btn) {
      border-radius: 999px;
    }
    /* The density pill already has a bg; echo the same look on the icon
       pills (theme, install) so they read as a matched set. Unify heights
       with density-btn so all three line up on the right. */
    header.app button.theme-btn,
    header.app button.install-btn {
      background: var(--chrome-hover);
      border-color: var(--chrome-strong);
    }
    header.app button.theme-btn:hover:not(:disabled),
    header.app button.install-btn:hover:not(:disabled) {
      background: var(--chrome-strong);
    }
    header.app button.theme-btn,
    header.app button.install-btn,
    header.app button.density-btn {
      min-height: 40px;
      min-width: 40px;
      align-self: center;
    }
    /* Install button: SVG icon inline with the label. */
    header.app button.install-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.9rem;
    }
    header.app button.install-btn svg { width: 16px; height: 16px; }
    @media (max-width: 720px) {
      /* On narrow viewports the search gets its own row below the header's
         top row (wordmark, hamburger, extras), so it has room to breathe. */
      header.app { flex-wrap: wrap; }
      header.app .header-search {
        flex: 1 1 100%;
        max-width: none;
        margin: 0;
        order: 10;
      }
    }
    /* View-mode toggle is a filled pill with text so it reads as a label and
       doesn't visually collide with the icon-only hamburger button. */
    header.app button.density-btn {
      background: var(--chrome-hover);
      border-color: var(--chrome-strong);
      padding: 0.4rem 0.7rem;
      min-height: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      border-radius: 999px;
    }
    header.app button.density-btn:hover:not(:disabled) {
      background: var(--chrome-strong);
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      max-width: 85vw;
      background: color-mix(in srgb, var(--chrome) 48%, transparent);
      backdrop-filter: blur(30px) saturate(1.5);
      -webkit-backdrop-filter: blur(30px) saturate(1.5);
      color: var(--chrome-text);
      padding:
        max(0.75rem, env(safe-area-inset-top))
        0.75rem
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
      overflow-y: auto;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.22s cubic-bezier(.2,.8,.2,1);
      border-right: 1px solid var(--chrome-border);
      box-shadow: var(--glass-highlight), 10px 0 40px -16px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar h2 {
      color: var(--chrome-text);
      font-size: 0.95rem;
      margin: 0.25rem 0 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .sidebar .sb-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--chrome-text);
      border: 1px solid transparent;
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      min-height: 0;
      cursor: pointer;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      transition: background 160ms ease, border-color 160ms ease;
    }
    /* Scoped to .sidebar (not .sb-item) so .sb-close and any future sidebar
       icons also get sized correctly. */
    .sidebar .sb-icon {
      flex: 0 0 auto;
      display: inline-flex;
      width: 20px;
      height: 20px;
      opacity: 0.85;
    }
    .sidebar .sb-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sidebar .sb-item[aria-current="true"] .sb-icon { opacity: 1; }
    /* Close button hover: use the chrome-tinted overlay so it doesn't fall
       back to the global light-gray button hover (which looked white on the
       dark sidebar). */
    .sidebar .sb-close:hover:not(:disabled) {
      background: var(--chrome-hover);
    }
    .sidebar .sb-close .sb-icon { opacity: 1; }
    .sidebar .sb-item:hover:not(:disabled) {
      background: var(--chrome-hover);
    }
    .sidebar .sb-item[aria-current="true"] {
      background: var(--chrome-hover);
      border-color: var(--chrome-strong);
      color: var(--chrome-text);
      box-shadow: var(--glass-highlight-soft);
    }
    .sidebar .sb-item .sb-meta {
      display: block;
      font-size: 0.78rem;
      color: var(--chrome-muted);
      margin-top: 0.1rem;
    }
    .sidebar .sb-add {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, white 15%), var(--accent));
      color: var(--accent-text);
      border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
      border-radius: 999px;
      padding: 0.6rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--glass-highlight-soft),
                  0 8px 22px -10px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 14, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sidebar-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    /* Push the layout right when the sidebar is docked on wide screens.
       Transition the padding so the content slides in sync with the sidebar.
       On narrower viewports we fall back to the overlay behaviour above. */
    body { transition: padding-left 0.2s ease; }
    @media (min-width: 760px) {
      body.sidebar-visible { padding-left: 280px; }
      body.sidebar-visible .sidebar-backdrop { opacity: 0; pointer-events: none; }
    }
    main.app {
      padding: 1rem;
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }
    .toasts {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: max(1rem, env(safe-area-inset-left));
      z-index: 100;
      display: grid;
      gap: 0.5rem;
      max-width: 420px;
      margin-left: auto;
      pointer-events: none;
    }
    .toast { pointer-events: auto; }
    .toast {
      padding: 0.8rem 1.1rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--glass-highlight), var(--shadow);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    }
    .toast.error { border-color: color-mix(in srgb, var(--danger) 55%, transparent); color: var(--danger); background: var(--danger-bg); }
    .toast.success { border-color: color-mix(in srgb, var(--success) 55%, transparent); color: var(--success); background: var(--success-bg); }
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 14, 0.55);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      display: grid;
      place-items: center;
      padding: 1rem;
      z-index: 50;
    }
    .dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.3rem;
      max-width: 520px;
      width: 100%;
      /* Cap the dialog to the viewport and let its own body scroll, so tall
         forms (Add item, etc.) don't overflow the fold on any screen size. */
      max-height: calc(100vh - 2rem);
      max-height: calc(100dvh - 2rem);
      overflow-y: auto;
      overscroll-behavior: contain;
      box-shadow: var(--glass-highlight), var(--glass-chroma), var(--shadow-lg);
      backdrop-filter: blur(32px) saturate(1.75) var(--glass-displace);
      -webkit-backdrop-filter: blur(32px) saturate(1.75);
    }
    .dialog h2 { margin-top: 0; }
    .center-screen {
      display: grid;
      place-items: center;
      min-height: 70vh;
    }
    .center-screen .card { max-width: 420px; width: 100%; }
    .pin-input {
      font-size: 1.6rem;
      letter-spacing: 0.4rem;
      text-align: center;
    }
    .inv-group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      box-shadow: var(--glass-highlight), var(--shadow);
    }
    .inv-group summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.1rem;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-weight: 600;
    }
    .inv-group summary::-webkit-details-marker { display: none; }
    .inv-group summary::before {
      content: "▸";
      display: inline-block;
      transition: transform 0.15s;
      color: var(--muted);
    }
    .inv-group[open] summary::before { transform: rotate(90deg); }
    .inv-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      padding: 0.85rem 1.1rem;
      border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      align-items: center;
    }
    .inv-item:first-of-type { border-top: 0; }
    .inv-right {
      display: grid;
      gap: 0.5rem;
      justify-items: end;
    }
    .inv-item .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin-top: 0.25rem;
    }
    .inv-item .name { font-weight: 600; }
    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .qty-value {
      min-width: 3.5rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .inv-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .filters {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-bottom: 1rem;
    }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 540px) {
      .dash-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    }
    /* Dashed "+ Add new" tile at the end of the appliance-summaries grid. */
    .dash-add-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      min-height: 100px;
      background: color-mix(in srgb, var(--surface) 55%, transparent);
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      box-shadow: none;
    }
    .dash-add-card:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }
    .dash-add-card .dash-add-plus {
      font-size: 1.8rem;
      line-height: 1;
    }
    /* Dashboard module wrapper: adds vertical rhythm between modules and
       hosts the edit-mode controls (drag handle, up/down, visibility). */
    .dash-module { margin-bottom: 1rem; }
    .dash-module:last-child { margin-bottom: 0; }
    .dash-module-edit {
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 0.6rem;
      background: var(--surface);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
    }
    .dash-module-edit.hidden-mod { opacity: 0.55; }
    .dash-module-edit.dragging { opacity: 0.4; }
    .dash-module-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .dash-drag {
      cursor: grab;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      user-select: none;
      padding: 0 0.2rem;
    }
    .dash-module-edit.dragging .dash-drag { cursor: grabbing; }
    .dash-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dash-toggle input[type="checkbox"] {
      width: auto; min-height: 0; margin: 0; cursor: pointer;
    }
    /* ---- Stat tile ---- */
    .dash-stat {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.6rem;
      min-height: 150px;
      padding: 1.2rem 1.2rem 1.1rem;
      overflow: hidden;
      position: relative;
    }
    .dash-stat .stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .dash-stat .stat-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .dash-stat .stat-icon {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent-tint, var(--accent)) 22%, transparent);
      color: var(--accent-tint, var(--accent));
      flex-shrink: 0;
      box-shadow: var(--glass-highlight-soft);
    }
    .dash-stat .stat-icon svg { width: 20px; height: 20px; }
    .dash-stat .big {
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0;
    }
    .dash-stat .stat-hint {
      font-size: 0.82rem;
      color: var(--muted);
    }
    /* When a stat card is clickable it renders as a <button>; strip the
       default button chrome and add a subtle hover affordance. */
    .dash-stat-link {
      text-align: left;
      cursor: pointer;
      font: inherit;
      color: inherit;
      min-height: 0;
      border-radius: var(--radius);
    }
    /* dash-stat-link lift handled by the global .card.interactive rule */
    .dash-stat.danger {
      background: color-mix(in srgb, var(--danger) 10%, var(--surface));
      border-color: color-mix(in srgb, var(--danger) 45%, var(--border));
    }
    .dash-stat.danger .stat-icon {
      background: color-mix(in srgb, var(--danger) 22%, transparent);
      color: var(--danger);
    }
    .dash-stat.danger .big { color: var(--danger); }
    .dash-stat.warning {
      background: color-mix(in srgb, var(--warning) 10%, var(--surface));
      border-color: color-mix(in srgb, var(--warning) 45%, var(--border));
    }
    .dash-stat.warning .stat-icon {
      background: color-mix(in srgb, var(--warning) 22%, transparent);
      color: var(--warning);
    }
    .dash-stat.warning .big { color: var(--warning); }
    .dash-stat.success .stat-icon {
      background: color-mix(in srgb, var(--success) 22%, transparent);
      color: var(--success);
    }

    /* ---- Appliance tile ---- */
    .appliance-tile {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding: 1.1rem;
      text-align: left;
      min-height: 170px;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--glass-highlight), var(--shadow);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      transition: transform 180ms ease, box-shadow 220ms ease;
      color: var(--text);
    }
    /* .appliance-tile lift handled by the global hover rule above */
    .appliance-tile .tile-head {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .appliance-tile .tile-icon {
      width: 44px; height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      color: var(--accent);
      flex-shrink: 0;
      box-shadow: var(--glass-highlight-soft);
    }
    .appliance-tile .tile-icon svg { width: 24px; height: 24px; }
    .appliance-tile .tile-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    .appliance-tile .tile-sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .appliance-tile .tile-count {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      margin-top: auto;
    }
    .appliance-tile .tile-count b {
      font-size: 1.7rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .appliance-tile .tile-count span {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .appliance-tile .tile-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    /* ---- Primary nav pills — the ONLY navigation surface ----
       Lives centered in the header on wide screens (reel-matched layout);
       collapses to a scrollable row above each view on narrow. */
    .primary-nav-wrap {
      display: flex;
      justify-content: center;
      margin: 0 0 1.2rem;
      width: 100%;
    }
    @media (min-width: 760px) {
      /* Rail owns the nav on desktop; hide the in-view wrap. */
      .primary-nav-wrap { display: none; }
    }
    @media (max-width: 759.98px) {
      /* Narrow uses the in-view wrap; nothing to hide in the header. */
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-left: auto;
      flex-shrink: 0;
    }
    @media (min-width: 760px) {
      /* 3-column grid so the search stays visually centred no matter
         how wide the wordmark gets, while extras pin to the right. */
      header.app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        column-gap: 1rem;
        align-items: center;
      }
      header.app > h1 { justify-self: start; }
      header.app > .header-search {
        justify-self: center;
        flex: 0 1 320px;
        max-width: 320px;
        width: 320px;
        margin: 0;
      }
      header.app > .header-right { justify-self: end; margin-left: 0; }
    }
    /* Header no longer hosts the primary nav (rail owns it on desktop,
       .primary-nav-wrap above each view owns it on narrow). */
    .primary-nav {
      display: inline-flex;
      gap: 0.3rem;
      padding: 0.3rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--glass-highlight-soft);
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .primary-nav::-webkit-scrollbar { display: none; }
    .primary-nav button {
      min-height: 40px;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .primary-nav button svg { width: 18px; height: 18px; }
    .primary-nav button:hover:not(:disabled) { color: var(--text); background: var(--surface-hover); }
    .primary-nav button[aria-current="true"] {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--accent);
    }
    .primary-nav button.lock-btn:hover:not(:disabled) {
      color: var(--danger);
      background: var(--danger-bg);
    }
    /* On narrow screens the pill row drops labels so all four or five
       items still fit at a glance; a tooltip keeps names reachable. */
    @media (max-width: 640px) {
      .primary-nav button { padding: 0.5rem 0.75rem; min-width: 44px; justify-content: center; }
      .primary-nav button .nav-label { display: none; }
    }

    /* ---- Left sidebar: full-height chrome column that meets the top
       bar at the (76px, 0) corner. Both use the same chrome tint and
       blur with no border or shadow between them, so the two surfaces
       read as one L-shaped piece of chrome. ---- */
    .rail {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 76px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        0.5rem
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.5rem, env(safe-area-inset-left));
      background: color-mix(in srgb, var(--chrome) 42%, transparent);
      color: var(--chrome-text);
      /* No border, no outer shadow — just the specular top highlight +
         chromatic rim so the join with the header shares one continuous
         Apple-Liquid-Glass surface. */
      box-shadow: var(--glass-highlight), var(--glass-chroma);
      backdrop-filter: blur(28px) saturate(1.65) var(--glass-displace);
      -webkit-backdrop-filter: blur(28px) saturate(1.65);
      z-index: 40;
    }
    @media (min-width: 760px) {
      .rail { display: flex; }
      body { padding-left: 76px; }
    }
    /* Push the Lock button down to the bottom; nav items hug the top. */
    .rail .rail-spacer { flex: 1; }
    .rail button {
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 999px;
      min-height: 0;
      background: transparent;
      border: 1px solid transparent;
      color: var(--chrome-muted);
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 180ms cubic-bezier(.2,.9,.3,1.2), background 160ms ease, color 160ms ease;
    }
    .rail button svg { width: 20px; height: 20px; }
    .rail button:hover:not(:disabled) {
      transform: translateY(-2px);
      color: var(--chrome-text);
      background: var(--chrome-hover);
    }
    .rail button[aria-current="true"] {
      /* Active-state look lives on .rail-indicator so it can slide
         between buttons smoothly; the button itself just colors the icon. */
      color: var(--accent);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }
    /* iOS 26/27 Liquid-glass pill that slides between icons and
       deforms as the user drags along the rail. */
    .rail-indicator {
      position: absolute;
      left: 50%;
      top: 0;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      transform: translate(-50%, 0);
      transform-origin: center;
      background: color-mix(in srgb, var(--accent) 24%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      box-shadow: var(--glass-highlight-soft);
      backdrop-filter: blur(14px) saturate(1.6);
      -webkit-backdrop-filter: blur(14px) saturate(1.6);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      /* Spring-feel slide: slight overshoot at the end. */
      transition:
        transform 480ms cubic-bezier(.22, 1.3, .3, 1),
        height 460ms cubic-bezier(.22, 1.25, .35, 1),
        width 460ms cubic-bezier(.22, 1.25, .35, 1),
        opacity 220ms ease,
        background 180ms ease,
        border-color 180ms ease;
      will-change: transform, height, width;
    }
    /* While the user is dragging, kill the transition so the pill tracks
       the finger instantly; the `.rail.dragging` class flips it. */
    .rail.dragging .rail-indicator { transition: none; }
    .rail button { position: relative; z-index: 1; }
    /* Press feedback on rail buttons — the icon itself squishes a touch
       while the indicator stretches behind it. */
    .rail button:active:not(:disabled) { transform: scale(0.9); }
    .rail button { transition: transform 180ms cubic-bezier(.22, 1.3, .3, 1), background 160ms ease, color 160ms ease; }
    @media (prefers-reduced-motion: reduce) {
      .rail-indicator { transition: opacity 120ms ease; }
      .rail button:active:not(:disabled) { transform: none; }
    }
    .rail button.lock-btn:hover:not(:disabled) {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 25%, transparent);
    }
    .rail .rail-sep {
      height: 1px;
      background: var(--chrome-border);
      margin: 0.3rem 0.5rem;
    }
    .empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
    }
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
    }
    .spinner {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    /* Primary nav lives in the sidebar's .sb-nav section on every width —
       the header no longer renders a nav bar at all. */
    @media (max-width: 540px) {
      /* On big-notch iPhones env(safe-area-inset-top) alone is enough space
         above the content; stacking an extra 0.5rem on top leaves a visible
         empty band of chrome between the status-bar icons and the wordmark.
         Use a tiny floor only for notch-less devices, and tighten the bottom
         padding too so the bar isn't disproportionately tall. */
      header.app {
        padding-top: max(0.15rem, env(safe-area-inset-top));
        padding-bottom: 0.45rem;
        gap: 0.5rem;
      }
      header.app h1 { font-size: 1rem; }
      /* The account-name pill is redundant with the sidebar greeting on
         phone-sized screens, hide it to save a line. */
      header.app h1 .pill { display: none; }
      main.app { padding: 0.75rem; padding-left: max(0.75rem, env(safe-area-inset-left));
                 padding-right: max(0.75rem, env(safe-area-inset-right));
                 padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
      .card { padding: 0.9rem; }
      .dash-stat { min-height: 120px; padding: 0.9rem; gap: 0.4rem; }
      .dash-stat .big { font-size: 1.7rem; }
      .appliance-tile { min-height: 150px; padding: 0.9rem; }
      .appliance-tile .tile-icon { width: 38px; height: 38px; }
      .appliance-tile .tile-count b { font-size: 1.4rem; }
      .inv-item { grid-template-columns: 1fr; padding: 0.75rem; }
      .inv-right { justify-items: start; width: 100%; }
      .inv-actions { justify-content: flex-start; }
      .qty-controls { align-self: center; }
      .inv-group summary { padding: 0.75rem; flex-wrap: wrap; }
      .pin-input { font-size: 1.4rem; letter-spacing: 0.3rem; }
      /* Dialog becomes a bottom sheet on narrow screens */
      .dialog-backdrop { padding: 0; align-items: flex-end; }
      .dialog {
        max-width: 100%;
        width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        overflow-y: auto;
        border-radius: 16px 16px 0 0;
        padding: 1rem;
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
      }
    }
    @media (max-width: 380px) {
      .dash-grid { grid-template-columns: 1fr 1fr; }
      .dash-stat .big { font-size: 1.4rem; }
      .filters { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <!--
    Apple-Liquid-Glass-2025 displacement filter. feTurbulence builds a soft
    low-frequency noise field and feDisplacementMap uses it to warp whatever
    is behind the glass by up to ~scale/2 pixels per axis. Chained onto
    backdrop-filter it produces the signature "looking through a bubble of
    chilled oil" refraction. Browsers that don't yet support url() inside
    backdrop-filter (older Firefox) simply ignore it and get the plain blur.
  -->
  <svg aria-hidden="true" focusable="false"
       style="position:fixed;width:0;height:0;pointer-events:none;overflow:hidden"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="liquidGlass" x="-5%" y="-5%" width="110%" height="110%"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016"
                      numOctaves="2" seed="7" result="turb"/>
        <feGaussianBlur in="turb" stdDeviation="1.4" result="softTurb"/>
        <feDisplacementMap in="SourceGraphic" in2="softTurb" scale="48"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="liquidGlassSoft" x="-5%" y="-5%" width="110%" height="110%"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022"
                      numOctaves="2" seed="3" result="turb"/>
        <feGaussianBlur in="turb" stdDeviation="1" result="softTurb"/>
        <feDisplacementMap in="SourceGraphic" in2="softTurb" scale="24"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
  <div class="layout" id="root">
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="live"></div>
    <!-- header + main injected by render() -->
  </div>
  <div class="toasts" id="toasts" aria-live="assertive" aria-atomic="false"></div>
  <div id="busy" class="loading" hidden style="position:fixed;bottom:0.6rem;left:0.6rem;z-index:200;padding:0.3rem 0.6rem;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)">
    <span class="spinner" aria-hidden="true"></span>
    <span id="busy-text">Working…</span>
  </div>

  <script>
    "use strict";

    // ---------- utilities ----------

    const $root = document.getElementById("root");
    const $toasts = document.getElementById("toasts");
    const $live = document.getElementById("live");

    /** Create a DOM element with safe text content (never innerHTML). */
    function h(tag, attrs = {}, children = []) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "html") throw new Error("innerHTML not permitted");
        else if (k === "text") el.textContent = v;
        else if (k === "dataset") {
          for (const [dk, dv] of Object.entries(v)) el.dataset[dk] = dv;
        } else if (k.startsWith("on") && typeof v === "function") {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v === true) el.setAttribute(k, "");
        else el.setAttribute(k, v);
      }
      const list = Array.isArray(children) ? children : [children];
      for (const c of list) {
        if (c == null || c === false) continue;
        if (typeof c === "string" || typeof c === "number") {
          el.appendChild(document.createTextNode(String(c)));
        } else if (c instanceof Node) {
          el.appendChild(c);
        }
      }
      return el;
    }

    function pluralize(word, count) {
      if (count === 1) return word;
      const w = String(word).toLowerCase();
      if (w === "person") return "people";
      if (w.endsWith("y") && !["ay", "ey", "oy", "uy"].some(s => w.endsWith(s))) return w.slice(0, -1) + "ies";
      if (w.endsWith("s") || w.endsWith("sh") || w.endsWith("ch") || w.endsWith("x") || w.endsWith("z")) return w + "es";
      if (w.endsWith("f") || w.endsWith("fe")) return w.replace(/(f|fe)$/, "ves");
      return w + "s";
    }

    function toast(message, kind = "info") {
      const el = h("div", { class: "toast " + kind, role: "status", text: message });
      $toasts.appendChild(el);
      setTimeout(() => el.remove(), 4500);
      $live.textContent = message;
    }

    function announce(msg) {
      $live.textContent = msg;
    }

    function formatDate(iso) {
      if (!iso) return "";
      // ISO date "YYYY-MM-DD"; render as local day for user clarity.
      const [y, m, d] = iso.split("-").map(Number);
      if (!y || !m || !d) return iso;
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function expirationState(iso) {
      if (!iso) return "none";
      const [y, m, d] = iso.split("-").map(Number);
      if (!y) return "none";
      const target = new Date(y, m - 1, d);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      target.setHours(0, 0, 0, 0);
      const diffDays = Math.floor((target - today) / 86400000);
      if (diffDays < 0) return "expired";
      if (diffDays <= 7) return "soon";
      return "ok";
    }

    // ---------- state ----------

    const state = {
      authenticated: false,
      hasAccounts: false,
      accountNames: [],
      accountId: null,
      accountName: null,
      authMode: "auto",   // "signup" | "login" | "auto" (picked by hasAccounts)
      csrfToken: null,
      view: "dashboard",
      activeApplianceId: null,
      appliances: [],
      groups: [],
      items: [],
      tags: [],
      filters: { q: "", applianceId: "", category: "", tracking: "", packStatus: "", expiration: "", tag: "" },
      sort: "name",
      busyCount: 0,
      // Map of active op label -> number of in-flight ops with that label,
      // so the busy pill can say "Deleting…"/"Signing in…" instead of a
      // misleading "Saving…" for every operation.
      busyLabels: new Map(),
      busyItems: new Set(),
      installPromptAvailable: false,
      isInstalled: false,
      // Family context: null if solo, "owner" or "member" otherwise.
      familyId: null,
      familyRole: null,
      family: null, // { family_id, my_role, members, incoming_invitations, outgoing_invitations }
      // Row density: "full" (default) is the detailed card; "compact" is a
      // dense horizontal row; "grid" tiles items as photo-first cards.
      density: (function () {
        try {
          const d = localStorage.getItem("stockspace_density");
          if (d === "compact" || d === "grid") return d;
        } catch (_) {}
        return "full";
      })(),
      // Default-open on wide screens where it docks beside the content;
      // default-closed on narrow where it would overlay the whole view.
      sidebarOpen: (typeof window !== "undefined" && window.innerWidth > 720),
      // Dashboard modules the user can toggle on/off and reorder. Stored as
      // an array of { id, visible } so the ORDER is the user's layout and
      // toggle state is per-module. Unknown modules in storage are dropped;
      // modules missing from storage get appended visible (so new features
      // show up automatically on upgrade). Edit mode exposes drag + toggle.
      dashboardLayout: (function () {
        const DEFAULT = [
          { id: "stats", visible: true },
          { id: "expiring", visible: true },
          { id: "appliances", visible: true },
        ];
        const KNOWN = new Set(DEFAULT.map(m => m.id));
        try {
          const raw = localStorage.getItem("stockspace_dashboard_layout");
          if (!raw) return DEFAULT;
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return DEFAULT;
          const seen = new Set();
          const cleaned = [];
          for (const row of parsed) {
            if (!row || typeof row.id !== "string" || !KNOWN.has(row.id) || seen.has(row.id)) continue;
            cleaned.push({ id: row.id, visible: row.visible !== false });
            seen.add(row.id);
          }
          // Insert any new default modules at their default index — so a new
          // module like "hero" slots in at the top of a migrated layout
          // instead of appearing orphaned at the end.
          for (let i = 0; i < DEFAULT.length; i++) {
            const m = DEFAULT[i];
            if (!seen.has(m.id)) {
              const insertAt = Math.min(i, cleaned.length);
              cleaned.splice(insertAt, 0, { ...m });
              seen.add(m.id);
            }
          }
          return cleaned;
        } catch (_) { return DEFAULT; }
      })(),
      dashboardEditing: false,
      // User overrides for the chrome (topbar + sidebar) and main background
      // colours, keyed by effective colour scheme. null = use the baked-in
      // defaults in CSS. All stored as hex strings (what <input type=color>
      // produces); contrast text colour is derived automatically.
      customTheme: (function () {
        const empty = {
          chromeLight: null, chromeDark: null,
          bgLight: null, bgDark: null,
          bgImageLight: null, bgImageDark: null,
          accent: null,
        };
        try {
          const raw = localStorage.getItem("stockspace_custom_theme");
          if (!raw) return empty;
          const p = JSON.parse(raw) || {};
          return {
            chromeLight: typeof p.chromeLight === "string" ? p.chromeLight : null,
            chromeDark: typeof p.chromeDark === "string" ? p.chromeDark : null,
            bgLight: typeof p.bgLight === "string" ? p.bgLight : null,
            bgDark: typeof p.bgDark === "string" ? p.bgDark : null,
            bgImageLight: typeof p.bgImageLight === "string" ? p.bgImageLight : null,
            bgImageDark: typeof p.bgImageDark === "string" ? p.bgImageDark : null,
            accent: typeof p.accent === "string" ? p.accent : null,
          };
        } catch (_) {
          return empty;
        }
      })(),
    };

    // Captured BeforeInstallPromptEvent from Chrome/Edge/Samsung Internet so
    // we can trigger the native install flow from an in-app button.
    let deferredInstallPrompt = null;

    const FALLBACK_BUSY_LABEL = "Working…";

    function withBusy(label = FALLBACK_BUSY_LABEL, fn) {
      state.busyCount++;
      state.busyLabels.set(label, (state.busyLabels.get(label) || 0) + 1);
      updateBusyIndicator();
      return Promise.resolve()
        .then(fn)
        .finally(() => {
          state.busyCount = Math.max(0, state.busyCount - 1);
          const n = (state.busyLabels.get(label) || 0) - 1;
          if (n <= 0) state.busyLabels.delete(label);
          else state.busyLabels.set(label, n);
          updateBusyIndicator();
        });
    }

    function updateBusyIndicator() {
      const el = document.getElementById("busy");
      if (!el) return;
      const text = document.getElementById("busy-text");
      el.hidden = state.busyCount === 0;
      if (text) {
        // With several concurrent ops, show a generic label.
        const labels = Array.from(state.busyLabels.keys());
        text.textContent =
          state.busyCount > 1 && labels.length > 1
            ? FALLBACK_BUSY_LABEL
            : (labels[0] || FALLBACK_BUSY_LABEL);
      }
    }

    // ---------- api ----------

    async function api(path, { method = "GET", body = null } = {}) {
      if (/\/(undefined|null)(\/|$|\?)/.test(path)) {
        console.error("api(): refusing to call URL with undefined/null id segment:", path);
        throw new ApiError(
          "Internal error: tried to call " + path + ". Please reload the app.",
          0,
          { client: true },
        );
      }
      const opts = {
        method,
        credentials: "same-origin",
        headers: { "accept": "application/json" },
      };
      if (body !== null) {
        opts.headers["content-type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      if (state.csrfToken && method !== "GET" && method !== "HEAD") {
        opts.headers["x-stockspace-csrf"] = state.csrfToken;
      }
      let resp;
      try {
        resp = await fetch(path, opts);
      } catch (err) {
        throw new ApiError("Network error. Is the backend running?", 0, { network: true });
      }
      if (resp.status === 401) {
        // Session expired or missing. Force relock without wiping the configured flag.
        state.authenticated = false;
        state.csrfToken = null;
        wipePrivateState();
        render();
      }
      if (resp.status === 204) return null;
      const ct = resp.headers.get("content-type") || "";
      const data = ct.includes("application/json") ? await resp.json() : await resp.text();
      if (!resp.ok) {
        const msg = data && data.error ? data.error.message : (typeof data === "string" ? data : resp.statusText);
        const code = data && data.error ? data.error.code : null;
        throw new ApiError(msg || "Request failed", resp.status, { code, data });
      }
      return data;
    }

    class ApiError extends Error {
      constructor(message, status, extra = {}) {
        super(message);
        this.status = status;
        Object.assign(this, extra);
      }
    }

    function wipePrivateState() {
      state.appliances = [];
      state.groups = [];
      state.items = [];
      state.activeApplianceId = null;
      state.busyItems.clear();
    }

    // ---------- auth flow ----------

    async function checkAuth() {
      try {
        const status = await api("/api/auth/status");
        state.hasAccounts = !!status.has_accounts;
        state.accountNames = Array.isArray(status.account_names) ? status.account_names : [];
      } catch (e) {
        state.hasAccounts = false;
        state.accountNames = [];
      }
      try {
        const sess = await api("/api/auth/session");
        if (sess && sess.authenticated) {
          state.authenticated = true;
          state.csrfToken = sess.csrf_token || null;
          state.accountId = sess.account_id || null;
          state.accountName = sess.account_name || null;
          state.familyId = sess.family_id || null;
          state.familyRole = sess.family_role || null;
          await loadServerPrefs();
          await reloadInventory();
        }
      } catch (_) {
        /* session endpoint failures mean "not authenticated" */
      }
    }

    async function signup(name, pin) {
      const resp = await api("/api/auth/signup", { method: "POST", body: { name, pin } });
      state.authenticated = true;
      state.hasAccounts = true;
      state.csrfToken = resp.csrf_token || null;
      state.accountId = resp.account_id || null;
      state.accountName = resp.account_name || null;
      state.familyId = null;
      state.familyRole = null;
      // A fresh account has no server prefs yet; seed from the current local
      // state so this device's choice carries over as the account's baseline.
      queueServerPrefsSave();
      try {
        await reloadInventory();
      } catch (err) {
        if (err.status === 401) {
          throw new ApiError(
            "Account was created but the session cookie was blocked by the browser. " +
            "Enable cookies for this site and reload.",
            401,
          );
        }
        throw err;
      }
    }

    async function login(name, pin) {
      const resp = await api("/api/auth/login", { method: "POST", body: { name, pin } });
      state.authenticated = true;
      state.csrfToken = resp.csrf_token || null;
      state.accountId = resp.account_id || null;
      state.accountName = resp.account_name || null;
      state.familyId = resp.family_id || null;
      state.familyRole = resp.family_role || null;
      await loadServerPrefs();
      try {
        await reloadInventory();
      } catch (err) {
        if (err.status === 401) {
          throw new ApiError(
            "Logged in but the session cookie was blocked by the browser. " +
            "Enable cookies for this site and reload.",
            401,
          );
        }
        throw err;
      }
    }

    async function lock() {
      try {
        await api("/api/auth/lock", { method: "POST" });
      } catch (_) {
        // Lock on the client regardless.
      }
      state.authenticated = false;
      state.csrfToken = null;
      state.accountId = null;
      state.accountName = null;
      wipePrivateState();
      // Refresh account list for the login screen.
      try {
        const status = await api("/api/auth/status");
        state.hasAccounts = !!status.has_accounts;
        state.accountNames = Array.isArray(status.account_names) ? status.account_names : [];
      } catch (_) {}
      state.authMode = "login";
      render();
      announce("Session locked.");
    }

    async function changePin(current_pin, new_pin) {
      await api("/api/auth/change-pin", { method: "POST", body: { current_pin, new_pin } });
      state.authenticated = false;
      state.csrfToken = null;
      wipePrivateState();
      render();
    }

    // ---------- data loaders ----------

    async function reloadInventory() {
      const data = await api("/api/items");
      state.items = data.items || [];
      state.groups = data.groups || [];
      state.appliances = data.appliances || [];
      state.tags = data.tags || [];
      if (data.family) {
        state.familyId = data.family.family_id || null;
        state.familyRole = data.family.my_role || null;
      }
    }

    // Separately loads family details (members + invitations) for the
    // Settings page.
    async function reloadFamily() {
      const data = await api("/api/family");
      state.family = data;
      state.familyId = data.family_id || null;
      state.familyRole = data.my_role || null;
    }

    function canEditStructure() {
      // Solo accounts (no family) and family Owners can edit appliances/groups.
      // Members can only edit items.
      return state.familyId === null || state.familyRole === "owner";
    }

    // ---------- rendering ----------

    let renderScheduled = false;
    function renderIfIdle() {
      if (renderScheduled) return;
      renderScheduled = true;
      queueMicrotask(() => {
        renderScheduled = false;
        render();
      });
    }

    function render() {
      $root.textContent = "";
      $root.appendChild(buildHeader());

      // The live region is removed when $root is cleared; re-attach it.
      $root.appendChild($live);

      let main;
      if (!state.authenticated) {
        // Pick signup vs login based on whether any accounts exist, unless the
        // user has explicitly toggled.
        const mode = state.authMode === "auto"
          ? (state.hasAccounts ? "login" : "signup")
          : state.authMode;
        main = mode === "signup" ? renderSignup() : renderLogin();
      } else {
        switch (state.view) {
          case "appliances": main = renderAppliances(); break;
          case "appliance": main = renderApplianceDetail(); break;
          case "inventory": main = renderGlobalInventory(); break;
          case "settings": main = renderSettings(); break;
          default: main = renderDashboard();
        }
      }
      $root.appendChild(main);

      // Sidebar drawer is gone — the thin left rail handles navigation on
      // desktop. Strip any legacy sidebar DOM from a cached shell.
      document.body.classList.remove("sidebar-visible");
      document.querySelectorAll(".sidebar, .sidebar-backdrop").forEach(n => n.remove());
      updateRail();
    }

    // Legacy sidebar builder kept for reference / fallback; no longer called.
    // eslint-disable-next-line no-unused-vars
    function buildSidebarContents_LEGACY_UNUSED() {
      // Returns an array of child nodes for the persistent <aside>.
      // On wide viewports where the sidebar is docked, selecting an appliance
      // keeps it open; on narrow (overlay) viewports we auto-close.
      const narrow = !window.matchMedia("(min-width: 760px)").matches;
      const canEdit = canEditStructure();
      // Build an inline-SVG X for the close button so it matches the stroke
      // style of the other sidebar icons and tracks --chrome-text via
      // currentColor the same way they do.
      const closeIcon = h("span", { class: "sb-icon", "aria-hidden": "true" });
      closeIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>`;
      const kids = [
        h("h2", {}, [
          h("span", { text: "Menu" }),
          h("button", {
            type: "button",
            class: "icon ghost sb-close",
            style: "margin-left:auto;min-height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center",
            "aria-label": "Close sidebar",
            onClick: () => { state.sidebarOpen = false; render(); },
          }, [closeIcon]),
        ]),
      ];

      // Primary nav. Each item gets a small line icon in front of its label.
      const navSection = h("div", { class: "sb-nav", style: "display:flex;flex-direction:column;gap:0.3rem" });
      const NAV_ITEMS = [
        ["dashboard", "Dashboard",
          `<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>`],
        ["inventory", "All Inventory",
