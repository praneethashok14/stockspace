<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>StockSpace</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#1e2847">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StockSpace">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #eef1f8;
      --text: #11182c;
      --muted: #5a647a;
      --border: #d9dee9;
      --accent: #0b5fff;
      --accent-text: #ffffff;
      --danger: #c0303a;
      --danger-bg: #fdecee;
      --warning: #a85e00;
      --warning-bg: #fff3dc;
      --success: #0e7c3a;
      --success-bg: #e7f6ec;
      --focus: #0b5fff;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --surface: #141c33;
        --surface-2: #1b2544;
        --text: #e7ecf8;
        --muted: #8a94af;
        --border: #2a3457;
        --accent: #4d8bff;
        --accent-text: #0b1220;
        --danger: #ff8089;
        --danger-bg: #3b1d22;
        --warning: #ffbe55;
        --warning-bg: #3a2a0a;
        --success: #6cd38f;
        --success-bg: #0f2a1b;
        --focus: #4d8bff;
      }
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f7fb; --surface: #fff; --surface-2: #eef1f8; --text: #11182c; --muted: #5a647a;
      --border: #d9dee9; --accent: #0b5fff; --accent-text: #fff;
      --danger: #c0303a; --danger-bg: #fdecee; --warning: #a85e00; --warning-bg: #fff3dc;
      --success: #0e7c3a; --success-bg: #e7f6ec; --focus: #0b5fff;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1220; --surface: #141c33; --surface-2: #1b2544; --text: #e7ecf8; --muted: #8a94af;
      --border: #2a3457; --accent: #4d8bff; --accent-text: #0b1220;
      --danger: #ff8089; --danger-bg: #3b1d22; --warning: #ffbe55; --warning-bg: #3a2a0a;
      --success: #6cd38f; --success-bg: #0f2a1b; --focus: #4d8bff;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    a { color: var(--accent); }
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-radius: 6px;
    }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button:hover:not(:disabled) { background: var(--surface-2); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    button.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }
    button.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
    button.ghost { background: transparent; }
    button.icon {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
    }
    input, select, textarea {
      font: inherit;
      /* 16px minimum prevents iOS Safari auto-zoom on focus */
      font-size: max(16px, 1rem);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.7rem;
      min-height: 44px;
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="radio"], input[type="checkbox"] {
      width: auto;
      min-height: 0;
      padding: 0;
      margin: 0;
      border-radius: 0;
      background: initial;
      border: initial;
      -webkit-appearance: auto;
      appearance: auto;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    textarea { min-height: 80px; resize: vertical; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    label > small { display: block; font-weight: 400; color: var(--muted); margin-top: 0.1rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .stack { display: grid; gap: 0.75rem; }
    .muted { color: var(--muted); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
    }
    .pill.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
    .pill.warning { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
    .pill.success { background: var(--success-bg); color: var(--success); border-color: var(--success); }
    .pill.accent { background: var(--surface); color: var(--accent); border-color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }
    html, body { overflow-x: hidden; }
    :root {
      --chrome: oklch(28.2% 0.091 267.935);
      --chrome-text: #e8ecf7;
      /* Translucent overlays derived from --chrome-text so hover / border /
         divider shades stay visible whether the chrome bg is dark or light. */
      --chrome-hover: color-mix(in srgb, var(--chrome-text) 14%, transparent);
      --chrome-border: color-mix(in srgb, var(--chrome-text) 22%, transparent);
      --chrome-strong: color-mix(in srgb, var(--chrome-text) 30%, transparent);
      --chrome-muted: color-mix(in srgb, var(--chrome-text) 65%, transparent);
    }
    .layout {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      min-height: 100dvh; /* respects mobile browser UI chrome */
    }
    header.app {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(1rem, env(safe-area-inset-right))
        0.75rem
        max(1rem, env(safe-area-inset-left));
      border-bottom: 1px solid var(--chrome);
      background: var(--chrome);
      color: var(--chrome-text);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header.app h1 {
      font-size: 1.1rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
      flex-wrap: wrap;
      color: var(--chrome-text);
    }
    header.app h1 .wordmark {
      display: inline-flex;
      align-items: center;
      line-height: 1;
      color: var(--chrome-text);
    }
    header.app h1 button.wordmark-btn {
      background: transparent;
      border: 0;
      padding: 0.2rem 0.3rem;
      margin: -0.2rem -0.3rem;
      min-height: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    header.app h1 button.wordmark-btn:hover {
      background: var(--chrome-hover);
    }
    header.app h1 .wordmark-img {
      /* Integer px heights avoid sub-pixel rasterisation on retina. */
      height: 36px;
      width: auto;
      display: block;
      max-width: min(260px, 46vw);
      image-rendering: -webkit-optimize-contrast;
    }
    @media (max-width: 540px) {
      header.app h1 .wordmark-img { height: 28px; max-width: 40vw; }
    }
    header.app button {
      background: transparent;
      color: var(--chrome-text);
      border-color: var(--chrome-border);
    }
    header.app button:hover:not(:disabled) {
      background: var(--chrome-hover);
    }
    header.app button.primary {
      background: var(--chrome-hover);
      color: var(--chrome-text);
      border-color: var(--chrome-strong);
    }
    header.app .pill {
      background: var(--chrome-hover);
      border-color: var(--chrome-border);
      color: var(--chrome-text);
    }
    /* View-mode toggle is a filled pill with text so it reads as a label and
       doesn't visually collide with the icon-only hamburger button. */
    header.app button.density-btn {
      background: var(--chrome-hover);
      border-color: var(--chrome-strong);
      padding: 0.4rem 0.7rem;
      min-height: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      border-radius: 999px;
    }
    header.app button.density-btn:hover:not(:disabled) {
      background: var(--chrome-strong);
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      max-width: 85vw;
      background: var(--chrome);
      color: var(--chrome-text);
      padding:
        max(0.75rem, env(safe-area-inset-top))
        0.75rem
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
      overflow-y: auto;
      z-index: 30;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar h2 {
      color: var(--chrome-text);
      font-size: 0.95rem;
      margin: 0.25rem 0 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .sidebar .sb-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--chrome-text);
      border: 1px solid var(--chrome-border);
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      min-height: 0;
      cursor: pointer;
    }
    .sidebar .sb-item .sb-icon {
      flex: 0 0 auto;
      display: inline-flex;
      width: 20px;
      height: 20px;
      opacity: 0.85;
    }
    .sidebar .sb-item .sb-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sidebar .sb-item[aria-current="true"] .sb-icon { opacity: 1; }
    .sidebar .sb-item:hover:not(:disabled) {
      background: var(--chrome-hover);
    }
    .sidebar .sb-item[aria-current="true"] {
      background: var(--chrome-hover);
      border-color: var(--chrome-strong);
      color: var(--chrome-text);
    }
    .sidebar .sb-item .sb-meta {
      display: block;
      font-size: 0.78rem;
      color: var(--chrome-muted);
      margin-top: 0.1rem;
    }
    .sidebar .sb-add {
      background: var(--accent);
      color: var(--accent-text);
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sidebar-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    /* Push the layout right when the sidebar is docked on wide screens.
       Transition the padding so the content slides in sync with the sidebar.
       On narrower viewports we fall back to the overlay behaviour above. */
    body { transition: padding-left 0.2s ease; }
    @media (min-width: 760px) {
      body.sidebar-visible { padding-left: 280px; }
      body.sidebar-visible .sidebar-backdrop { opacity: 0; pointer-events: none; }
    }
    main.app {
      padding: 1rem;
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }
    .toasts {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: max(1rem, env(safe-area-inset-left));
      z-index: 100;
      display: grid;
      gap: 0.5rem;
      max-width: 420px;
      margin-left: auto;
      pointer-events: none;
    }
    .toast { pointer-events: auto; }
    .toast {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .toast.error { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
    .toast.success { border-color: var(--success); color: var(--success); background: var(--success-bg); }
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 30, 0.55);
      display: grid;
      place-items: center;
      padding: 1rem;
      z-index: 50;
    }
    .dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      max-width: 520px;
      width: 100%;
      /* Cap the dialog to the viewport and let its own body scroll, so tall
         forms (Add item, etc.) don't overflow the fold on any screen size. */
      max-height: calc(100vh - 2rem);
      max-height: calc(100dvh - 2rem);
      overflow-y: auto;
      overscroll-behavior: contain;
      box-shadow: var(--shadow);
    }
    .dialog h2 { margin-top: 0; }
    .center-screen {
      display: grid;
      place-items: center;
      min-height: 70vh;
    }
    .center-screen .card { max-width: 420px; width: 100%; }
    .pin-input {
      font-size: 1.6rem;
      letter-spacing: 0.4rem;
      text-align: center;
    }
    .inv-group {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    .inv-group summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--surface-2);
      cursor: pointer;
    }
    .inv-group summary::-webkit-details-marker { display: none; }
    .inv-group summary::before {
      content: "▸";
      display: inline-block;
      transition: transform 0.15s;
      color: var(--muted);
    }
    .inv-group[open] summary::before { transform: rotate(90deg); }
    .inv-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      align-items: center;
    }
    .inv-right {
      display: grid;
      gap: 0.5rem;
      justify-items: end;
    }
    .inv-item .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin-top: 0.25rem;
    }
    .inv-item .name { font-weight: 600; }
    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .qty-value {
      min-width: 3.5rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .inv-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .filters {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-bottom: 1rem;
    }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    /* Dashboard module wrapper: adds vertical rhythm between modules and
       hosts the edit-mode controls (drag handle, up/down, visibility). */
    .dash-module { margin-bottom: 1rem; }
    .dash-module:last-child { margin-bottom: 0; }
    .dash-module-edit {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 0.6rem;
      background: var(--surface);
    }
    .dash-module-edit.hidden-mod { opacity: 0.55; }
    .dash-module-edit.dragging { opacity: 0.4; }
    .dash-module-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }
    .dash-drag {
      cursor: grab;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      user-select: none;
      padding: 0 0.2rem;
    }
    .dash-module-edit.dragging .dash-drag { cursor: grabbing; }
    .dash-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dash-toggle input[type="checkbox"] {
      width: auto; min-height: 0; margin: 0; cursor: pointer;
    }
    .dash-stat .big {
      font-size: 1.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .dash-stat.danger {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }
    .dash-stat.danger .muted,
    .dash-stat.danger .big { color: var(--danger); }
    .dash-stat.warning {
      background: var(--warning-bg);
      border-color: var(--warning);
      color: var(--warning);
    }
    .dash-stat.warning .muted,
    .dash-stat.warning .big { color: var(--warning); }
    .empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
    }
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
    }
    .spinner {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    /* Primary nav lives in the sidebar's .sb-nav section on every width —
       the header no longer renders a nav bar at all. */
    @media (max-width: 540px) {
      /* On big-notch iPhones env(safe-area-inset-top) alone is enough space
         above the content; stacking an extra 0.5rem on top leaves a visible
         empty band of chrome between the status-bar icons and the wordmark.
         Use a tiny floor only for notch-less devices, and tighten the bottom
         padding too so the bar isn't disproportionately tall. */
      header.app {
        padding-top: max(0.15rem, env(safe-area-inset-top));
        padding-bottom: 0.45rem;
        gap: 0.5rem;
      }
      header.app h1 { font-size: 1rem; }
      /* The account-name pill is redundant with the sidebar greeting on
         phone-sized screens, hide it to save a line. */
      header.app h1 .pill { display: none; }
      main.app { padding: 0.75rem; padding-left: max(0.75rem, env(safe-area-inset-left));
                 padding-right: max(0.75rem, env(safe-area-inset-right));
                 padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
      .card { padding: 0.75rem; }
      .inv-item { grid-template-columns: 1fr; padding: 0.75rem; }
      .inv-right { justify-items: start; width: 100%; }
      .inv-actions { justify-content: flex-start; }
      .qty-controls { align-self: center; }
      .inv-group summary { padding: 0.75rem; flex-wrap: wrap; }
      .pin-input { font-size: 1.4rem; letter-spacing: 0.3rem; }
      /* Dialog becomes a bottom sheet on narrow screens */
      .dialog-backdrop { padding: 0; align-items: flex-end; }
      .dialog {
        max-width: 100%;
        width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        overflow-y: auto;
        border-radius: 16px 16px 0 0;
        padding: 1rem;
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
      }
    }
    @media (max-width: 380px) {
      .dash-grid { grid-template-columns: 1fr 1fr; }
      .dash-stat .big { font-size: 1.4rem; }
      .filters { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout" id="root">
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="live"></div>
    <!-- header + main injected by render() -->
  </div>
  <div class="toasts" id="toasts" aria-live="assertive" aria-atomic="false"></div>
  <div id="busy" class="loading" hidden style="position:fixed;bottom:0.6rem;left:0.6rem;z-index:200;padding:0.3rem 0.6rem;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)">
    <span class="spinner" aria-hidden="true"></span>
    <span id="busy-text">Working…</span>
  </div>

  <script>
    "use strict";

    // ---------- utilities ----------

    const $root = document.getElementById("root");
    const $toasts = document.getElementById("toasts");
    const $live = document.getElementById("live");

    /** Create a DOM element with safe text content (never innerHTML). */
    function h(tag, attrs = {}, children = []) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "html") throw new Error("innerHTML not permitted");
        else if (k === "text") el.textContent = v;
        else if (k === "dataset") {
          for (const [dk, dv] of Object.entries(v)) el.dataset[dk] = dv;
        } else if (k.startsWith("on") && typeof v === "function") {
          el.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v === true) el.setAttribute(k, "");
        else el.setAttribute(k, v);
      }
      const list = Array.isArray(children) ? children : [children];
      for (const c of list) {
        if (c == null || c === false) continue;
        if (typeof c === "string" || typeof c === "number") {
          el.appendChild(document.createTextNode(String(c)));
        } else if (c instanceof Node) {
          el.appendChild(c);
        }
      }
      return el;
    }

    function pluralize(word, count) {
      if (count === 1) return word;
      const w = String(word).toLowerCase();
      if (w === "person") return "people";
      if (w.endsWith("y") && !["ay", "ey", "oy", "uy"].some(s => w.endsWith(s))) return w.slice(0, -1) + "ies";
      if (w.endsWith("s") || w.endsWith("sh") || w.endsWith("ch") || w.endsWith("x") || w.endsWith("z")) return w + "es";
      if (w.endsWith("f") || w.endsWith("fe")) return w.replace(/(f|fe)$/, "ves");
      return w + "s";
    }

    function toast(message, kind = "info") {
      const el = h("div", { class: "toast " + kind, role: "status", text: message });
      $toasts.appendChild(el);
      setTimeout(() => el.remove(), 4500);
      $live.textContent = message;
    }

    function announce(msg) {
      $live.textContent = msg;
    }

    function formatDate(iso) {
      if (!iso) return "";
      // ISO date "YYYY-MM-DD"; render as local day for user clarity.
      const [y, m, d] = iso.split("-").map(Number);
      if (!y || !m || !d) return iso;
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function expirationState(iso) {
      if (!iso) return "none";
      const [y, m, d] = iso.split("-").map(Number);
      if (!y) return "none";
      const target = new Date(y, m - 1, d);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      target.setHours(0, 0, 0, 0);
      const diffDays = Math.floor((target - today) / 86400000);
      if (diffDays < 0) return "expired";
      if (diffDays <= 7) return "soon";
      return "ok";
    }

    // ---------- state ----------

    const state = {
      authenticated: false,
      hasAccounts: false,
      accountNames: [],
      accountId: null,
      accountName: null,
      authMode: "auto",   // "signup" | "login" | "auto" (picked by hasAccounts)
      csrfToken: null,
      view: "dashboard",
      activeApplianceId: null,
      appliances: [],
      groups: [],
      items: [],
      tags: [],
      filters: { q: "", applianceId: "", category: "", tracking: "", packStatus: "", expiration: "", tag: "" },
      sort: "name",
      busyCount: 0,
      // Map of active op label -> number of in-flight ops with that label,
      // so the busy pill can say "Deleting…"/"Signing in…" instead of a
      // misleading "Saving…" for every operation.
      busyLabels: new Map(),
      busyItems: new Set(),
      installPromptAvailable: false,
      isInstalled: false,
      // Family context: null if solo, "owner" or "member" otherwise.
      familyId: null,
      familyRole: null,
      family: null, // { family_id, my_role, members, incoming_invitations, outgoing_invitations }
      // Row density: "full" (default) is the detailed card; "compact" is a
      // dense horizontal row; "grid" tiles items as photo-first cards.
      density: (function () {
        try {
          const d = localStorage.getItem("stockspace_density");
          if (d === "compact" || d === "grid") return d;
        } catch (_) {}
        return "full";
      })(),
      // Default-open on wide screens where it docks beside the content;
      // default-closed on narrow where it would overlay the whole view.
      sidebarOpen: (typeof window !== "undefined" && window.innerWidth > 720),
      // Dashboard modules the user can toggle on/off and reorder. Stored as
      // an array of { id, visible } so the ORDER is the user's layout and
      // toggle state is per-module. Unknown modules in storage are dropped;
      // modules missing from storage get appended visible (so new features
      // show up automatically on upgrade). Edit mode exposes drag + toggle.
      dashboardLayout: (function () {
        const DEFAULT = [
          { id: "search", visible: true },
          { id: "stats", visible: true },
          { id: "expiring", visible: true },
          { id: "appliances", visible: true },
        ];
        const KNOWN = new Set(DEFAULT.map(m => m.id));
        try {
          const raw = localStorage.getItem("stockspace_dashboard_layout");
          if (!raw) return DEFAULT;
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return DEFAULT;
          const seen = new Set();
          const cleaned = [];
          for (const row of parsed) {
            if (!row || typeof row.id !== "string" || !KNOWN.has(row.id) || seen.has(row.id)) continue;
            cleaned.push({ id: row.id, visible: row.visible !== false });
            seen.add(row.id);
          }
          for (const m of DEFAULT) if (!seen.has(m.id)) cleaned.push({ ...m });
          return cleaned;
        } catch (_) { return DEFAULT; }
      })(),
      dashboardEditing: false,
      // User overrides for the chrome (topbar + sidebar) and main background
      // colours, keyed by effective colour scheme. null = use the baked-in
      // defaults in CSS. All stored as hex strings (what <input type=color>
      // produces); contrast text colour is derived automatically.
      customTheme: (function () {
        try {
          const raw = localStorage.getItem("stockspace_custom_theme");
          if (!raw) return { chromeLight: null, chromeDark: null, bgLight: null, bgDark: null };
          const p = JSON.parse(raw) || {};
          return {
            chromeLight: typeof p.chromeLight === "string" ? p.chromeLight : null,
            chromeDark: typeof p.chromeDark === "string" ? p.chromeDark : null,
            bgLight: typeof p.bgLight === "string" ? p.bgLight : null,
            bgDark: typeof p.bgDark === "string" ? p.bgDark : null,
          };
        } catch (_) {
          return { chromeLight: null, chromeDark: null, bgLight: null, bgDark: null };
        }
      })(),
    };

    // Captured BeforeInstallPromptEvent from Chrome/Edge/Samsung Internet so
    // we can trigger the native install flow from an in-app button.
    let deferredInstallPrompt = null;

    const FALLBACK_BUSY_LABEL = "Working…";

    function withBusy(label = FALLBACK_BUSY_LABEL, fn) {
      state.busyCount++;
      state.busyLabels.set(label, (state.busyLabels.get(label) || 0) + 1);
      updateBusyIndicator();
      return Promise.resolve()
        .then(fn)
        .finally(() => {
          state.busyCount = Math.max(0, state.busyCount - 1);
          const n = (state.busyLabels.get(label) || 0) - 1;
          if (n <= 0) state.busyLabels.delete(label);
          else state.busyLabels.set(label, n);
          updateBusyIndicator();
        });
    }

    function updateBusyIndicator() {
      const el = document.getElementById("busy");
      if (!el) return;
      const text = document.getElementById("busy-text");
      el.hidden = state.busyCount === 0;
      if (text) {
        // With several concurrent ops, show a generic label.
        const labels = Array.from(state.busyLabels.keys());
        text.textContent =
          state.busyCount > 1 && labels.length > 1
            ? FALLBACK_BUSY_LABEL
            : (labels[0] || FALLBACK_BUSY_LABEL);
      }
    }

    // ---------- api ----------

    async function api(path, { method = "GET", body = null } = {}) {
      if (/\/(undefined|null)(\/|$|\?)/.test(path)) {
        console.error("api(): refusing to call URL with undefined/null id segment:", path);
        throw new ApiError(
          "Internal error: tried to call " + path + ". Please reload the app.",
          0,
          { client: true },
        );
      }
      const opts = {
        method,
        credentials: "same-origin",
        headers: { "accept": "application/json" },
      };
      if (body !== null) {
        opts.headers["content-type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      if (state.csrfToken && method !== "GET" && method !== "HEAD") {
        opts.headers["x-stockspace-csrf"] = state.csrfToken;
      }
      let resp;
      try {
        resp = await fetch(path, opts);
      } catch (err) {
        throw new ApiError("Network error. Is the backend running?", 0, { network: true });
      }
      if (resp.status === 401) {
        // Session expired or missing. Force relock without wiping the configured flag.
        state.authenticated = false;
        state.csrfToken = null;
        wipePrivateState();
        render();
      }
      if (resp.status === 204) return null;
      const ct = resp.headers.get("content-type") || "";
      const data = ct.includes("application/json") ? await resp.json() : await resp.text();
      if (!resp.ok) {
        const msg = data && data.error ? data.error.message : (typeof data === "string" ? data : resp.statusText);
        const code = data && data.error ? data.error.code : null;
        throw new ApiError(msg || "Request failed", resp.status, { code, data });
      }
      return data;
    }

    class ApiError extends Error {
      constructor(message, status, extra = {}) {
        super(message);
        this.status = status;
        Object.assign(this, extra);
      }
    }

    function wipePrivateState() {
      state.appliances = [];
      state.groups = [];
      state.items = [];
      state.activeApplianceId = null;
      state.busyItems.clear();
    }

    // ---------- auth flow ----------

    async function checkAuth() {
      try {
        const status = await api("/api/auth/status");
        state.hasAccounts = !!status.has_accounts;
        state.accountNames = Array.isArray(status.account_names) ? status.account_names : [];
      } catch (e) {
        state.hasAccounts = false;
        state.accountNames = [];
      }
      try {
        const sess = await api("/api/auth/session");
        if (sess && sess.authenticated) {
          state.authenticated = true;
          state.csrfToken = sess.csrf_token || null;
          state.accountId = sess.account_id || null;
          state.accountName = sess.account_name || null;
          state.familyId = sess.family_id || null;
          state.familyRole = sess.family_role || null;
          await reloadInventory();
        }
      } catch (_) {
        /* session endpoint failures mean "not authenticated" */
      }
    }

    async function signup(name, pin) {
      const resp = await api("/api/auth/signup", { method: "POST", body: { name, pin } });
      state.authenticated = true;
      state.hasAccounts = true;
      state.csrfToken = resp.csrf_token || null;
      state.accountId = resp.account_id || null;
      state.accountName = resp.account_name || null;
      state.familyId = null;
      state.familyRole = null;
      try {
        await reloadInventory();
      } catch (err) {
        if (err.status === 401) {
          throw new ApiError(
            "Account was created but the session cookie was blocked by the browser. " +
            "Enable cookies for this site and reload.",
            401,
          );
        }
        throw err;
      }
    }

    async function login(name, pin) {
      const resp = await api("/api/auth/login", { method: "POST", body: { name, pin } });
      state.authenticated = true;
      state.csrfToken = resp.csrf_token || null;
      state.accountId = resp.account_id || null;
      state.accountName = resp.account_name || null;
      state.familyId = resp.family_id || null;
      state.familyRole = resp.family_role || null;
      try {
        await reloadInventory();
      } catch (err) {
        if (err.status === 401) {
          throw new ApiError(
            "Logged in but the session cookie was blocked by the browser. " +
            "Enable cookies for this site and reload.",
            401,
          );
        }
        throw err;
      }
    }

    async function lock() {
      try {
        await api("/api/auth/lock", { method: "POST" });
      } catch (_) {
        // Lock on the client regardless.
      }
      state.authenticated = false;
      state.csrfToken = null;
      state.accountId = null;
      state.accountName = null;
      wipePrivateState();
      // Refresh account list for the login screen.
      try {
        const status = await api("/api/auth/status");
        state.hasAccounts = !!status.has_accounts;
        state.accountNames = Array.isArray(status.account_names) ? status.account_names : [];
      } catch (_) {}
      state.authMode = "login";
      render();
      announce("Session locked.");
    }

    async function changePin(current_pin, new_pin) {
      await api("/api/auth/change-pin", { method: "POST", body: { current_pin, new_pin } });
      state.authenticated = false;
      state.csrfToken = null;
      wipePrivateState();
      render();
    }

    // ---------- data loaders ----------

    async function reloadInventory() {
      const data = await api("/api/items");
      state.items = data.items || [];
      state.groups = data.groups || [];
      state.appliances = data.appliances || [];
      state.tags = data.tags || [];
      if (data.family) {
        state.familyId = data.family.family_id || null;
        state.familyRole = data.family.my_role || null;
      }
    }

    // Separately loads family details (members + invitations) for the
    // Settings page.
    async function reloadFamily() {
      const data = await api("/api/family");
      state.family = data;
      state.familyId = data.family_id || null;
      state.familyRole = data.my_role || null;
    }

    function canEditStructure() {
      // Solo accounts (no family) and family Owners can edit appliances/groups.
      // Members can only edit items.
      return state.familyId === null || state.familyRole === "owner";
    }

    // ---------- rendering ----------

    let renderScheduled = false;
    function renderIfIdle() {
      if (renderScheduled) return;
      renderScheduled = true;
      queueMicrotask(() => {
        renderScheduled = false;
        render();
      });
    }

    function render() {
      $root.textContent = "";
      $root.appendChild(buildHeader());

      // The live region is removed when $root is cleared; re-attach it.
      $root.appendChild($live);

      let main;
      if (!state.authenticated) {
        // Pick signup vs login based on whether any accounts exist, unless the
        // user has explicitly toggled.
        const mode = state.authMode === "auto"
          ? (state.hasAccounts ? "login" : "signup")
          : state.authMode;
        main = mode === "signup" ? renderSignup() : renderLogin();
      } else {
        switch (state.view) {
          case "appliances": main = renderAppliances(); break;
          case "appliance": main = renderApplianceDetail(); break;
          case "inventory": main = renderGlobalInventory(); break;
          case "settings": main = renderSettings(); break;
          default: main = renderDashboard();
        }
      }
      $root.appendChild(main);

      // The sidebar + backdrop live on <body> and persist across renders so
      // the CSS `transition: transform` on `.sidebar.open` actually fires —
      // if they were rebuilt each render the browser would see the final
      // state on mount and skip the animation.
      updateSidebar();
    }

    // Persistent sidebar / backdrop refs. Created lazily on first auth render.
    let $sidebar = null;
    let $sidebarBackdrop = null;

    function ensureSidebarElements() {
      if ($sidebar) return;
      $sidebarBackdrop = document.createElement("div");
      $sidebarBackdrop.className = "sidebar-backdrop";
      $sidebarBackdrop.addEventListener("click", () => {
        if (state.sidebarOpen) { state.sidebarOpen = false; render(); }
      });
      document.body.appendChild($sidebarBackdrop);

      $sidebar = document.createElement("aside");
      $sidebar.className = "sidebar";
      $sidebar.setAttribute("aria-label", "Appliances");
      document.body.appendChild($sidebar);
    }

    function updateSidebar() {
      if (!state.authenticated) {
        document.body.classList.remove("sidebar-visible");
        if ($sidebar) {
          $sidebar.classList.remove("open");
          $sidebarBackdrop.classList.remove("open");
        }
        return;
      }
      ensureSidebarElements();
      // Rebuild the sidebar contents each render; the OUTER element persists.
      $sidebar.textContent = "";
      for (const child of buildSidebarContents()) $sidebar.appendChild(child);
      $sidebar.classList.toggle("open", state.sidebarOpen);
      $sidebarBackdrop.classList.toggle("open", state.sidebarOpen);
      // Body class drives the "push content" layout on wide screens via CSS.
      document.body.classList.toggle("sidebar-visible", state.sidebarOpen);
    }

    function buildSidebarContents() {
      // Returns an array of child nodes for the persistent <aside>.
      // On wide viewports where the sidebar is docked, selecting an appliance
      // keeps it open; on narrow (overlay) viewports we auto-close.
      const narrow = !window.matchMedia("(min-width: 760px)").matches;
      const canEdit = canEditStructure();
      const kids = [
        h("h2", {}, [
          h("span", { text: "Menu" }),
          h("button", {
            type: "button",
            class: "icon ghost",
            style: "margin-left:auto;min-height:36px;min-width:36px",
            "aria-label": "Close sidebar",
            onClick: () => { state.sidebarOpen = false; render(); },
            text: "×",
          }),
        ]),
      ];

      // Primary nav. Each item gets a small line icon in front of its label.
      const navSection = h("div", { class: "sb-nav", style: "display:flex;flex-direction:column;gap:0.3rem" });
      const NAV_ITEMS = [
        ["dashboard", "Dashboard",
          `<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>`],
        ["appliances", "Appliances",
          `<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="5" y1="11" x2="19" y2="11"/><line x1="8" y1="7" x2="8" y2="8.5"/><line x1="8" y1="14" x2="8" y2="15.5"/>`],
        ["inventory", "All Inventory",
          `<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/>`],
        ["settings", "Settings",
          `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`],
      ];
      function sbIcon(innerSvg) {
        const span = h("span", { class: "sb-icon", "aria-hidden": "true" });
        span.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${innerSvg}</svg>`;
        return span;
      }
      for (const [view, label, iconSvg] of NAV_ITEMS) {
        navSection.appendChild(h("button", {
          type: "button",
          class: "sb-item",
          "aria-current": state.view === view && state.activeApplianceId == null ? "true" : null,
          onClick: () => {
            state.view = view;
            state.activeApplianceId = null;
            if (view === "settings") state.family = null;
            if (narrow) state.sidebarOpen = false;
            render();
          },
        }, [sbIcon(iconSvg), h("span", { text: label })]));
      }
      navSection.appendChild(h("button", {
        type: "button",
        class: "sb-item",
        onClick: () => {
          if (narrow) state.sidebarOpen = false;
          lock();
        },
      }, [
        sbIcon(`<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4"/>`),
        h("span", { text: "Lock" }),
      ]));
      kids.push(navSection);

      kids.push(h("h2", { style: "margin-top:0.5rem" }, [h("span", { text: "Appliances" })]));
      if (canEdit) {
        kids.push(h("button", {
          type: "button",
          class: "sb-add",
          onClick: () => {
            if (narrow) state.sidebarOpen = false;
            render();
            openApplianceDialog();
          },
          text: "+ Add appliance",
        }));
      }
      if (state.appliances.length === 0) {
        kids.push(h("div", { style: "color:var(--chrome-muted);padding:0.5rem 0.2rem", text: "No appliances yet." }));
      } else {
        for (const a of state.appliances) {
          const itemCount = state.items.filter(i => i.appliance_id === a.id).length;
          const isActive = state.view === "appliance" && state.activeApplianceId === a.id;
          const metaParts = [itemCount + " " + pluralize("item", itemCount), a.kind];
          if (state.familyId && a.owner_account_name && a.owner_account_id !== state.accountId) {
            metaParts.push(a.owner_account_name);
          }
          kids.push(h("button", {
            type: "button",
            class: "sb-item",
            "aria-current": isActive ? "true" : null,
            onClick: () => {
              state.view = "appliance";
              state.activeApplianceId = a.id;
              if (narrow) state.sidebarOpen = false;
              render();
            },
          }, [
            h("div", { style: "font-weight:600", text: a.name }),
            h("span", { class: "sb-meta", text: metaParts.join(" · ") }),
          ]));
        }
      }
      return kids;
    }

    function buildHeader() {
      // Full SVG wordmark that sits on the chrome colour (its background rect
      // is removed so the chrome shows through). --chrome-text is `#11182c`
      // on bright chromes and `#e8ecf7` on dark ones, so we read it to pick
      // which colour variant to show.
      const chromeText = getComputedStyle(document.documentElement)
        .getPropertyValue("--chrome-text").trim().toLowerCase();
      const chromeIsDark = chromeText !== "#11182c";
      const wordmarkImg = h("img", {
        src: chromeIsDark ? "/icons/wordmark-on-dark.svg" : "/icons/wordmark-on-light.svg",
        alt: "StockSpace",
        class: "wordmark-img",
      });
      // Logo is a button when signed in: tap sends you to the dashboard.
      // Falls back to a plain span on auth screens.
      const wordmark = state.authenticated
        ? h("button", {
            type: "button",
            class: "wordmark wordmark-btn",
            "aria-label": "Go to dashboard",
            onClick: () => {
              state.view = "dashboard";
              state.family = null;
              if (state.sidebarOpen && window.innerWidth <= 720) state.sidebarOpen = false;
              render();
            },
          }, [wordmarkImg])
        : h("span", { class: "wordmark" }, [wordmarkImg]);
      const titleChildren = [wordmark];
      if (state.authenticated && state.accountName) {
        titleChildren.push(h("span", { class: "pill", style: "margin-left:0.5rem;font-weight:500", text: state.accountName }));
      }
      const title = h("h1", {}, titleChildren);

      // Primary nav now lives exclusively in the sidebar (sb-nav section),
      // so the header no longer carries Dashboard / Appliances / Settings /
      // Lock buttons on any screen size.

      // Theme toggle
      const currentTheme = document.documentElement.dataset.theme || "auto";
      const themeBtn = h("button", {
        type: "button",
        class: "icon ghost",
        "aria-label": "Toggle theme (current: " + currentTheme + ")",
        onClick: cycleTheme,
        text: currentTheme === "dark" ? "☾" : (currentTheme === "light" ? "☀" : "◐"),
      });

      // Row density toggle: cycles full → compact → grid → full. Shown as a
      // text pill (not an icon) so it reads clearly as a label and doesn't
      // get confused with the hamburger sidebar button next to it.
      const nextDensity = { full: "compact", compact: "grid", grid: "full" }[state.density];
      const densityGlyph = state.density === "grid" ? "▦" : (state.density === "compact" ? "▤" : "❏");
      const densityLabel = state.density.charAt(0).toUpperCase() + state.density.slice(1);
      const densityBtn = state.authenticated
        ? h("button", {
            type: "button",
            class: "ghost density-btn",
            "aria-label": "Switch to " + nextDensity + " view (current: " + state.density + ")",
            title: "Switch to " + nextDensity + " view",
            onClick: toggleDensity,
            text: densityGlyph + " " + densityLabel,
          })
        : null;

      // Install button (visible only when the browser has fired beforeinstallprompt
      // and the app is not already installed). Tapping triggers the native prompt.
      const extras = [densityBtn, themeBtn].filter(Boolean);
      if (state.installPromptAvailable && !state.isInstalled) {
        extras.unshift(h("button", {
          type: "button",
          class: "ghost",
          title: "Install StockSpace",
          onClick: triggerInstall,
          text: "⬇ Install",
        }));
      }

      // Hamburger toggle for the appliance sidebar. Hidden while the sidebar
      // is already open — the sidebar has its own × close button there.
      const sidebarBtn = state.authenticated && !state.sidebarOpen
        ? h("button", {
            type: "button",
            class: "icon ghost",
            "aria-label": "Open appliances sidebar",
            "aria-expanded": "false",
            title: "Appliances",
            onClick: () => { state.sidebarOpen = true; render(); },
            text: "≡",
          })
        : null;

      // flex:1 on the title eats the remaining space so the extras (density
      // toggle, theme toggle, Install) sit flush against the right edge.
      title.style.flex = "1";
      const header = h("header", { class: "app" }, [
        sidebarBtn, title, ...extras,
      ].filter(Boolean));
      return header;
    }

    function cycleTheme() {
      const next = { auto: "light", light: "dark", dark: "auto" };
      const current = document.documentElement.dataset.theme || "auto";
      const nextTheme = next[current];
      if (nextTheme === "auto") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = nextTheme;
      try { localStorage.setItem("stockspace_theme", nextTheme); } catch (_) {}
      applyCustomTheme();
      render();
    }

    function toggleDensity() {
      const next = { full: "compact", compact: "grid", grid: "full" };
      state.density = next[state.density] || "full";
      try { localStorage.setItem("stockspace_density", state.density); } catch (_) {}
      render();
    }

    // ---------- Custom theme (user-chosen chrome + bg) ----------

    function effectiveColorScheme() {
      const dt = document.documentElement.dataset.theme;
      if (dt === "light" || dt === "dark") return dt;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    // Luminance-based contrast text colour. For a user-picked chrome bg we
    // return either our default dark text or default light text, whichever
    // reads better.
    function contrastText(hex) {
      if (typeof hex !== "string" || !/^#[0-9a-f]{6}$/i.test(hex)) return null;
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return lum > 0.55 ? "#11182c" : "#e8ecf7";
    }

    function applyCustomTheme() {
      const scheme = effectiveColorScheme();
      const t = state.customTheme;
      const chrome = scheme === "dark" ? t.chromeDark : t.chromeLight;
      const bg = scheme === "dark" ? t.bgDark : t.bgLight;
      const root = document.documentElement;
      if (chrome) {
        root.style.setProperty("--chrome", chrome);
        const txt = contrastText(chrome);
        if (txt) root.style.setProperty("--chrome-text", txt);
      } else {
        root.style.removeProperty("--chrome");
        root.style.removeProperty("--chrome-text");
      }
      if (bg) {
        root.style.setProperty("--bg", bg);
      } else {
        root.style.removeProperty("--bg");
      }
      // Sync the browser URL-bar / status-bar color to the resolved chrome.
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        const resolved = chrome || getComputedStyle(root).getPropertyValue("--chrome").trim();
        if (resolved) meta.setAttribute("content", resolved);
      }
    }

    function saveCustomTheme() {
      try { localStorage.setItem("stockspace_custom_theme", JSON.stringify(state.customTheme)); }
      catch (_) {}
    }

    // ---------- dashboard ----------

    // ---------- dashboard modules ----------
    // Each module has an id, a human title (shown in edit mode), and a
    // render() that returns a DOM node (or null to render nothing). Order
    // and visibility come from state.dashboardLayout.
    const DASHBOARD_MODULES = {
      search: {
        title: "Search bar",
        render: () => {
          if (state.items.length === 0 && state.appliances.length === 0) return null;
          const searchInput = h("input", {
            type: "search",
            inputmode: "search",
            placeholder: "Search items, groups, categories, notes…",
            "aria-label": "Search inventory",
            value: state.filters.q,
            onInput: (e) => { state.filters.q = e.target.value; render(); },
          });
          const card = h("div", { class: "card" }, [
            h("label", { style: "margin-top:0" }, [
              h("span", { style: "display:flex;align-items:center;gap:0.5rem;justify-content:space-between" }, [
                h("span", { text: "Search" }),
                state.filters.q.trim()
                  ? h("button", {
                      type: "button", class: "ghost",
                      onClick: () => { state.filters.q = ""; render(); },
                      text: "Clear",
                    })
                  : null,
              ]),
              searchInput,
            ]),
          ]);
          queueMicrotask(() => { if (state.filters.q) searchInput.focus(); });
          return card;
        },
      },
      stats: {
        title: "Overview stats",
        render: () => {
          const totals = computeTotals();
          return h("section", { class: "dash-grid", "aria-label": "Overview" }, [
            statCard("Appliances", state.appliances.length),
            statCard("Groups", state.groups.length),
            statCard("Items", state.items.length),
            statCard("Expired", totals.expired, "danger"),
            statCard("Expiring in ≤ 7 days", totals.soon, "warning"),
          ]);
        },
      },
      expiring: {
        title: "Expiring or expired items",
        render: () => {
          if (state.appliances.length === 0) return null;
          const soonItems = state.items
            .map(i => ({ i, state: expirationState(i.expiration_date) }))
            .filter(x => x.state === "expired" || x.state === "soon")
            .sort((a, b) => (a.i.expiration_date || "").localeCompare(b.i.expiration_date || ""));
          if (soonItems.length === 0) return null;
          const list = newItemsContainer();
          for (const { i } of soonItems.slice(0, 20)) {
            list.appendChild(renderInventoryItem(i, { showAppliance: true }));
          }
          return h("section", { class: "card stack", "aria-labelledby": "soon-h" }, [
            h("h2", { id: "soon-h", style: "margin-top:0", text: "Expiring or expired" }),
            list,
          ]);
        },
      },
      appliances: {
        title: "Appliance summaries",
        render: () => {
          if (state.appliances.length === 0) return null;
          const grid = h("section", { class: "dash-grid", "aria-label": "Appliances" });
          for (const a of state.appliances) {
            const items = state.items.filter(i => i.appliance_id === a.id);
            const topRow = [
              h("strong", { text: a.name }),
              h("span", { class: "pill", text: a.kind }),
            ];
            if (state.familyId && a.owner_account_name && a.owner_account_id !== state.accountId) {
              topRow.push(h("span", { class: "pill accent", text: a.owner_account_name }));
            }
            const card = h("button", {
              class: "card stack",
              style: "text-align:left;cursor:pointer;",
              onClick: () => { state.activeApplianceId = a.id; state.view = "appliance"; render(); },
            }, [
              h("div", { class: "row" }, topRow),
              h("div", { class: "muted", text: items.length + " " + pluralize("item", items.length) }),
              a.location ? h("div", { class: "muted", text: a.location }) : null,
            ]);
            grid.appendChild(card);
          }
          return grid;
        },
      },
    };

    function saveDashboardLayout() {
      try {
        localStorage.setItem(
          "stockspace_dashboard_layout",
          JSON.stringify(state.dashboardLayout),
        );
      } catch (_) {}
    }

    function moveDashboardModule(fromIdx, toIdx) {
      if (toIdx < 0 || toIdx >= state.dashboardLayout.length || fromIdx === toIdx) return;
      const [row] = state.dashboardLayout.splice(fromIdx, 1);
      state.dashboardLayout.splice(toIdx, 0, row);
      saveDashboardLayout();
    }

    function renderDashboard() {
      const main = h("main", { class: "app" });
      const editing = state.dashboardEditing;

      // Toolbar: Edit layout / Done + (edit-only) Reset.
      const toolbar = h("div", {
        class: "row",
        style: "justify-content:flex-end;gap:0.4rem;margin-bottom:0.75rem;flex-wrap:wrap",
      }, [
        editing
          ? h("button", {
              type: "button", class: "ghost",
              onClick: () => {
                state.dashboardLayout = [
                  { id: "search", visible: true },
                  { id: "stats", visible: true },
                  { id: "expiring", visible: true },
                  { id: "appliances", visible: true },
                ];
                saveDashboardLayout();
                render();
              },
              text: "Reset layout",
            })
          : null,
        h("button", {
          type: "button",
          class: editing ? "primary" : "ghost",
          onClick: () => {
            state.dashboardEditing = !state.dashboardEditing;
            if (!state.dashboardEditing) saveDashboardLayout();
            render();
          },
          text: editing ? "Done" : "✎ Edit layout",
        }),
      ]);
      main.appendChild(toolbar);

      // Search short-circuit: typing in the search box takes over the view
      // and shows a flat result list instead of the normal dashboard. Only
      // applies when NOT editing (so you can rearrange with a query present).
      if (!editing && state.filters.q.trim()) {
        // Still render the search module itself so the user can clear it.
        const searchEntry = state.dashboardLayout.find(m => m.id === "search" && m.visible);
        if (searchEntry) {
          const node = DASHBOARD_MODULES.search.render();
          if (node) main.appendChild(node);
        }
        const matches = applyFilters(state.items);
        if (matches.length === 0) {
          main.appendChild(h("div", { class: "card empty" }, [
            h("h3", { style: "margin-top:0", text: "No matches" }),
            h("p", { class: "muted", text: `Nothing found for "${state.filters.q.trim()}". Try different terms or clear the search.` }),
          ]));
          return main;
        }
        const list = newItemsContainer();
        for (const i of matches) list.appendChild(renderInventoryItem(i, { showAppliance: true }));
        main.appendChild(h("section", { class: "card stack", "aria-label": "Search results" }, [
          h("h2", { style: "margin:0;font-size:1.1rem", text: `${matches.length} ${pluralize("result", matches.length)}` }),
          list,
        ]));
        return main;
      }

      // No-appliances empty state only when NOT editing (so the user can
      // still rearrange their layout on a fresh account).
      if (!editing && state.appliances.length === 0) {
        // Still render search module above the empty state if visible.
        for (const entry of state.dashboardLayout) {
          if (entry.id !== "search" || !entry.visible) continue;
          const node = DASHBOARD_MODULES.search.render();
          if (node) main.appendChild(node);
          break;
        }
        if (canEditStructure()) {
          main.appendChild(emptyState(
            "No appliances yet",
            "Start by adding a fridge or freezer.",
            () => { state.view = "appliances"; render(); },
            "Add an appliance",
          ));
        } else {
          main.appendChild(emptyState(
            "No appliances yet",
            "Your family's owners haven't added any appliances.",
          ));
        }
        return main;
      }

      // Render modules in layout order. In edit mode, every module shows
      // (even if invisible) wrapped with reorder + toggle controls. Outside
      // edit mode, only visible modules render.
      for (let idx = 0; idx < state.dashboardLayout.length; idx++) {
        const entry = state.dashboardLayout[idx];
        const mod = DASHBOARD_MODULES[entry.id];
        if (!mod) continue;
        if (!editing && !entry.visible) continue;

        const body = mod.render();
        if (!editing) {
          if (body) {
            body.classList.add("dash-module");
            main.appendChild(body);
          }
          continue;
        }

        // Edit-mode wrapper: drag handle, title, move buttons, visibility.
        const wrapper = h("div", {
          class: "dash-module dash-module-edit" + (entry.visible ? "" : " hidden-mod"),
          draggable: "true",
          "data-idx": String(idx),
        }, [
          h("div", { class: "dash-module-head" }, [
            h("span", { class: "dash-drag", title: "Drag to reorder", "aria-hidden": "true", text: "⋮⋮" }),
            h("strong", { text: mod.title, style: "flex:1" }),
            h("button", {
              type: "button", class: "ghost icon", title: "Move up",
              "aria-label": "Move " + mod.title + " up",
              disabled: idx === 0 ? "disabled" : null,
              onClick: () => { moveDashboardModule(idx, idx - 1); render(); },
              text: "↑",
            }),
            h("button", {
              type: "button", class: "ghost icon", title: "Move down",
              "aria-label": "Move " + mod.title + " down",
              disabled: idx === state.dashboardLayout.length - 1 ? "disabled" : null,
              onClick: () => { moveDashboardModule(idx, idx + 1); render(); },
              text: "↓",
            }),
            h("label", { class: "dash-toggle", title: entry.visible ? "Hide" : "Show" }, [
              h("input", {
                type: "checkbox",
                checked: entry.visible ? "checked" : null,
                onChange: (e) => {
                  entry.visible = e.target.checked;
                  saveDashboardLayout();
                  render();
                },
              }),
              h("span", { text: entry.visible ? "Visible" : "Hidden" }),
            ]),
          ]),
          body
            ? h("div", { class: "dash-module-body" }, [body])
            : h("div", { class: "dash-module-body muted", text: "(nothing to show right now)" }),
        ]);

        // Simple HTML5 drag + drop reorder. Mobile users have the ↑/↓ btns.
        wrapper.addEventListener("dragstart", (e) => {
          wrapper.classList.add("dragging");
          try { e.dataTransfer.setData("text/plain", String(idx)); } catch (_) {}
          if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
        });
        wrapper.addEventListener("dragend", () => wrapper.classList.remove("dragging"));
        wrapper.addEventListener("dragover", (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "move"; });
        wrapper.addEventListener("drop", (e) => {
          e.preventDefault();
          let fromIdx = -1;
          try { fromIdx = parseInt(e.dataTransfer.getData("text/plain"), 10); } catch (_) {}
          if (!Number.isFinite(fromIdx) || fromIdx < 0) return;
          const toIdx = idx;
          moveDashboardModule(fromIdx, toIdx);
          render();
        });

        main.appendChild(wrapper);
      }

      return main;
    }

    function statCard(label, value, kind = "") {
      return h("div", { class: "card dash-stat " + kind }, [
        h("div", { class: "muted", text: label }),
        h("div", { class: "big", text: String(value) }),
      ]);
    }

    function computeTotals() {
      let expired = 0, soon = 0;
      for (const i of state.items) {
        const s = expirationState(i.expiration_date);
        if (s === "expired") expired++;
        else if (s === "soon") soon++;
      }
      return { expired, soon };
    }

    // ---------- appliances ----------

    function renderAppliances() {
      const main = h("main", { class: "app" });

      const canEdit = canEditStructure();
      const headerKids = [h("h2", { style: "margin:0", text: "Appliances" })];
      if (canEdit) {
        headerKids.push(h("button", { class: "primary", onClick: () => openApplianceDialog(), text: "+ Add appliance" }));
      }
      const header = h("div", { class: "row", style: "justify-content:space-between;margin-bottom:1rem" }, headerKids);
      main.appendChild(header);

      if (state.appliances.length === 0) {
        if (canEdit) {
          main.appendChild(emptyState(
            "No appliances yet",
            "Add your first fridge, freezer, or storage area.",
            () => openApplianceDialog(),
            "Add an appliance",
          ));
        } else {
          main.appendChild(emptyState(
            "No appliances yet",
            "Your family's owners haven't added any appliances yet.",
          ));
        }
        return main;
      }

      const list = h("div", { class: "stack" });
      for (const a of state.appliances) {
        const itemCount = state.items.filter(i => i.appliance_id === a.id).length;
        const metaKids = [
          h("strong", { text: a.name }),
          h("span", { class: "pill", text: a.kind }),
        ];
        if (state.familyId && a.owner_account_name && a.owner_account_id !== state.accountId) {
          metaKids.push(h("span", { class: "pill accent", text: a.owner_account_name }));
        }
        const actionKids = [
          h("button", { onClick: () => { state.activeApplianceId = a.id; state.view = "appliance"; render(); }, text: "Open" }),
        ];
        if (canEdit) {
          actionKids.push(h("button", { onClick: () => openApplianceDialog(a), text: "Edit" }));
          actionKids.push(h("button", { class: "danger", onClick: () => deleteApplianceFlow(a), text: "Delete" }));
        }
        list.appendChild(h("div", { class: "card row", style: "justify-content:space-between;flex-wrap:wrap;gap:0.75rem" }, [
          h("div", {}, [
            h("div", { class: "row" }, metaKids),
            a.location ? h("div", { class: "muted", text: a.location }) : null,
            h("div", { class: "muted", text: itemCount + " " + pluralize("item", itemCount) }),
          ]),
          h("div", { class: "row" }, actionKids),
        ]));

      main.appendChild(list);
      return main;
