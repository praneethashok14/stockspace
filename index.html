    function openApplianceDialog(existing) {
      const isEdit = !!existing;
      const data = {
        name: existing?.name || "",
        kind: existing?.kind || "fridge",
        location: existing?.location || "",
        description: existing?.description || "",
      };
      const err = h("div", { role: "alert", class: "muted" });
      openDialog({
        title: isEdit ? "Edit appliance" : "Add appliance",
        body: h("form", {
          id: "appliance-form",
          onSubmit: async (e) => {
            e.preventDefault();
            err.textContent = "";
            if (!data.name.trim()) { err.textContent = "Name is required."; return; }
            await withBusy("Saving…", async () => {
              try {
                if (isEdit) {
                  await api("/api/appliances/" + encodeURIComponent(existing.id), {
                    method: "PATCH",
                    body: {
                      name: data.name,
                      kind: data.kind,
                      location: data.location,
                      description: data.description,
                    },
                  });
                } else {
                  await api("/api/appliances", {
                    method: "POST",
                    body: {
                      name: data.name,
                      kind: data.kind,
                      location: data.location || null,
                      description: data.description || null,
                    },
                  });
                }
                await reloadInventory();
                toast(isEdit ? "Appliance updated." : "Appliance added.", "success");
                closeDialog();
                render();
              } catch (e2) {
                err.textContent = e2.message;
              }
            });
          },
        }, [
          h("label", {}, ["Name",
            h("input", { type: "text", required: true, maxlength: "200", value: data.name,
              onInput: (e) => { data.name = e.target.value; } }),
          ]),
          h("label", {}, ["Type",
            selectEl([
              ["fridge", "Fridge"],
              ["freezer", "Freezer"],
              ["shelf", "Shelf"],
              ["other", "Other"],
            ], data.kind, (v) => { data.kind = v; }),
          ]),
          h("label", {}, ["Location (optional)",
            h("input", { type: "text", value: data.location, maxlength: "200",
              onInput: (e) => { data.location = e.target.value; } }),
          ]),
          h("label", {}, ["Description (optional)",
            h("textarea", { onInput: (e) => { data.description = e.target.value; }, text: data.description }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: closeDialog },
          { label: isEdit ? "Save" : "Add", primary: true, submit: "appliance-form" },
        ],
      });
    }

    async function deleteApplianceFlow(appliance) {
      const items = state.items.filter(i => i.appliance_id === appliance.id);
      const groups = state.groups.filter(g => g.appliance_id === appliance.id);
      const totalChildren = items.length + groups.length;
      if (totalChildren === 0) {
        if (!confirm(`Delete "${appliance.name}"? This cannot be undone.`)) return;
        await withBusy("Deleting…", async () => {
          await api("/api/appliances/" + encodeURIComponent(appliance.id), { method: "DELETE" });
          await reloadInventory();
          toast("Appliance deleted.", "success");
          render();
        });
        return;
      }
      // Non-empty: let the user choose a strategy.
      let strategy = "move";
      let moveTo = state.appliances.find(a => a.id !== appliance.id)?.id || "";
      const err = h("div", { class: "muted", role: "alert" });
      const moveSelect = selectEl(
        state.appliances.filter(a => a.id !== appliance.id).map(a => [a.id, a.name]),
        moveTo,
        (v) => { moveTo = v; },
      );
      openDialog({
        title: `Delete "${appliance.name}"`,
        body: h("div", { class: "stack" }, [
          h("p", { text: `This appliance holds ${items.length} ${pluralize("item", items.length)} and ${groups.length} ${pluralize("group", groups.length)}. Choose what happens to them:` }),
          h("fieldset", { style: "border:none;padding:0" }, [
            radioEl("del-strat", "move", strategy === "move", "Move contents to another appliance", (v) => { strategy = v; }),
            moveSelect,
            radioEl("del-strat", "cascade", strategy === "cascade", "Delete contents permanently", (v) => { strategy = v; }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: closeDialog },
          { label: "Delete appliance", primary: true, danger: true, onClick: async () => {
              err.textContent = "";
              if (strategy === "move") {
                if (!moveTo) { err.textContent = "Pick a destination appliance."; return; }
              }
              await withBusy("Deleting…", async () => {
                try {
                  let url = "/api/appliances/" + encodeURIComponent(appliance.id) + "?strategy=" + strategy;
                  if (strategy === "move") url += "&move_to=" + encodeURIComponent(moveTo);
                  await api(url, { method: "DELETE" });
                  await reloadInventory();
                  toast("Appliance deleted.", "success");
                  closeDialog();
                  render();
                } catch (e2) {
                  err.textContent = e2.message;
                }
              });
            } },
        ],
      });
    }

    // ---------- appliance detail ----------

    function renderApplianceDetail() {
      const a = state.appliances.find(x => x.id === state.activeApplianceId);
      const main = h("main", { class: "app" });
      if (!a) {
        main.appendChild(emptyState("Appliance not found", "It may have been deleted.",
          () => { state.view = "appliances"; render(); }, "Back to appliances"));
        return main;
      }

      const headerMetaKids = [
        h("span", { class: "pill", text: a.kind }),
      ];
      if (a.location) headerMetaKids.push(h("span", { text: a.location }));
      if (state.familyId && a.owner_account_name && a.owner_account_id !== state.accountId) {
        headerMetaKids.push(h("span", { class: "pill accent", text: a.owner_account_name }));
      }
      const headerActionKids = [
        h("button", { class: "primary", onClick: () => openItemDialog(null, a.id), text: "+ Add item" }),
        h("button", { onClick: () => openGroupDialog(null, a.id), text: "+ Add group" }),
      ];
      main.appendChild(h("div", { class: "row", style: "justify-content:space-between;margin-bottom:1rem" }, [
        h("div", {}, [
          h("button", { class: "ghost", onClick: () => { state.view = "appliances"; render(); }, text: "← All appliances" }),
          h("h2", { style: "margin:0.25rem 0 0", text: a.name }),
          h("div", { class: "row muted" }, headerMetaKids),
        ]),
        h("div", { class: "row" }, headerActionKids),
      ]));

      const items = state.items.filter(i => i.appliance_id === a.id);
      const groups = state.groups.filter(g => g.appliance_id === a.id);
      if (items.length === 0 && groups.length === 0) {
        main.appendChild(emptyState("Nothing here yet", "Add your first item or group.",
          () => openItemDialog(null, a.id), "Add an item"));
        return main;
      }
      main.appendChild(renderGroupedItems(items, groups, { showAppliance: false }));
      return main;
    }

    // ---------- global inventory ----------

    function renderGlobalInventory() {
      const main = h("main", { class: "app" });
      main.appendChild(h("h2", { text: "All Inventory" }));
      main.appendChild(renderFilters());

      const filtered = applyFilters(state.items);
      if (filtered.length === 0) {
        main.appendChild(emptyState("No matches", "Try clearing filters.", clearFilters, "Clear filters"));
        return main;
      }
      // Group items by appliance for clarity.
      const byAppliance = new Map();
      for (const item of filtered) {
        if (!byAppliance.has(item.appliance_id)) byAppliance.set(item.appliance_id, []);
        byAppliance.get(item.appliance_id).push(item);
      }
      const stack = h("div", { class: "stack" });
      for (const [applianceId, items] of byAppliance) {
        const appliance = state.appliances.find(a => a.id === applianceId);
        const applianceGroups = state.groups.filter(g => g.appliance_id === applianceId);
        stack.appendChild(h("div", { class: "card stack" }, [
          h("div", { class: "row", style: "justify-content:space-between" }, [
            h("strong", { text: appliance ? appliance.name : "(unknown appliance)" }),
            appliance ? h("span", { class: "pill", text: appliance.kind }) : null,
          ]),
          renderGroupedItems(items, applianceGroups, { showAppliance: false }),
        ]));
      }
      main.appendChild(stack);
      return main;
    }

    function renderFilters() {
      const wrap = h("div", { class: "card stack" });
      wrap.appendChild(h("div", { class: "filters" }, [
        h("label", {}, ["Search",
          h("input", { type: "search", placeholder: "Name or group", value: state.filters.q,
            onInput: (e) => { state.filters.q = e.target.value; render(); } }),
        ]),
        h("label", {}, ["Appliance",
          selectEl(
            [["", "Any"]].concat(state.appliances.map(a => [a.id, a.name])),
            state.filters.applianceId,
            (v) => { state.filters.applianceId = v; render(); },
          ),
        ]),
        h("label", {}, ["Tracking",
          selectEl([
            ["", "Any"],
            ["individual", "Individual"],
            ["pack", "Pack"],
          ], state.filters.tracking, (v) => { state.filters.tracking = v; render(); }),
        ]),
        h("label", {}, ["Pack status",
          selectEl([
            ["", "Any"],
            ["opened", "Opened"],
            ["unopened", "Unopened"],
          ], state.filters.packStatus, (v) => { state.filters.packStatus = v; render(); }),
        ]),
        h("label", {}, ["Expiration",
          selectEl([
            ["", "Any"],
            ["expired", "Expired"],
            ["soon", "Expiring ≤7 days"],
            ["ok", "Fine"],
            ["none", "No date"],
          ], state.filters.expiration, (v) => { state.filters.expiration = v; render(); }),
        ]),
        state.tags.length > 0
          ? h("label", {}, ["Tag",
              selectEl(
                [["", "Any"]].concat(state.tags.map(t => [t.id, t.name])),
                state.filters.tag,
                (v) => { state.filters.tag = v; render(); },
              ),
            ])
          : null,
        h("label", {}, ["Sort",
          selectEl([
            ["name", "Name"],
            ["expiration", "Expiration"],
            ["quantity", "Quantity"],
            ["appliance", "Appliance"],
          ], state.sort, (v) => { state.sort = v; render(); }),
        ]),
      ]));
      if (Object.values(state.filters).some(Boolean)) {
        wrap.appendChild(h("div", { class: "row", style: "justify-content:flex-end" }, [
          h("button", { class: "ghost", onClick: clearFilters, text: "Clear filters" }),
        ]));
      }
      return wrap;
    }

    function clearFilters() {
      state.filters = { q: "", applianceId: "", category: "", tracking: "", packStatus: "", expiration: "", tag: "" };
      render();
    }

    function applyFilters(items) {
      const f = state.filters;
      const q = (f.q || "").trim().toLowerCase();
      let out = items.filter(i => {
        if (f.applianceId && i.appliance_id !== f.applianceId) return false;
        if (f.tracking && i.tracking !== f.tracking) return false;
        if (f.packStatus) {
          if (i.tracking !== "pack") return false;
          if (i.pack_status !== f.packStatus) return false;
        }
        if (f.expiration) {
          if (expirationState(i.expiration_date) !== f.expiration) return false;
        }
        if (f.tag) {
          if (!Array.isArray(i.tag_ids) || !i.tag_ids.includes(f.tag)) return false;
        }
        if (q) {
          const groupName = i.group_id ? (state.groups.find(g => g.id === i.group_id)?.name || "") : "";
          const applianceName = state.appliances.find(a => a.id === i.appliance_id)?.name || "";
          const parts = [
            i.name,
            groupName,
            applianceName,
            i.category,
            i.notes,
            i.tracking === "individual" ? i.unit : i.pack_label,
            i.tracking === "pack" ? i.pack_status : "",
          ].filter(Boolean);
          const hay = parts.join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      out.sort(compareItems);
      return out;
    }

    function compareItems(a, b) {
      switch (state.sort) {
        case "expiration":
          return (a.expiration_date || "~").localeCompare(b.expiration_date || "~");
        case "quantity": {
          const qa = a.tracking === "individual" ? (a.quantity || 0) : (a.pack_count || 0);
          const qb = b.tracking === "individual" ? (b.quantity || 0) : (b.pack_count || 0);
          return qb - qa;
        }
        case "appliance": {
          const an = state.appliances.find(x => x.id === a.appliance_id)?.name || "";
          const bn = state.appliances.find(x => x.id === b.appliance_id)?.name || "";
          return an.localeCompare(bn) || a.name.localeCompare(b.name);
        }
        default:
          return a.name.localeCompare(b.name);
      }
    }

    // ---------- items rendering ----------

    const GRID_LAYOUT_STYLE =
      "display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.6rem;padding:0.6rem";

    function tagPillsFor(item) {
      if (!Array.isArray(item.tag_ids) || item.tag_ids.length === 0) return [];
      const byId = new Map(state.tags.map(t => [t.id, t]));
      const out = [];
      for (const tid of item.tag_ids) {
        const t = byId.get(tid);
        if (!t) continue; // orphaned (deleted tag) — silently drop
        out.push(h("span", { class: "pill accent", text: t.name }));
      }
      return out;
    }

    function newItemsContainer() {
      return state.density === "grid"
        ? h("div", { style: GRID_LAYOUT_STYLE })
        : h("div", { class: "stack" });
    }

    function renderGroupedItems(items, groups, opts) {
      const container = h("div", { class: "stack" });
      // Grouped items first (one <details> per group), then ungrouped flat.
      const groupMap = new Map(groups.map(g => [g.id, g]));
      const byGroup = new Map();
      const ungrouped = [];
      for (const item of items) {
        if (item.group_id && groupMap.has(item.group_id)) {
          if (!byGroup.has(item.group_id)) byGroup.set(item.group_id, []);
          byGroup.get(item.group_id).push(item);
        } else {
          ungrouped.push(item);
        }
      }
      // Even empty groups are displayed so the user can see them.
      for (const g of groups) {
        if (!byGroup.has(g.id)) byGroup.set(g.id, []);
      }
      for (const [gid, groupItems] of byGroup) {
        const g = groupMap.get(gid);
        const summaryActions = [
          h("button", { class: "ghost", onClick: (e) => { e.preventDefault(); e.stopPropagation(); openItemDialog(null, g.appliance_id, g.id); }, text: "+ Variant" }),
          h("button", { class: "ghost", onClick: (e) => { e.preventDefault(); e.stopPropagation(); openGroupDialog(g); }, text: "Edit" }),
          h("button", { class: "ghost danger", onClick: (e) => { e.preventDefault(); e.stopPropagation(); deleteGroupFlow(g); }, text: "Delete" }),
        ];
        const summary = h("summary", {}, [
          h("strong", { text: g.name }),
          h("span", { class: "pill", text: groupItems.length + " " + pluralize("variant", groupItems.length) }),
          h("div", { class: "row", style: "margin-left:auto" }, summaryActions),
        ]);
        const details = h("details", { class: "inv-group", open: true }, [summary]);
        if (groupItems.length === 0) {
          details.appendChild(h("div", { class: "inv-item" }, [
            h("div", { class: "muted", text: "No variants yet." }),
          ]));
        } else {
          groupItems.sort(compareItems);
          if (state.density === "grid") {
            const body = h("div", { style: GRID_LAYOUT_STYLE });
            for (const item of groupItems) body.appendChild(renderInventoryItem(item, opts));
            details.appendChild(body);
          } else {
            for (const item of groupItems) details.appendChild(renderInventoryItem(item, opts));
          }
        }
        container.appendChild(details);
      }
      if (ungrouped.length > 0) {
        ungrouped.sort(compareItems);

        // Visually pair ungrouped pack-based items that are variants of the
        // same thing: same appliance, same case-insensitive name, same
        // pack_label. If two or more such items exist, show them under one
        // mini-heading so opened/unopened pairs appear together.
        const pairKey = (item) =>
          item.tracking === "pack"
            ? item.appliance_id + "|" +
              (item.name || "").trim().toLowerCase() + "|" +
              (item.pack_label || "").toLowerCase()
            : null;
        const packClusters = new Map(); // key -> items[]
        const singles = [];
        for (const i of ungrouped) {
          const k = pairKey(i);
          if (!k) { singles.push(i); continue; }
          if (!packClusters.has(k)) packClusters.set(k, []);
          packClusters.get(k).push(i);
        }
        // Clusters of size 1 are just singles.
        for (const [k, arr] of packClusters) {
          if (arr.length < 2) {
            singles.push(...arr);
            packClusters.delete(k);
          }
        }

        const wrap = h("div", { class: "inv-group" }, [
          h("div", { style: "padding:0.75rem 1rem;background:var(--surface-2);font-weight:600" }, [
            h("span", { text: "Ungrouped" }),
          ]),
        ]);

        if (state.density === "grid") {
          // Grid mode flattens pack-cluster headings — the photo tiles make
          // variants visually distinct enough on their own.
          const all = [...singles];
          for (const arr of packClusters.values()) all.push(...arr);
          all.sort(compareItems);
          const body = h("div", { style: GRID_LAYOUT_STYLE });
          for (const item of all) body.appendChild(renderInventoryItem(item, opts));
          wrap.appendChild(body);
        } else {
          // Render each pair/cluster as a nested mini-group with a shared heading.
          for (const arr of packClusters.values()) {
            arr.sort((a, b) => a.pack_status.localeCompare(b.pack_status));
            const header = arr[0];
            const sub = h("div", { style: "padding:0.5rem 1rem;background:var(--surface);font-weight:600;border-top:1px solid var(--border);display:flex;align-items:center;gap:0.5rem" }, [
              h("span", { text: header.name }),
              h("span", { class: "pill", text: `${arr.length} ${pluralize("variant", arr.length)}` }),
            ]);
            wrap.appendChild(sub);
            for (const item of arr) wrap.appendChild(renderInventoryItem(item, opts));
          }
          singles.sort(compareItems);
          for (const item of singles) wrap.appendChild(renderInventoryItem(item, opts));
        }
        container.appendChild(wrap);
      }
      return container;
    }

    function renderInventoryItem(item, opts = {}) {
      if (state.density === "compact") return renderInventoryItemCompact(item, opts);
      if (state.density === "grid") return renderInventoryItemGrid(item, opts);
      const busy = state.busyItems.has(item.id);
      const appliance = state.appliances.find(a => a.id === item.appliance_id);
      const metaChildren = [];
      if (opts.showAppliance && appliance) metaChildren.push(h("span", { class: "pill", text: appliance.name }));
      if (state.familyId && item.owner_account_name && item.owner_account_id !== state.accountId) {
        metaChildren.push(h("span", { class: "pill accent", text: item.owner_account_name }));
      }
      if (item.tracking === "individual") {
        metaChildren.push(h("span", { class: "pill", text: "individual" }));
      } else {
        metaChildren.push(h("span", { class: "pill accent", text: item.pack_status }));
      }
      if (item.category) metaChildren.push(h("span", { class: "pill", text: item.category }));
      for (const p of tagPillsFor(item)) metaChildren.push(p);
      if (item.expiration_date) {
        const st = expirationState(item.expiration_date);
        const cls = st === "expired" ? "pill danger" : st === "soon" ? "pill warning" : "pill";
        const label = st === "expired" ? "Expired " + formatDate(item.expiration_date)
                     : st === "soon" ? "Expires " + formatDate(item.expiration_date)
                     : "Exp " + formatDate(item.expiration_date);
        metaChildren.push(h("span", { class: cls, text: label }));
      }

      // Quantity + controls
      const minusLabel = item.tracking === "individual" ? "Decrease quantity" : "Decrease pack count";
      const plusLabel  = item.tracking === "individual" ? "Increase quantity" : "Increase pack count";
      const delta = item.tracking === "individual" ? defaultIndividualDelta(item.unit) : 1;
      const valueDisplay = item.tracking === "individual"
        ? formatNumber(item.quantity) + " " + (item.unit || "")
        : item.pack_count + " " + pluralize(item.pack_label || "pack", item.pack_count);

      const minusBtn = h("button", {
        class: "icon", "aria-label": minusLabel,
        disabled: busy,
        onClick: () => adjustItem(item, -delta),
        text: "−",
      });
      const plusBtn = h("button", {
        class: "icon primary", "aria-label": plusLabel,
        disabled: busy,
        onClick: () => adjustItem(item, delta),
        text: "+",
      });
      const qty = h("div", { class: "qty-controls" }, [
        minusBtn,
        h("div", { class: "qty-value", "aria-live": "polite", text: valueDisplay }),
        plusBtn,
      ]);

      // Pack-opening / closing actions on eligible pack variants with count > 0
      const packActions = [];
      if (item.tracking === "pack" && item.pack_count > 0) {
        if (item.pack_status === "unopened") {
          packActions.push(h("button", {
            disabled: busy,
            onClick: () => packTransfer(item, "open", "one"),
            text: "Mark ×1 Open",
          }));
          packActions.push(h("button", {
            disabled: busy,
            onClick: () => packTransfer(item, "open", "all"),
            text: "Mark All Open",
          }));
        } else if (item.pack_status === "opened") {
          packActions.push(h("button", {
            disabled: busy,
            onClick: () => packTransfer(item, "close", "one"),
            text: "Mark ×1 Unopened",
          }));
          packActions.push(h("button", {
            disabled: busy,
            onClick: () => packTransfer(item, "close", "all"),
            text: "Mark All Unopened",
          }));
        }
      }

      const actions = h("div", { class: "inv-actions" }, [
        ...packActions,
        h("button", { class: "ghost", "aria-label": "Edit " + item.name, onClick: () => openItemDialog(item), text: "Edit" }),
        h("button", { class: "ghost danger", "aria-label": "Delete " + item.name, onClick: () => deleteItemFlow(item), text: "Delete" }),
      ]);

      const thumb = item.has_photo
        ? h("button", {
            class: "ghost",
            style: "padding:0;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;overflow:hidden;cursor:zoom-in",
            "aria-label": "View photo of " + item.name,
            onClick: () => openPhotoLightbox(item),
          }, [
            h("img", {
              src: "/api/appliances/" + encodeURIComponent(item.appliance_id) +
                   "/items/" + encodeURIComponent(item.id) + "/photo" +
                   "?v=" + encodeURIComponent(item.updated_at || ""),
              alt: item.name,
              loading: "lazy",
              decoding: "async",
              width: "56", height: "56",
              style: "display:block;width:56px;height:56px;object-fit:cover",
            }),
          ])
        : null;

      const leftCol = h("div", { style: "display:flex;gap:0.75rem;align-items:center;min-width:0" }, [
        thumb,
        h("div", { style: "min-width:0;flex:1" }, [
          h("div", { class: "name", text: item.name }),
          h("div", { class: "meta" }, metaChildren),
          item.notes ? h("div", { class: "muted", style: "margin-top:0.25rem", text: item.notes }) : null,
        ]),
      ]);

      return h("div", { class: "inv-item" }, [
        leftCol,
        h("div", { class: "inv-right" }, [qty, actions]),
      ]);
    }

    // Compact row: photo + name + opened/unopened + expiration warning only.
    // Tapping the row opens the edit dialog so the compact view is still
    // actionable without crowding the layout.
    function renderInventoryItemCompact(item, opts = {}) {
      const pills = [];
      if (item.tracking === "pack") {
        pills.push(h("span", { class: "pill accent", text: item.pack_status }));
      }
      for (const p of tagPillsFor(item)) pills.push(p);
      if (item.expiration_date) {
        const st = expirationState(item.expiration_date);
        if (st === "expired") {
          pills.push(h("span", { class: "pill danger", text: "Expired " + formatDate(item.expiration_date) }));
        } else if (st === "soon") {

    // ---------- Photo helpers (client-side resize + lightbox) ----------

    async function resizeImageToJpegBase64(file, maxDim = 800, quality = 0.75) {
      // Load the image. createImageBitmap handles EXIF orientation on modern browsers.
      const bitmap = await createImageBitmap(file).catch(async () => {
        // Fallback for browsers without createImageBitmap on File.
        const url = URL.createObjectURL(file);
        try {
          const img = await new Promise((res, rej) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = rej;
            i.src = url;
          });
          return img;
        } finally {
          URL.revokeObjectURL(url);
        }
      });
      const srcW = bitmap.width || bitmap.naturalWidth;
      const srcH = bitmap.height || bitmap.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(srcW, srcH));
      const w = Math.max(1, Math.round(srcW * scale));
      const h = Math.max(1, Math.round(srcH * scale));
      let blob;
      if (typeof OffscreenCanvas !== "undefined") {
        const canvas = new OffscreenCanvas(w, h);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(bitmap, 0, 0, w, h);
        blob = await canvas.convertToBlob({ type: "image/jpeg", quality });
      } else {
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
        blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", quality));
      }
      if (!blob) throw new Error("Could not encode JPEG.");
      // Convert blob to base64 (without the "data:...," prefix).
      const buf = await blob.arrayBuffer();
      const bytes = new Uint8Array(buf);
      // chunk to avoid stack blow on large arrays
      let bin = "";
      const CHUNK = 0x8000;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(bin);
    }

    async function uploadPhoto(item, file) {
      const b64 = await resizeImageToJpegBase64(file);
      const updated = await api(
        "/api/appliances/" + encodeURIComponent(item.appliance_id) +
        "/items/" + encodeURIComponent(item.id) + "/photo",
        { method: "POST", body: { image_base64: b64 } },
      );
      // Merge over the existing record so owner_account_id / owner_account_name
      // (added by /api/items) survive — the per-item response doesn't carry them.
      const idx = state.items.findIndex(i => i.id === updated.id);
      if (idx >= 0) state.items[idx] = { ...state.items[idx], ...updated };
      return updated;
    }

    async function deletePhoto(item) {
      await api(
        "/api/appliances/" + encodeURIComponent(item.appliance_id) +
        "/items/" + encodeURIComponent(item.id) + "/photo",
        { method: "DELETE" },
      );
      const idx = state.items.findIndex(i => i.id === item.id);
      if (idx >= 0) state.items[idx] = { ...state.items[idx], has_photo: false };
    }

    function openPhotoLightbox(item) {
      const img = h("img", {
        src: "/api/appliances/" + encodeURIComponent(item.appliance_id) +
             "/items/" + encodeURIComponent(item.id) + "/photo" +
             "?v=" + encodeURIComponent(item.updated_at || ""),
        alt: item.name,
        style: "max-width:min(90vw,900px);max-height:85vh;display:block;border-radius:8px;background:#000",
      });
      const backdrop = h("div", {
        class: "dialog-backdrop",
        onClick: (e) => { if (e.target === backdrop) backdrop.remove(); },
      }, [
        h("div", { class: "dialog", style: "padding:0.5rem;background:transparent;border:0;box-shadow:none" }, [img]),
      ]);
      document.body.appendChild(backdrop);
      const esc = (e) => { if (e.key === "Escape") { backdrop.remove(); document.removeEventListener("keydown", esc); } };
      document.addEventListener("keydown", esc);
    }

    function defaultIndividualDelta(unit) {
      // Unit-aware default increments. The user may edit the quantity directly
      // through the edit dialog for exact values.
      const u = (unit || "").toLowerCase();
      if (["g", "ml"].includes(u)) return 50;
      if (["kg", "l"].includes(u)) return 0.1;
      return 1;
    }

    function formatNumber(n) {
      if (n == null) return "0";
      const rounded = Math.round(n * 10000) / 10000;
      return String(rounded);
    }

    async function adjustItem(item, delta) {
      if (state.busyItems.has(item.id)) return;
      // If this adjustment would bring the quantity to zero (or below for
      // fractional units that over-shoot), remove the item instead of
      // leaving a zero-quantity record cluttering the list.
      const current = item.tracking === "individual" ? (item.quantity || 0) : (item.pack_count || 0);
      if (delta < 0 && current + delta <= 0) {
        state.busyItems.add(item.id);
        await withBusy("Deleting…", async () => {
          try {
            await api(
              "/api/appliances/" + encodeURIComponent(item.appliance_id) +
              "/items/" + encodeURIComponent(item.id),
              { method: "DELETE" },
            );
            await reloadInventory();
            toast(`"${item.name}" removed.`, "success");
          } catch (err) {
            toast("Could not remove item: " + err.message, "error");
          } finally {
            state.busyItems.delete(item.id);
            render();
          }
        });
        return;
      }
      state.busyItems.add(item.id);
      await withBusy("Saving…", async () => {
        try {
          const updated = await api(
            "/api/appliances/" + encodeURIComponent(item.appliance_id) +
            "/items/" + encodeURIComponent(item.id) + "/adjust",
            { method: "POST", body: { delta } },
          );
          const idx = state.items.findIndex(i => i.id === updated.id);
          if (idx >= 0) state.items[idx] = { ...state.items[idx], ...updated };
          announce("Quantity updated.");
        } catch (err) {
          if (err.status === 400) toast(err.message, "error");
          else toast("Could not update quantity: " + err.message, "error");
        } finally {
          state.busyItems.delete(item.id);
          render();
        }
      });
    }

    async function packTransfer(item, direction, mode) {
      if (state.busyItems.has(item.id)) return;
      state.busyItems.add(item.id);
      await withBusy("Updating…", async () => {
        try {
          const path =
            (direction === "open" ? "open" : "close") +
            "-" + (mode === "one" ? "one" : "all");
          await api(
            "/api/appliances/" + encodeURIComponent(item.appliance_id) +
            "/items/" + encodeURIComponent(item.id) + "/" + path,
            { method: "POST" },
          );
          await reloadInventory();
          const verb = direction === "open" ? "Opened" : "Marked unopened";
          toast(
            (mode === "one" ? `${verb} 1 pack.` : `${verb} all packs.`),
            "success",
          );
          render();
        } catch (err) {
          toast(err.message, "error");
        } finally {
          state.busyItems.delete(item.id);
          render();
        }
      });
    }

    async function deleteItemFlow(item) {
      if (!confirm(`Delete "${item.name}"? This cannot be undone.`)) return;
      await withBusy("Deleting…", async () => {
        try {
          await api(
            "/api/appliances/" + encodeURIComponent(item.appliance_id) +
            "/items/" + encodeURIComponent(item.id),
            { method: "DELETE" },
          );
          // Splice in place — avoids a full /api/items round-trip for a single-row delete.
          state.items = state.items.filter(i => i.id !== item.id);
          toast("Item deleted.", "success");
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    // ---------- item dialog ----------

    function openItemDialog(existing, applianceId, groupId) {
      const isEdit = !!existing;
      const data = {
        name: existing?.name || "",
        appliance_id: existing?.appliance_id || applianceId || state.appliances[0]?.id || "",
        group_id: existing?.group_id || groupId || "",
        tracking: existing?.tracking || "individual",
        quantity: existing?.tracking === "individual" ? existing.quantity : 1,
        unit: existing?.tracking === "individual" ? existing.unit : "",
        pack_count: existing?.tracking === "pack" ? existing.pack_count : 1,
        pack_label: existing?.tracking === "pack" ? existing.pack_label : "bag",
        pack_status: existing?.tracking === "pack" ? existing.pack_status : "unopened",
        expiration_date: existing?.expiration_date || "",
        category: existing?.category || "",
        notes: existing?.notes || "",
        tag_ids: Array.isArray(existing?.tag_ids) ? [...existing.tag_ids] : [],
      };
      const err = h("div", { class: "muted", role: "alert" });

      // Which groups are valid for the chosen appliance?
      function groupsForAppliance() {
        return [["", "— None —"]].concat(
          state.groups.filter(g => g.appliance_id === data.appliance_id).map(g => [g.id, g.name]),
        );
      }

      // Photo picker state (new file to upload, or "clear existing" flag).
      const photoState = { file: null, previewUrl: null, deleteExisting: false };
      const photoPreviewSlot = h("div", { style: "display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap" });

      // Tag picker: shows currently selected tags as removable chips plus an
      // input to add existing or create new. Typed names that don't match
      // trigger a POST /api/tags create under the hood.
      const tagChipsSlot = h("div", { style: "display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.3rem" });
      const tagInputEl = h("input", {
        type: "text", maxlength: "30",
        placeholder: "Pick or type a new tag",
        list: "tag-suggestions",
        onKeyDown: (e) => { if (e.key === "Enter") { e.preventDefault(); addTagFromInput(); } },
      });
      const tagDatalist = h("datalist", { id: "tag-suggestions" });
      function rebuildTagChips() {
        tagChipsSlot.textContent = "";
        const byId = new Map(state.tags.map(t => [t.id, t]));
        for (const tid of data.tag_ids) {
          const t = byId.get(tid);
          if (!t) continue;
          tagChipsSlot.appendChild(h("span", {
            class: "pill accent",
            style: "display:inline-flex;align-items:center;gap:0.3rem",
          }, [
            h("span", { text: t.name }),
            h("button", {
              type: "button",
              style: "padding:0;min-height:0;min-width:0;border:0;background:transparent;color:inherit;cursor:pointer;line-height:1",
              "aria-label": "Remove " + t.name,
              onClick: () => {
                data.tag_ids = data.tag_ids.filter(x => x !== tid);
                rebuildTagChips();
              },
              text: "×",
            }),
          ]));
        }
        tagDatalist.textContent = "";
        for (const t of state.tags) {
          if (data.tag_ids.includes(t.id)) continue;
          tagDatalist.appendChild(h("option", { value: t.name }));
        }
      }
      async function addTagFromInput() {
        const raw = (tagInputEl.value || "").trim().replace(/^#+/, "").trim();
        if (!raw) return;
        const existing = state.tags.find(t => t.name.toLowerCase() === raw.toLowerCase());
        if (existing) {
          if (!data.tag_ids.includes(existing.id)) data.tag_ids.push(existing.id);
          tagInputEl.value = "";
          rebuildTagChips();
          return;
        }
        await withBusy("Creating tag…", async () => {
          try {
            const created = await api("/api/tags", { method: "POST", body: { name: raw } });
            state.tags.push(created);
            data.tag_ids.push(created.id);
            tagInputEl.value = "";
            rebuildTagChips();
          } catch (e) {
            toast(e.message, "error");
          }
        });
      }
      rebuildTagChips();

      function rebuildPhotoPreview() {
        photoPreviewSlot.textContent = "";
        if (photoState.file && photoState.previewUrl) {
          photoPreviewSlot.appendChild(h("img", {
            src: photoState.previewUrl,
            alt: "New photo preview",
            style: "width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border)",
          }));
          photoPreviewSlot.appendChild(h("button", {
            type: "button", class: "ghost",
            onClick: () => {
              if (photoState.previewUrl) URL.revokeObjectURL(photoState.previewUrl);
              photoState.file = null; photoState.previewUrl = null;
              rebuildPhotoPreview();
            },
            text: "Remove",
          }));
          return;
        }
        if (isEdit && existing?.has_photo && !photoState.deleteExisting) {
          photoPreviewSlot.appendChild(h("img", {
            src: "/api/appliances/" + encodeURIComponent(existing.appliance_id) +
                 "/items/" + encodeURIComponent(existing.id) + "/photo" +
                 "?v=" + encodeURIComponent(existing.updated_at || ""),
            alt: "Current photo",
            loading: "lazy",
            style: "width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border)",
          }));
          photoPreviewSlot.appendChild(h("button", {
            type: "button", class: "ghost danger",
            onClick: () => { photoState.deleteExisting = true; rebuildPhotoPreview(); },
            text: "Remove current photo",
          }));
          return;
        }
        if (isEdit && existing?.has_photo && photoState.deleteExisting) {
          photoPreviewSlot.appendChild(h("span", { class: "muted", text: "Current photo will be removed on save." }));
          photoPreviewSlot.appendChild(h("button", {
            type: "button", class: "ghost",
            onClick: () => { photoState.deleteExisting = false; rebuildPhotoPreview(); },
            text: "Keep it",
          }));
          return;
        }
        photoPreviewSlot.appendChild(h("span", { class: "muted", text: "No photo yet." }));
      }
      rebuildPhotoPreview();

      const trackingFields = h("div");
      function rebuildTrackingFields() {
        trackingFields.textContent = "";
        if (data.tracking === "individual") {
          trackingFields.appendChild(h("div", { class: "row" }, [
            h("label", { style: "flex:2" }, ["Quantity",
              h("input", { type: "number", step: "0.0001", min: "0", value: String(data.quantity),
                onInput: (e) => { data.quantity = parseFloat(e.target.value) || 0; } }),
            ]),
            h("label", { style: "flex:1" }, ["Unit",
              h("input", { type: "text", required: true, placeholder: "g, kg, ml, L, pcs…", value: data.unit,
                onInput: (e) => { data.unit = e.target.value; } }),
            ]),
          ]));
        } else {
          trackingFields.appendChild(h("div", { class: "row" }, [
            h("label", { style: "flex:1" }, ["Pack count",
              h("input", { type: "number", step: "1", min: "0", value: String(data.pack_count),
                onInput: (e) => { data.pack_count = Math.max(0, parseInt(e.target.value || "0", 10)); } }),
            ]),
            h("label", { style: "flex:1" }, ["Pack label",
              h("input", { type: "text", required: true, placeholder: "bag, box, tub…", value: data.pack_label,
                onInput: (e) => { data.pack_label = e.target.value; } }),
            ]),
            h("label", { style: "flex:1" }, ["Status",
              selectEl([["unopened", "Unopened"], ["opened", "Opened"]],
                data.pack_status, (v) => { data.pack_status = v; }),
            ]),
          ]));
        }
      }
      rebuildTrackingFields();

      let groupSelect = selectEl(groupsForAppliance(), data.group_id, (v) => { data.group_id = v; });

      openDialog({
        title: isEdit ? "Edit item" : "Add item",
        body: h("form", {
          id: "item-form",
          onSubmit: async (e) => {
            e.preventDefault();
            err.textContent = "";
            if (!data.name.trim()) { err.textContent = "Name is required."; return; }
            if (!data.appliance_id) { err.textContent = "Pick an appliance."; return; }
            await withBusy("Saving…", async () => {
              try {
                let savedItem;
                if (isEdit) {
                  const patch = {
                    name: data.name,
                    group_id: data.group_id || null,
                    category: data.category || null,
                    expiration_date: data.expiration_date || null,
                    notes: data.notes || null,
                    tag_ids: data.tag_ids,
                  };
                  if (existing.tracking === "individual") patch.unit = data.unit;
                  if (existing.tracking === "pack") patch.pack_label = data.pack_label;
                  savedItem = await api(
                    "/api/appliances/" + encodeURIComponent(existing.appliance_id) +
                    "/items/" + encodeURIComponent(existing.id),
                    { method: "PATCH", body: patch },
                  );
                } else {
                  const body = {
                    name: data.name,
                    group_id: data.group_id || null,
                    category: data.category || null,
                    expiration_date: data.expiration_date || null,
                    notes: data.notes || null,
                    tag_ids: data.tag_ids,
                  };
                  if (data.tracking === "individual") {
                    Object.assign(body, { tracking: "individual", quantity: data.quantity, unit: data.unit });
                  } else {
                    Object.assign(body, {
                      tracking: "pack",
                      pack_count: data.pack_count,
                      pack_label: data.pack_label,
                      pack_status: data.pack_status,
                    });
                  }
                  savedItem = await api(
                    "/api/appliances/" + encodeURIComponent(data.appliance_id) + "/items",
                    { method: "POST", body },
                  );
                }
                // Apply photo change: new upload wins over "delete existing".
                if (photoState.file) {
                  try {
                    await uploadPhoto(savedItem, photoState.file);
                  } catch (pe) {
                    toast("Photo upload failed: " + pe.message, "error");
                  }
                } else if (isEdit && photoState.deleteExisting && existing?.has_photo) {
                  try {
                    await deletePhoto(savedItem);
                  } catch (pe) {
                    toast("Photo removal failed: " + pe.message, "error");
                  }
                }
                if (photoState.previewUrl) URL.revokeObjectURL(photoState.previewUrl);
                // Splice in place rather than refetching the whole inventory.
                if (isEdit) {
                  const idx = state.items.findIndex(i => i.id === savedItem.id);
                  if (idx >= 0) state.items[idx] = { ...state.items[idx], ...savedItem };
                } else {
                  // New item: inherit owner metadata from the appliance it was added to
                  // so the "owner" badge renders correctly without a full reload.
                  const apl = state.appliances.find(a => a.id === savedItem.appliance_id);
                  if (apl && apl.owner_account_id) {
                    savedItem.owner_account_id = apl.owner_account_id;
                    savedItem.owner_account_name = apl.owner_account_name;
                  }
                  state.items.push(savedItem);
                }
                toast(isEdit ? "Item updated." : "Item added.", "success");
                closeDialog();
                render();
              } catch (e2) {
                err.textContent = e2.message;
              }
            });
          },
        }, [
          h("label", {}, ["Name",
            h("input", { type: "text", required: true, maxlength: "200", value: data.name,
              onInput: (e) => { data.name = e.target.value; } }),
          ]),
          !isEdit ? h("label", {}, ["Appliance",
            selectEl(state.appliances.map(a => [a.id, a.name]), data.appliance_id, (v) => {
              data.appliance_id = v;
              // Rebuild group dropdown for the new appliance.
              const newSelect = selectEl(groupsForAppliance(), "", (nv) => { data.group_id = nv; });
              groupSelect.replaceWith(newSelect);
              groupSelect = newSelect;
              data.group_id = "";
            }),
          ]) : null,
          h("label", {}, ["Group (optional)", groupSelect]),
          !isEdit ? h("label", {}, ["Tracking mode",
            selectEl([
              ["individual", "Individual quantity (e.g. 500 g, 1.5 L)"],
              ["pack", "Pack-based (e.g. 4 bags)"],
            ], data.tracking, (v) => { data.tracking = v; rebuildTrackingFields(); }),
          ]) : null,
          trackingFields,
          h("label", {}, ["Category (optional)",
            h("input", { type: "text", value: data.category, maxlength: "100",
              onInput: (e) => { data.category = e.target.value; } }),
          ]),
          h("label", {}, ["Tags (optional)",
            tagChipsSlot,
            h("div", { class: "row", style: "margin-top:0.3rem;gap:0.3rem" }, [
              tagInputEl,
              h("button", { type: "button", onClick: addTagFromInput, text: "Add" }),
            ]),
            tagDatalist,
          ]),
          h("label", {}, ["Expiration (optional)",
            h("input", { type: "date", value: data.expiration_date,
              onInput: (e) => { data.expiration_date = e.target.value; } }),
          ]),
          h("label", {}, ["Photo (optional)",
            h("input", {
              type: "file", accept: "image/*", capture: "environment",
              onChange: (e) => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                if (!/^image\//.test(f.type)) {
                  err.textContent = "Please pick an image file.";
                  return;
                }
                if (photoState.previewUrl) URL.revokeObjectURL(photoState.previewUrl);
                photoState.file = f;
                photoState.previewUrl = URL.createObjectURL(f);
                photoState.deleteExisting = false;
                rebuildPhotoPreview();
              },
            }),
            h("small", { style: "display:block;color:var(--muted);margin-top:0.25rem",
              text: "Resized to ~800px JPEG before upload. One photo per item." }),
            photoPreviewSlot,
          ]),
          h("label", {}, ["Notes (optional)",
            h("textarea", { onInput: (e) => { data.notes = e.target.value; }, text: data.notes }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: () => {
              if (photoState.previewUrl) URL.revokeObjectURL(photoState.previewUrl);
              closeDialog();
            } },
          { label: isEdit ? "Save" : "Add", primary: true, submit: "item-form" },
        ],
      });
    }

    // ---------- groups ----------

    function openGroupDialog(existing, applianceId) {
      const isEdit = !!existing;
      const data = {
        name: existing?.name || "",
        appliance_id: existing?.appliance_id || applianceId || state.appliances[0]?.id || "",
        description: existing?.description || "",
      };
      const err = h("div", { class: "muted", role: "alert" });
      openDialog({
        title: isEdit ? "Edit group" : "Add group",
        body: h("form", {
          id: "group-form",
          onSubmit: async (e) => {
            e.preventDefault();
            err.textContent = "";
            if (!data.name.trim()) { err.textContent = "Name is required."; return; }
            if (!data.appliance_id) { err.textContent = "Pick an appliance."; return; }
            await withBusy("Saving…", async () => {
              try {
                if (isEdit) {
                  await api("/api/groups/" + encodeURIComponent(existing.id), {
                    method: "PATCH",
                    body: { name: data.name, description: data.description, appliance_id: data.appliance_id },
                  });
                } else {
                  await api("/api/groups", {
                    method: "POST",
                    body: { name: data.name, appliance_id: data.appliance_id, description: data.description || null },
                  });
                }
                await reloadInventory();
                toast(isEdit ? "Group updated." : "Group added.", "success");
                closeDialog();
                render();
              } catch (e2) {
                err.textContent = e2.message;
              }
            });
          },
        }, [
          h("label", {}, ["Name",
            h("input", { type: "text", required: true, maxlength: "200", value: data.name,
              onInput: (e) => { data.name = e.target.value; } }),
          ]),
          !isEdit ? h("label", {}, ["Appliance",
            selectEl(state.appliances.map(a => [a.id, a.name]), data.appliance_id,
              (v) => { data.appliance_id = v; }),
          ]) : null,
          h("label", {}, ["Description (optional)",
            h("textarea", { onInput: (e) => { data.description = e.target.value; }, text: data.description }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: closeDialog },
          { label: isEdit ? "Save" : "Add", primary: true, submit: "group-form" },
        ],

    async function deleteGroupFlow(group) {
      const children = state.items.filter(i => i.group_id === group.id);
      if (children.length === 0) {
        if (!confirm(`Delete group "${group.name}"?`)) return;
        await withBusy("Deleting…", async () => {
          await api("/api/groups/" + encodeURIComponent(group.id), { method: "DELETE" });
          await reloadInventory();
          toast("Group deleted.", "success");
          render();
        });
        return;
      }
      let strategy = "detach";
      let moveToGroup = state.groups.find(g => g.id !== group.id && g.appliance_id === group.appliance_id)?.id || "";
      const err = h("div", { class: "muted", role: "alert" });
      const moveSelect = selectEl(
        state.groups.filter(g => g.id !== group.id && g.appliance_id === group.appliance_id).map(g => [g.id, g.name]),
        moveToGroup,
        (v) => { moveToGroup = v; },
      );
      openDialog({
        title: `Delete group "${group.name}"`,
        body: h("div", { class: "stack" }, [
          h("p", { text: `This group has ${children.length} ${pluralize("variant", children.length)}. Choose what happens to them:` }),
          h("fieldset", { style: "border:none;padding:0" }, [
            radioEl("delg-strat", "detach", strategy === "detach", "Keep variants, remove from group", (v) => { strategy = v; }),
            radioEl("delg-strat", "move", strategy === "move", "Move variants into another group in the same appliance", (v) => { strategy = v; }),
            moveSelect,
            radioEl("delg-strat", "cascade", strategy === "cascade", "Delete variants permanently", (v) => { strategy = v; }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: closeDialog },
          { label: "Delete group", primary: true, danger: true, onClick: async () => {
              err.textContent = "";
              if (strategy === "move" && !moveToGroup) { err.textContent = "Pick a destination group."; return; }
              await withBusy("Deleting…", async () => {
                try {
                  let url = "/api/groups/" + encodeURIComponent(group.id) + "?strategy=" + strategy;
                  if (strategy === "move") url += "&move_to_group=" + encodeURIComponent(moveToGroup);
                  await api(url, { method: "DELETE" });
                  await reloadInventory();
                  toast("Group deleted.", "success");
                  closeDialog();
                  render();
                } catch (e2) {
                  err.textContent = e2.message;
                }
              });
            } },
        ],
      });
    }

    // ---------- settings ----------

            e.preventDefault();

            if (!/^\d{4,12}$/.test(next)) { err.textContent = "New PIN must be 4–12 digits."; return; }

              try {
                await changePin(current, next);

            h("input", { type: "password", inputmode: "numeric", maxlength: "12", required: true, autocomplete: "current-password",
              onInput: (e) => { current = e.target.value; } }),
          ]),
          h("label", {}, ["New PIN",
            h("input", { type: "password", inputmode: "numeric", maxlength: "12", required: true, autocomplete: "new-password",
              onInput: (e) => { next = e.target.value; } }),

          h("label", {}, ["Confirm new PIN",

              onInput: (e) => { confirm = e.target.value; } }),

          h("div", { class: "row", style: "justify-content:flex-end;margin-top:0.75rem" }, [
            h("button", { type: "submit", class: "primary", text: "Change PIN" }),

    function renderTagsSection() {
      const children = [h("h3", { style: "margin-top:0", text: "Tags" })];
      if (state.familyId) {
        children.push(h("p", { class: "muted", text: "Tags are shared across your whole family." }));
      } else {
        children.push(h("p", { class: "muted", text: "Give items quick labels like snack or vegan — pick them from the item editor." }));
      }

      if (state.tags.length === 0) {
        children.push(h("p", { class: "muted", text: "No tags yet. Create one below." }));
      } else {
        const list = h("div", { style: "display:flex;flex-wrap:wrap;gap:0.4rem" });
        for (const t of state.tags) {
          const chip = h("span", {
            class: "pill accent",
            style: "display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.6rem",
          }, [
            h("span", { text: t.name }),
            h("button", {
              type: "button",
              class: "ghost",
              style: "padding:0;min-height:0;min-width:0;border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1",
              "aria-label": "Delete tag " + t.name,
              onClick: () => deleteTag(t),
              text: "×",
            }),
          ]);
          list.appendChild(chip);
        }
        children.push(list);
      }

      let newTagName = "";
      const err = h("div", { class: "muted", role: "alert" });
      const tagInput = h("input", {
        type: "text", placeholder: "e.g. snack, dinner, vegan", maxlength: "30",
        onInput: (e) => { newTagName = e.target.value; },
      });
      children.push(h("form", {
        onSubmit: async (e) => {
          e.preventDefault();
          err.textContent = "";
          const name = newTagName.trim().replace(/^#+/, "").trim();
          if (!name) { err.textContent = "Enter a tag name."; return; }
          await withBusy("Creating tag…", async () => {
            try {
              await api("/api/tags", { method: "POST", body: { name } });
              await reloadInventory();
              newTagName = "";
              tagInput.value = "";
              render();
            } catch (e2) {
              err.textContent = e2.message;
            }
          });
        },
      }, [
        h("label", {}, ["Create tag", tagInput]),
        err,
        h("div", { class: "row", style: "justify-content:flex-end;margin-top:0.5rem" }, [
          h("button", { type: "submit", class: "primary", text: "+ Create" }),
        ]),
      ]));
      return h("div", { class: "card stack" }, children);
    }

    function renderThemeSection() {
      // Hex defaults (chrome fallback approximated from the oklch literal).
      const defaults = {
        chromeLight: "#1e2847",
        chromeDark: "#1e2847",
        bgLight: "#f6f7fb",
        bgDark: "#0b1220",
      };
      const t = state.customTheme;

      function colorRow(label, key) {
        const value = t[key] || defaults[key];
        const picker = h("input", {
          type: "color",
          value,
          style: "width:3rem;height:2rem;padding:0;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;min-height:0",
          onInput: (e) => {
            state.customTheme[key] = e.target.value;
            saveCustomTheme();
            applyCustomTheme();
          },
        });
        const hex = h("code", { style: "font-size:0.85rem;color:var(--muted)", text: value });
        picker.addEventListener("input", (e) => { hex.textContent = e.target.value; });
        const resetBtn = h("button", {
          type: "button",
          class: "ghost",
          onClick: () => {
            state.customTheme[key] = null;
            saveCustomTheme();
            applyCustomTheme();
            render();
          },
          text: "Reset",
        });
        return h("div", {
          class: "row",
          style: "justify-content:space-between;gap:0.5rem;padding:0.4rem 0.1rem",
        }, [
          h("div", {}, [
            h("div", { style: "font-weight:600", text: label }),
            t[key] ? hex : h("span", { class: "muted", style: "font-size:0.85rem", text: "default" }),
          ]),
          h("div", { class: "row", style: "gap:0.4rem" }, [picker, resetBtn]),
        ]);
      }

      return h("div", { class: "card stack" }, [
        h("h3", { style: "margin-top:0", text: "Theme colours" }),
        h("p", { class: "muted", text: "Override the top-bar / sidebar and main background colours for each mode. Changes save instantly; text contrast on the chrome bar is picked automatically." }),
        h("div", { style: "border-top:1px solid var(--border);padding-top:0.5rem" }, [
          h("h4", { style: "margin:0.2rem 0 0.3rem", text: "Light mode" }),
          colorRow("Top-bar / sidebar", "chromeLight"),
          colorRow("Main background", "bgLight"),
        ]),
        h("div", { style: "border-top:1px solid var(--border);padding-top:0.5rem" }, [
          h("h4", { style: "margin:0.2rem 0 0.3rem", text: "Dark mode" }),
          colorRow("Top-bar / sidebar", "chromeDark"),
          colorRow("Main background", "bgDark"),
        ]),
        h("div", { class: "row", style: "justify-content:flex-end" }, [
          h("button", {
            class: "ghost",
            onClick: () => {
              state.customTheme = { chromeLight: null, chromeDark: null, bgLight: null, bgDark: null };
              saveCustomTheme();
              applyCustomTheme();
              render();
            },
            text: "Reset all to defaults",
          }),
        ]),
      ]);
    }

    async function deleteTag(tag) {
      if (!confirm(`Delete the "${tag.name}" tag? Items that use it will lose the tag.`)) return;
      await withBusy("Deleting tag…", async () => {
        try {
          await api("/api/tags/" + encodeURIComponent(tag.id), { method: "DELETE" });
          await reloadInventory();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    function renderFamilySection() {
      // Fetch family details lazily when settings is opened.
      if (state.family === null) {
        withBusy("Loading family…", () => reloadFamily()).then(render).catch(() => {});
        return h("div", { class: "card stack" }, [
          h("h3", { style: "margin-top:0", text: "Family" }),
          h("div", { class: "loading" }, [
            h("span", { class: "spinner" }), h("span", { text: " Loading…" }),
          ]),
        ]);
      }
      const fam = state.family;
      const children = [h("h3", { style: "margin-top:0", text: "Family" })];

      if (fam.family_id) {
        children.push(h("p", { class: "muted", text:
          `You are ${fam.my_role === "owner" ? "an Owner" : "a Member"} of a family with ${fam.members.length} ${pluralize("person", fam.members.length)}.` }));
        const list = h("div", { class: "stack" });
        for (const m of fam.members) {
          const isMe = m.account_id === state.accountId;
          const rowKids = [
            h("strong", { text: m.account_name + (isMe ? " (you)" : "") }),
            h("span", { class: m.role === "owner" ? "pill accent" : "pill", text: m.role === "owner" ? "Owner" : "Member" }),
          ];
          if (fam.my_role === "owner" && !isMe) {
            rowKids.push(h("div", { class: "row", style: "margin-left:auto;gap:0.3rem" }, [
              m.role === "member"
                ? h("button", { class: "ghost", onClick: () => changeMemberRole(m.account_id, "owner"), text: "Promote" })
                : h("button", { class: "ghost", onClick: () => changeMemberRole(m.account_id, "member"), text: "Demote" }),
              h("button", { class: "ghost danger", onClick: () => removeMember(m.account_id, m.account_name), text: "Remove" }),
            ]));
          }
          list.appendChild(h("div", { class: "row", style: "gap:0.5rem;align-items:center;padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius)" }, rowKids));
        }
        children.push(list);
      } else {
        children.push(h("p", { class: "muted", text:
          "You're not in a family. Invite someone below to start one — you'll become the Owner." }));
      }

      // Invite form (solo accounts or owners).
      if (!fam.family_id || fam.my_role === "owner") {
        let inviteName = "";
        const inviteErr = h("div", { class: "muted", role: "alert" });
        const inviteInput = h("input", {
          type: "text", placeholder: "Account name", maxlength: "60",
          onInput: (e) => { inviteName = e.target.value; },
        });
        children.push(h("form", {
          onSubmit: async (e) => {
            e.preventDefault();
            inviteErr.textContent = "";
            if (!inviteName.trim()) { inviteErr.textContent = "Enter an account name."; return; }
            await withBusy("Sending invite…", async () => {
              try {
                await api("/api/family/invite", { method: "POST", body: { account_name: inviteName.trim() } });
                toast("Invite sent.", "success");
                inviteInput.value = "";
                inviteName = "";
                await reloadFamily();
                render();
              } catch (err) {
                inviteErr.textContent = err.message;
              }
            });
          },
        }, [
          h("label", {}, ["Invite someone", inviteInput]),
          inviteErr,
          h("div", { class: "row", style: "justify-content:flex-end;margin-top:0.5rem" }, [
            h("button", { class: "primary", type: "submit", text: "Send invite" }),
          ]),
        ]));
      }

      if (fam.outgoing_invitations && fam.outgoing_invitations.length > 0) {
        const list = h("div", { class: "stack" });
        for (const inv of fam.outgoing_invitations) {
          list.appendChild(h("div", { class: "row", style: "justify-content:space-between;align-items:center;padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius)" }, [
            h("span", { text: `Waiting: ${inv.invitee_account_name}` }),
            h("button", { class: "ghost danger", onClick: () => cancelInvitation(inv.id), text: "Cancel" }),
          ]));
        }
        children.push(h("div", {}, [
          h("h4", { style: "margin-bottom:0.5rem", text: "Pending invites you've sent" }),
          list,
        ]));
      }

      if (fam.incoming_invitations && fam.incoming_invitations.length > 0) {
        const list = h("div", { class: "stack" });
        for (const inv of fam.incoming_invitations) {
          const memberNames = (inv.members || []).map(m => m.account_name + (m.role === "owner" ? " (Owner)" : "")).join(", ");
          const headerText = fam.family_id && inv.family_id !== fam.family_id
            ? `${inv.inviter_account_name} invited you to switch to their family`
            : `${inv.inviter_account_name} invited you to join a family`;
          list.appendChild(h("div", { class: "card stack" }, [
            h("div", { text: headerText }),
            memberNames ? h("div", { class: "muted", text: `Members: ${memberNames}` }) : null,
            h("div", { class: "row" }, [
              h("button", { class: "primary", onClick: () => acceptInvitation(inv.id, !!fam.family_id), text: fam.family_id ? "Accept (leave current)" : "Accept" }),
              h("button", { onClick: () => declineInvitation(inv.id), text: "Decline" }),
            ]),
          ]));
        }
        children.push(h("div", {}, [
          h("h4", { style: "margin-bottom:0.5rem", text: "Invitations for you" }),
          list,
        ]));
      }

      if (fam.family_id) {
        children.push(h("div", { class: "row", style: "justify-content:flex-end;margin-top:1rem" }, [
          h("button", { class: "ghost danger", onClick: () => leaveFamily(), text: "Leave family" }),
        ]));
      }

      return h("div", { class: "card stack" }, children);
    }

    // ---------- family actions ----------

    async function changeMemberRole(accountId, role) {
      await withBusy("Updating role…", async () => {
        try {
          await api("/api/family/members/" + encodeURIComponent(accountId) + "/role",
            { method: "PUT", body: { role } });
          toast("Role updated.", "success");
          await reloadFamily();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function removeMember(accountId, name) {
      if (!confirm(`Remove ${name} from the family?`)) return;
      await withBusy("Removing member…", async () => {
        try {
          await api("/api/family/members/" + encodeURIComponent(accountId), { method: "DELETE" });
          toast("Member removed.", "success");
          await reloadFamily();
          await reloadInventory();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function cancelInvitation(id) {
      await withBusy("Cancelling…", async () => {
        try {
          await api("/api/family/invitations/" + encodeURIComponent(id), { method: "DELETE" });
          await reloadFamily();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function acceptInvitation(id, leaveCurrent) {
      await withBusy("Joining family…", async () => {
        try {
          await api("/api/family/invitations/" + encodeURIComponent(id) + "/accept",
            { method: "POST", body: { leave_current: !!leaveCurrent } });
          toast("Joined the family.", "success");
          await reloadFamily();
          await reloadInventory();
          const sess = await api("/api/auth/session");
          if (sess && sess.authenticated) {
            state.familyId = sess.family_id || null;
            state.familyRole = sess.family_role || null;
          }
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function declineInvitation(id) {
      await withBusy("Declining…", async () => {
        try {
          await api("/api/family/invitations/" + encodeURIComponent(id) + "/decline",
            { method: "POST" });
          await reloadFamily();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function leaveFamily() {
      if (!confirm("Leave this family? You'll lose access to shared appliances and items.")) return;
      await withBusy("Leaving family…", async () => {
        try {
          await api("/api/family/leave", { method: "POST" });
          toast("Left the family.", "success");
          state.familyId = null;
          state.familyRole = null;
          state.family = null;
          await reloadInventory();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    // ---------- dialog + helpers ----------

    let dialogEl = null;
    function openDialog({ title, body, actions }) {
      closeDialog();
      const titleId = "dlg-" + Math.random().toString(36).slice(2, 8);
      const content = h("div", { class: "dialog", role: "dialog", "aria-modal": "true", "aria-labelledby": titleId }, [
        h("h2", { id: titleId, style: "margin-top:0", text: title }),
        body,
        h("div", { class: "row", style: "justify-content:flex-end;margin-top:1rem;gap:0.5rem" }, actions.map(a =>
          h("button", {
            class: (a.primary ? "primary" : "") + (a.danger ? " danger" : ""),
            type: a.submit ? "submit" : "button",
            form: a.submit || null,
            onClick: a.onClick || null,
            text: a.label,
          }),
        )),
      ]);
      dialogEl = h("div", { class: "dialog-backdrop", onClick: (e) => { if (e.target === dialogEl) closeDialog(); } }, [content]);
      document.body.appendChild(dialogEl);
      document.addEventListener("keydown", escCloser);
      // Focus the first field.
      queueMicrotask(() => {
        const first = content.querySelector("input, select, textarea, button");
        if (first) first.focus();
      });
    }
    function closeDialog() {
      if (dialogEl) {
        dialogEl.remove();
        dialogEl = null;
        document.removeEventListener("keydown", escCloser);
      }
    }
    function escCloser(e) {
      if (e.key === "Escape") closeDialog();
    }

    function selectEl(options, value, onChange) {
      const sel = h("select", { onChange: (e) => onChange(e.target.value) });
      for (const [val, label] of options) {
        const opt = h("option", { value: val, text: label });
        if (val === value) opt.selected = true;
        sel.appendChild(opt);
      }
      return sel;
    }

    function radioEl(name, value, checked, label, onChange) {
      const id = "r_" + Math.random().toString(36).slice(2, 8);
      return h("label", { for: id, style: "display:flex;gap:0.5rem;align-items:center;margin-top:0.3rem" }, [
        h("input", {
          type: "radio", name, value, id,
          onChange: (e) => { if (e.target.checked) onChange(value); },
          checked: checked ? "checked" : null,
        }),
        h("span", { text: label }),
      ]);
    }

    function emptyState(title, body, action, actionLabel) {
      return h("div", { class: "card empty" }, [
        h("h3", { style: "margin-top:0", text: title }),
        h("p", { text: body }),
        action ? h("button", { class: "primary", onClick: action, text: actionLabel }) : null,
      ]);
    }

    // ---------- boot ----------

    (function initTheme() {
      try {
        const stored = localStorage.getItem("stockspace_theme");
        if (stored && stored !== "auto") document.documentElement.dataset.theme = stored;
      } catch (_) {}
      applyCustomTheme();
    })();
    // Reapply custom theme when the OS flips light/dark while in auto mode.
    // Re-render too so the wordmark swaps to match the new chrome luminance.
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (!document.documentElement.dataset.theme) {
          applyCustomTheme();
          try { render(); } catch (_) {}
        }
      });
    } catch (_) {}

    async function boot() {
      render();
      await checkAuth();
      // Only re-render if authentication state actually changed to avoid flash/reload
      if (state.authenticated || state.hasAccounts) {
        render();
      }
    }
    boot();

    // Register the service worker (PWA shell only; private data is never cached).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
      });
    }

    // --- PWA install plumbing (Android Chrome / Edge / Samsung Internet) ---
    if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
      state.isInstalled = true;
    }
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      state.installPromptAvailable = true;
      render();
    });
    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      state.installPromptAvailable = false;
      state.isInstalled = true;
      toast("StockSpace installed. Launch it from your home screen.", "success");
      render();
    });
    async function triggerInstall() {
      if (!deferredInstallPrompt) return;
      try {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
      } catch (_) { /* user dismissed */ }
      deferredInstallPrompt = null;
      state.installPromptAvailable = false;
      render();
    }

    // Lock on tab hidden for a long time (defence in depth; server also expires sessions).
    let hiddenAt = null;
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        hiddenAt = Date.now();
      } else if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) {
        hiddenAt = null;
        if (state.authenticated) lock();
      }
    });
  </script>
</body>
</html>
