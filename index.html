    // Build the group tree for an appliance as a flat list of {g, depth}
    // in DFS order, so the UI can render / select by depth.
    function buildGroupTree(applianceId) {
      const all = state.groups.filter(g => g.appliance_id === applianceId);
      const byParent = new Map();
      for (const g of all) {
        const key = g.parent_group_id || "";
        if (!byParent.has(key)) byParent.set(key, []);
        byParent.get(key).push(g);
      }
      for (const arr of byParent.values()) arr.sort((a, b) => a.name.localeCompare(b.name));
      const out = [];
      function walk(parentId, depth) {
        for (const g of (byParent.get(parentId) || [])) {
          out.push({ g, depth });
          walk(g.id, depth + 1);
        }
      }
      walk("", 0);
      return out;
    }

    // All descendants of a group id, as a Set. Used to prevent cycle
    // selection in parent-group dropdowns.
    function descendantGroupIds(rootId) {
      const out = new Set();
      const stack = [rootId];
      while (stack.length) {
        const parentId = stack.pop();
        for (const g of state.groups) {
          if (g.parent_group_id === parentId && !out.has(g.id)) {
            out.add(g.id);
            stack.push(g.id);
          }
        }
      }
      return out;
    }

    async function deleteGroupFlow(group) {
      const children = state.items.filter(i => i.group_id === group.id);
      if (children.length === 0) {
        if (!confirm(`Delete group "${group.name}"?`)) return;
        await withBusy("Deleting…", async () => {
          await api("/api/groups/" + encodeURIComponent(group.id), { method: "DELETE" });
          await reloadInventory();
          toast("Group deleted.", "success");
          render();
        });
        return;
      }
      let strategy = "detach";
      let moveToGroup = state.groups.find(g => g.id !== group.id && g.appliance_id === group.appliance_id)?.id || "";
      const err = h("div", { class: "muted", role: "alert" });
      const moveSelect = selectEl(
        state.groups.filter(g => g.id !== group.id && g.appliance_id === group.appliance_id).map(g => [g.id, g.name]),
        moveToGroup,
        (v) => { moveToGroup = v; },
      );
      openDialog({
        title: `Delete group "${group.name}"`,
        body: h("div", { class: "stack" }, [
          h("p", { text: `This group has ${children.length} ${pluralize("variant", children.length)}. Choose what happens to them:` }),
          h("fieldset", { style: "border:none;padding:0" }, [
            radioEl("delg-strat", "detach", strategy === "detach", "Keep variants, remove from group", (v) => { strategy = v; }),
            radioEl("delg-strat", "move", strategy === "move", "Move variants into another group in the same appliance", (v) => { strategy = v; }),
            moveSelect,
            radioEl("delg-strat", "cascade", strategy === "cascade", "Delete variants permanently", (v) => { strategy = v; }),
          ]),
          err,
        ]),
        actions: [
          { label: "Cancel", onClick: closeDialog },
          { label: "Delete group", primary: true, danger: true, onClick: async () => {
              err.textContent = "";
              if (strategy === "move" && !moveToGroup) { err.textContent = "Pick a destination group."; return; }
              await withBusy("Deleting…", async () => {
                try {
                  let url = "/api/groups/" + encodeURIComponent(group.id) + "?strategy=" + strategy;
                  if (strategy === "move") url += "&move_to_group=" + encodeURIComponent(moveToGroup);
                  await api(url, { method: "DELETE" });
                  await reloadInventory();
                  toast("Group deleted.", "success");
                  closeDialog();
                  render();
                } catch (e2) {
                  err.textContent = e2.message;
                }
              });
            } },
        ],
      });
    }

    function renderApiTokensSection() {
      // Lazy-load the token list on first open; cache on state so a
      // re-render doesn't re-fetch unnecessarily.
      if (state.apiTokens === undefined) {
        state.apiTokens = null;  // "loading" sentinel
        withBusy("Loading tokens…", async () => {
          try {
            const resp = await api("/api/account/api-tokens");
            state.apiTokens = resp.tokens || [];
          } catch (_) {
            state.apiTokens = [];
          }
          render();
        });
      }

      const children = [
        h("h3", { style: "margin-top:0", text: "API tokens" }),
        h("p", { class: "muted",
          text: "Long-lived bearer tokens for integrations (e.g. Home Assistant). Send as 'Authorization: Bearer <token>' on API requests; the token is the only auth needed — no PIN, no cookie, no CSRF. Shown ONCE at creation; store it somewhere safe." }),
      ];

      if (state.apiTokens === null) {
        children.push(h("div", { class: "loading" }, [
          h("span", { class: "spinner" }), h("span", { text: " Loading…" }),
        ]));
      } else if (state.apiTokens.length === 0) {
        children.push(h("p", { class: "muted", text: "No API tokens yet." }));
      } else {
        const list = h("div", { class: "stack", style: "gap:0.5rem" });
        for (const t of state.apiTokens) {
          const used = t.last_used_at
            ? "last used " + new Date(t.last_used_at).toLocaleString()
            : "never used";
          const created = "created " + new Date(t.created_at).toLocaleDateString();
          list.appendChild(h("div", {
            class: "row",
            style: "justify-content:space-between;gap:0.5rem;padding:0.5rem 0.1rem;border-top:1px solid var(--border)",
          }, [
            h("div", {}, [
              h("div", { style: "font-weight:600", text: t.label }),
              h("div", { class: "muted", style: "font-size:0.82rem" }, [
                h("code", { text: t.token_prefix + "…" }),
                h("span", { text: "  ·  " + created + "  ·  " + used }),
              ]),
            ]),
            h("button", {
              class: "ghost danger",
              onClick: async () => {
                if (!confirm("Revoke this token? Any integration using it will stop working.")) return;
                await withBusy("Revoking…", async () => {
                  try {
                    await api("/api/account/api-tokens/" + encodeURIComponent(t.id), { method: "DELETE" });
                    state.apiTokens = state.apiTokens.filter(x => x.id !== t.id);
                    toast("Token revoked.", "success");
                    render();
                  } catch (e) {
                    toast(e.message, "error");
                  }
                });
              },
              text: "Revoke",
            }),
          ]));
        }
        children.push(list);
      }

      // Create form
      let newLabel = "";
      const err = h("div", { class: "muted", role: "alert" });
      const labelInput = h("input", {
        type: "text", placeholder: "e.g. Home Assistant", maxlength: "60",
        onInput: (e) => { newLabel = e.target.value; },
      });
      children.push(h("form", {
        onSubmit: async (e) => {
          e.preventDefault();
          err.textContent = "";
          const label = newLabel.trim();
          if (!label) { err.textContent = "Give the token a short label."; return; }
          await withBusy("Creating token…", async () => {
            try {
              const resp = await api("/api/account/api-tokens", {
                method: "POST",
                body: { label },
              });
              if (!state.apiTokens) state.apiTokens = [];
              state.apiTokens.unshift({
                id: resp.id,
                label: resp.label,
                token_prefix: resp.prefix,
                created_at: new Date().toISOString(),
                last_used_at: null,
              });
              newLabel = "";
              labelInput.value = "";
              showNewTokenDialog(resp.token, resp.label);
              render();
            } catch (e2) {
              err.textContent = e2.message;
            }
          });
        },
      }, [
        h("label", { style: "margin-top:1rem" }, ["New token", labelInput]),
        err,
        h("div", { class: "row", style: "justify-content:flex-end;margin-top:0.5rem" }, [
          h("button", { type: "submit", class: "primary", text: "+ Create token" }),
        ]),
      ]));

      return h("div", { class: "card stack" }, children);
    }

    // Reveal the plaintext token exactly once with a copy button.
    function showNewTokenDialog(token, label) {
      const tokenEl = h("code", {
        style: "display:block;padding:0.75rem;border-radius:var(--radius-sm);background:var(--surface-2);"
             + "word-break:break-all;font-size:0.85rem;user-select:all;border:1px solid var(--border)",
        text: token,
      });
      openDialog({
        title: "New API token: " + label,
        body: h("div", { class: "stack" }, [
          h("p", { text: "Copy this token now — it won't be shown again." }),
          tokenEl,
          h("p", { class: "muted", style: "font-size:0.85rem",
            text: "Send as 'Authorization: Bearer <token>' on API requests." }),
        ]),
        actions: [
          { label: "Copy", primary: true, onClick: async () => {
              try { await navigator.clipboard.writeText(token); toast("Copied.", "success"); }
              catch (_) { toast("Clipboard blocked — select and copy manually.", "error"); }
            } },
          { label: "Done", onClick: closeDialog },
        ],
      });
    }

    function renderTagsSection() {
      const children = [h("h3", { style: "margin-top:0", text: "Tags" })];
      if (state.familyId) {
        children.push(h("p", { class: "muted", text: "Tags are shared across your whole family." }));
      } else {
        children.push(h("p", { class: "muted", text: "Give items quick labels like snack or vegan — pick them from the item editor." }));
      }

      if (state.tags.length === 0) {
        children.push(h("p", { class: "muted", text: "No tags yet. Create one below." }));
      } else {
        const list = h("div", { style: "display:flex;flex-wrap:wrap;gap:0.4rem" });
        for (const t of state.tags) {
          const chip = h("span", {
            class: "pill accent",
            style: "display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.6rem",
          }, [
            h("span", { text: t.name }),
            h("button", {
              type: "button",
              class: "ghost",
              style: "padding:0;min-height:0;min-width:0;border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1",
              "aria-label": "Delete tag " + t.name,
              onClick: () => deleteTag(t),
              text: "×",
            }),
          ]);
          list.appendChild(chip);
        }
        children.push(list);
      }

      let newTagName = "";
      const err = h("div", { class: "muted", role: "alert" });
      const tagInput = h("input", {
        type: "text", placeholder: "e.g. snack, dinner, vegan", maxlength: "30",
        onInput: (e) => { newTagName = e.target.value; },
      });
      children.push(h("form", {
        onSubmit: async (e) => {
          e.preventDefault();
          err.textContent = "";
          const name = newTagName.trim().replace(/^#+/, "").trim();
          if (!name) { err.textContent = "Enter a tag name."; return; }
          await withBusy("Creating tag…", async () => {
            try {
              await api("/api/tags", { method: "POST", body: { name } });
              await reloadInventory();
              newTagName = "";
              tagInput.value = "";
              render();
            } catch (e2) {
              err.textContent = e2.message;
            }
          });
        },
      }, [
        h("label", {}, ["Create tag", tagInput]),
        err,
        h("div", { class: "row", style: "justify-content:flex-end;margin-top:0.5rem" }, [
          h("button", { type: "submit", class: "primary", text: "+ Create" }),
        ]),
      ]));
      return h("div", { class: "card stack" }, children);
    }

    // Build a labelled "colour + hex + reset" row. Shared by the Custom
    // colour disclosure inside the Appearance section.
    function themeColorRow(label, key, defaultHex) {
      const t = state.customTheme;
      const value = t[key] || defaultHex;
      const picker = h("input", {
        type: "color",
        value,
        style: "width:3rem;height:2rem;padding:0;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;min-height:0",
        onInput: (e) => {
          state.customTheme[key] = e.target.value;
          saveCustomTheme();
          applyCustomTheme();
        },
      });
      const hex = h("code", { style: "font-size:0.85rem;color:var(--muted)", text: value });
      picker.addEventListener("input", (e) => { hex.textContent = e.target.value; });
      const resetBtn = h("button", {
        type: "button",
        class: "ghost",
        onClick: () => {
          state.customTheme[key] = null;
          saveCustomTheme();
          applyCustomTheme();
          render();
        },
        text: "Reset",
      });
      return h("div", {
        class: "row",
        style: "justify-content:space-between;gap:0.5rem;padding:0.4rem 0.1rem",
      }, [
        h("div", {}, [
          h("div", { style: "font-weight:600", text: label }),
          t[key] ? hex : h("span", { class: "muted", style: "font-size:0.85rem", text: "default" }),
        ]),
        h("div", { class: "row", style: "gap:0.4rem" }, [picker, resetBtn]),
      ]);
    }

    // ---------- Appearance: background image / presets / custom colours ----------

    // Each preset carries its background gradient, chrome tint AND an
    // accent colour per scheme, so primary buttons, focus rings and the
    // rail indicator all take the theme's lead instead of staying amber.
    const BG_PRESETS = [
      { id: "ambient",   label: "Ambient (default)",
        bgLight: null, bgDark: null,
        chromeLight: null, chromeDark: null,
        accent: null },
      { id: "sunset",    label: "Sunset glow",
        bgLight: "radial-gradient(at 20% 10%, #ffd9b0 0%, transparent 55%),radial-gradient(at 80% 90%, #ffb199 0%, transparent 55%),linear-gradient(180deg,#fff2e4 0%,#f3dcd1 100%)",
        bgDark:  "radial-gradient(at 20% 10%, #c05a1a 0%, transparent 55%),radial-gradient(at 80% 90%, #3a1744 0%, transparent 55%),linear-gradient(180deg,#120a14 0%,#07040a 100%)",
        chromeLight: "#f5c4a9", chromeDark: "#3a1f17",
        accent: "#ff6a1a" },
      { id: "ocean",     label: "Deep ocean",
        bgLight: "radial-gradient(at 20% 10%, #bfe0ff 0%, transparent 55%),radial-gradient(at 80% 90%, #b4f0d7 0%, transparent 55%),linear-gradient(180deg,#eef6ff 0%,#dde9f5 100%)",
        bgDark:  "radial-gradient(at 20% 10%, #1b4f8b 0%, transparent 55%),radial-gradient(at 80% 90%, #103a56 0%, transparent 55%),linear-gradient(180deg,#06111f 0%,#030a14 100%)",
        chromeLight: "#c7dfea", chromeDark: "#0a1f2e",
        accent: "#2b84ff" },
      { id: "forest",    label: "Forest",
        bgLight: "radial-gradient(at 20% 10%, #d7ecc8 0%, transparent 55%),radial-gradient(at 80% 90%, #c5ddc6 0%, transparent 55%),linear-gradient(180deg,#eef5e8 0%,#dde7d2 100%)",
        bgDark:  "radial-gradient(at 20% 10%, #15402a 0%, transparent 55%),radial-gradient(at 80% 90%, #1b2d1d 0%, transparent 55%),linear-gradient(180deg,#0a120d 0%,#040806 100%)",
        chromeLight: "#c8d9c2", chromeDark: "#13261d",
        accent: "#2fb361" },
      { id: "mono",      label: "Minimal mono",
        bgLight: "linear-gradient(180deg,#f6f7fb 0%,#e8ebf2 100%)",
        bgDark:  "linear-gradient(180deg,#111319 0%,#060709 100%)",
        chromeLight: "#e8ebf2", chromeDark: "#111317",
        accent: "#64748b" },
    ];

    function renderAppearanceSection() {
      const t = state.customTheme;
      const scheme = effectiveColorScheme();

      // Preset tiles. A tile is "active" when its bg matches the stored
      // theme in the current scheme (chromes are a side-effect; bg is
      // what the tile shows).
      const activeBg = scheme === "dark" ? t.bgDark : t.bgLight;
      const activePreset = BG_PRESETS.find(p => (scheme === "dark" ? p.bgDark : p.bgLight) === activeBg) || BG_PRESETS[0];
      const presetGrid = h("div", {
        style: "display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.6rem",
      });
      for (const preset of BG_PRESETS) {
        const sample = preset.id === "ambient"
          ? (scheme === "dark"
              ? "radial-gradient(at 18% 12%, rgba(255,160,80,0.42), transparent 55%),radial-gradient(at 85% 88%, rgba(140,100,255,0.42), transparent 50%),linear-gradient(180deg,#0a0d18,#060810)"
              : "radial-gradient(at 18% 10%, rgba(255,210,160,0.7), transparent 55%),radial-gradient(at 85% 88%, rgba(190,210,255,0.6), transparent 50%),linear-gradient(180deg,#f4f2ee,#eceef5)")
          : (scheme === "dark" ? preset.bgDark : preset.bgLight);
        const isActive = preset.id === activePreset.id;
        const tile = h("button", {
          type: "button",
          style: "min-height:90px;padding:0;border-radius:var(--radius);overflow:hidden;position:relative;cursor:pointer;"
               + "border:2px solid " + (isActive ? "var(--accent)" : "var(--border)") + ";"
               + "background:" + sample + ";"
               + "box-shadow:var(--glass-highlight-soft),var(--shadow)",
          onClick: () => {
            state.customTheme.bgLight = preset.bgLight;
            state.customTheme.bgDark = preset.bgDark;
            // Preset also drives the top-bar + rail (chrome) tint and
            // the accent colour (primary buttons, focus rings, rail
            // indicator) so the whole theme is coherent.
            state.customTheme.chromeLight = preset.chromeLight;
            state.customTheme.chromeDark = preset.chromeDark;
            state.customTheme.accent = preset.accent;
            // Clearing image lets the gradient show through.
            state.customTheme.bgImageLight = null;
            state.customTheme.bgImageDark = null;
            saveCustomTheme();
            applyCustomTheme();
            render();
          },
          "aria-pressed": String(isActive),
        }, [
          h("span", {
            style: "position:absolute;left:0;right:0;bottom:0;padding:0.4rem 0.6rem;"
                 + "font-size:0.78rem;font-weight:600;color:#fff;"
                 + "background:linear-gradient(180deg,transparent,rgba(0,0,0,0.55));"
                 + "text-shadow:0 1px 2px rgba(0,0,0,0.5);text-align:left",
            text: preset.label,
          }),
        ]);
        presetGrid.appendChild(tile);
      }

      // Image upload picker
      const bgImage = scheme === "dark" ? t.bgImageDark : t.bgImageLight;
      const imgPreview = bgImage
        ? h("div", {
            style: "margin-top:0.5rem;height:110px;border-radius:var(--radius);"
                 + "background:url(" + JSON.stringify(bgImage) + ") center/cover;"
                 + "border:1px solid var(--border);box-shadow:var(--glass-highlight-soft)",
          })
        : h("p", { class: "muted", style: "margin:0.4rem 0 0;font-size:0.85rem",
                   text: "No image set." });

      const fileInput = h("input", {
        type: "file", accept: "image/*",
        style: "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none",
        onChange: (e) => {
          const f = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!f) return;
          if (!/^image\//.test(f.type)) { toast("Pick an image file.", "error"); return; }
          if (f.size > 2 * 1024 * 1024) {
            toast("Image larger than 2 MB — pick something smaller so storage stays snappy.", "error");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            if (scheme === "dark") state.customTheme.bgImageDark = dataUrl;
            else state.customTheme.bgImageLight = dataUrl;
            saveCustomTheme();
            applyCustomTheme();
            render();
          };
          reader.readAsDataURL(f);
        },
      });

      // Custom-colour disclosure — folds the old Theme-colours card in.
      const customOpen = !!(t.chromeLight || t.chromeDark || t.bgLight || t.bgDark);
      const customColour = h("details", {
        style: "border-top:1px solid var(--border);padding-top:0.75rem",
        ...(customOpen ? { open: "open" } : {}),
      }, [
        h("summary", {
          style: "cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:0.5rem",
        }, [
          h("span", { style: "display:inline-flex;width:12px;height:12px;border-radius:999px;background:var(--accent);box-shadow:var(--glass-highlight-soft)" }),
          h("span", { text: "Custom colour" }),
          h("span", { class: "muted", style: "font-size:0.85rem;margin-left:auto;font-weight:400",
                      text: "Top-bar + background hex" }),
        ]),
        h("p", { class: "muted", style: "margin:0.5rem 0 0.4rem;font-size:0.85rem",
                 text: "Override the top-bar / rail tint and the main background colour per mode. Changes save instantly; text contrast on the chrome bar is picked automatically." }),
        h("div", { style: "border-top:1px dashed var(--border);padding-top:0.5rem" }, [
          h("h4", { style: "margin:0.2rem 0 0.3rem", text: "Light mode" }),
          themeColorRow("Top-bar / rail", "chromeLight", "#1e2847"),
          themeColorRow("Main background", "bgLight", "#f6f7fb"),
        ]),
        h("div", { style: "border-top:1px dashed var(--border);padding-top:0.5rem" }, [
          h("h4", { style: "margin:0.2rem 0 0.3rem", text: "Dark mode" }),
          themeColorRow("Top-bar / rail", "chromeDark", "#1e2847"),
          themeColorRow("Main background", "bgDark", "#0b1220"),
        ]),
      ]);

      return h("div", { class: "card stack" }, [
        h("h3", { style: "margin-top:0", text: "Appearance" }),
        h("p", { class: "muted", text: "The whole app sits on a background that shows through the frosted-glass surfaces. Pick a preset, upload your own image, or dial in custom colours." }),
        presetGrid,
        h("div", { style: "border-top:1px solid var(--border);padding-top:0.75rem" }, [
          h("h4", { style: "margin:0.2rem 0 0.4rem", text: "Custom image" }),
          h("p", { class: "muted", style: "margin:0 0 0.5rem;font-size:0.85rem",
                   text: "Applies to the current colour scheme (" + scheme + "). Stored locally in your browser." }),
          h("div", { class: "row", style: "gap:0.4rem" }, [
            h("button", {
              type: "button",
              onClick: () => fileInput.click(),
              text: bgImage ? "Replace image" : "Upload image",
            }),
            bgImage ? h("button", {
              type: "button",
              class: "ghost",
              onClick: () => {
                if (scheme === "dark") state.customTheme.bgImageDark = null;
                else state.customTheme.bgImageLight = null;
                saveCustomTheme();
                applyCustomTheme();
                render();
              },
              text: "Remove image",
            }) : null,
            fileInput,
          ].filter(Boolean)),
          imgPreview,
        ]),
        customColour,
        h("div", { class: "row", style: "justify-content:flex-end" }, [
          h("button", {
            type: "button",
            class: "ghost",
            onClick: () => {
              state.customTheme = {
                chromeLight: null, chromeDark: null,
                bgLight: null, bgDark: null,
                bgImageLight: null, bgImageDark: null,
                accent: null,
              };
              saveCustomTheme();
              applyCustomTheme();
              render();
            },
            text: "Reset all to defaults",
          }),
        ]),
      ]);
    }

    async function deleteTag(tag) {
      if (!confirm(`Delete the "${tag.name}" tag? Items that use it will lose the tag.`)) return;
      await withBusy("Deleting tag…", async () => {
        try {
          await api("/api/tags/" + encodeURIComponent(tag.id), { method: "DELETE" });
          await reloadInventory();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    function renderFamilySection() {
      // Fetch family details lazily when settings is opened.
      if (state.family === null) {
        withBusy("Loading family…", () => reloadFamily()).then(render).catch(() => {});
        return h("div", { class: "card stack" }, [
          h("h3", { style: "margin-top:0", text: "Family" }),
          h("div", { class: "loading" }, [
            h("span", { class: "spinner" }), h("span", { text: " Loading…" }),
          ]),
        ]);
      }
      const fam = state.family;
      const children = [h("h3", { style: "margin-top:0", text: "Family" })];

      if (fam.family_id) {
        children.push(h("p", { class: "muted", text:
          `You are ${fam.my_role === "owner" ? "an Owner" : "a Member"} of a family with ${fam.members.length} ${pluralize("person", fam.members.length)}.` }));
        const list = h("div", { class: "stack" });
        for (const m of fam.members) {
          const isMe = m.account_id === state.accountId;
          const rowKids = [
            h("strong", { text: m.account_name + (isMe ? " (you)" : "") }),
            h("span", { class: m.role === "owner" ? "pill accent" : "pill", text: m.role === "owner" ? "Owner" : "Member" }),
          ];
          if (fam.my_role === "owner" && !isMe) {
            rowKids.push(h("div", { class: "row", style: "margin-left:auto;gap:0.3rem" }, [
              m.role === "member"
                ? h("button", { class: "ghost", onClick: () => changeMemberRole(m.account_id, "owner"), text: "Promote" })
                : h("button", { class: "ghost", onClick: () => changeMemberRole(m.account_id, "member"), text: "Demote" }),
              h("button", { class: "ghost danger", onClick: () => removeMember(m.account_id, m.account_name), text: "Remove" }),
            ]));
          }
          list.appendChild(h("div", { class: "row", style: "gap:0.5rem;align-items:center;padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius)" }, rowKids));
        }
        children.push(list);
      } else {
        children.push(h("p", { class: "muted", text:
          "You're not in a family. Invite someone below to start one — you'll become the Owner." }));
      }

      // Invite form (solo accounts or owners).
      if (!fam.family_id || fam.my_role === "owner") {
        let inviteName = "";
        const inviteErr = h("div", { class: "muted", role: "alert" });
        const inviteInput = h("input", {
          type: "text", placeholder: "Account name", maxlength: "60",
          onInput: (e) => { inviteName = e.target.value; },
        });
        children.push(h("form", {
          onSubmit: async (e) => {
            e.preventDefault();
            inviteErr.textContent = "";
            if (!inviteName.trim()) { inviteErr.textContent = "Enter an account name."; return; }
            await withBusy("Sending invite…", async () => {
              try {
                await api("/api/family/invite", { method: "POST", body: { account_name: inviteName.trim() } });
                toast("Invite sent.", "success");
                inviteInput.value = "";
                inviteName = "";
                await reloadFamily();
                render();
              } catch (err) {
                inviteErr.textContent = err.message;
              }
            });
          },
        }, [
          h("label", {}, ["Invite someone", inviteInput]),
          inviteErr,
          h("div", { class: "row", style: "justify-content:flex-end;margin-top:0.5rem" }, [
            h("button", { class: "primary", type: "submit", text: "Send invite" }),
          ]),
        ]));
      }

      if (fam.outgoing_invitations && fam.outgoing_invitations.length > 0) {
        const list = h("div", { class: "stack" });
        for (const inv of fam.outgoing_invitations) {
          list.appendChild(h("div", { class: "row", style: "justify-content:space-between;align-items:center;padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius)" }, [
            h("span", { text: `Waiting: ${inv.invitee_account_name}` }),
            h("button", { class: "ghost danger", onClick: () => cancelInvitation(inv.id), text: "Cancel" }),
          ]));
        }
        children.push(h("div", {}, [
          h("h4", { style: "margin-bottom:0.5rem", text: "Pending invites you've sent" }),
          list,
        ]));
      }

      if (fam.incoming_invitations && fam.incoming_invitations.length > 0) {
        const list = h("div", { class: "stack" });
        for (const inv of fam.incoming_invitations) {
          const memberNames = (inv.members || []).map(m => m.account_name + (m.role === "owner" ? " (Owner)" : "")).join(", ");
          const headerText = fam.family_id && inv.family_id !== fam.family_id
            ? `${inv.inviter_account_name} invited you to switch to their family`
            : `${inv.inviter_account_name} invited you to join a family`;
          list.appendChild(h("div", { class: "card stack" }, [
            h("div", { text: headerText }),
            memberNames ? h("div", { class: "muted", text: `Members: ${memberNames}` }) : null,
            h("div", { class: "row" }, [
              h("button", { class: "primary", onClick: () => acceptInvitation(inv.id, !!fam.family_id), text: fam.family_id ? "Accept (leave current)" : "Accept" }),
              h("button", { onClick: () => declineInvitation(inv.id), text: "Decline" }),
            ]),
          ]));
        }
        children.push(h("div", {}, [
          h("h4", { style: "margin-bottom:0.5rem", text: "Invitations for you" }),
          list,
        ]));
      }

      if (fam.family_id) {
        children.push(h("div", { class: "row", style: "justify-content:flex-end;margin-top:1rem" }, [
          h("button", { class: "ghost danger", onClick: () => leaveFamily(), text: "Leave family" }),
        ]));
      }

      return h("div", { class: "card stack" }, children);
    }

    // ---------- family actions ----------

    async function changeMemberRole(accountId, role) {
      await withBusy("Updating role…", async () => {
        try {
          await api("/api/family/members/" + encodeURIComponent(accountId) + "/role",
            { method: "PUT", body: { role } });
          toast("Role updated.", "success");
          await reloadFamily();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function removeMember(accountId, name) {
      if (!confirm(`Remove ${name} from the family?`)) return;
      await withBusy("Removing member…", async () => {
        try {
          await api("/api/family/members/" + encodeURIComponent(accountId), { method: "DELETE" });
          toast("Member removed.", "success");
          await reloadFamily();
          await reloadInventory();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function cancelInvitation(id) {
      await withBusy("Cancelling…", async () => {
        try {
          await api("/api/family/invitations/" + encodeURIComponent(id), { method: "DELETE" });
          await reloadFamily();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function acceptInvitation(id, leaveCurrent) {
      await withBusy("Joining family…", async () => {
        try {
          await api("/api/family/invitations/" + encodeURIComponent(id) + "/accept",
            { method: "POST", body: { leave_current: !!leaveCurrent } });
          toast("Joined the family.", "success");
          await reloadFamily();
          await reloadInventory();
          const sess = await api("/api/auth/session");
          if (sess && sess.authenticated) {
            state.familyId = sess.family_id || null;
            state.familyRole = sess.family_role || null;
          }
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function declineInvitation(id) {
      await withBusy("Declining…", async () => {
        try {
          await api("/api/family/invitations/" + encodeURIComponent(id) + "/decline",
            { method: "POST" });
          await reloadFamily();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    async function leaveFamily() {
      if (!confirm("Leave this family? You'll lose access to shared appliances and items.")) return;
      await withBusy("Leaving family…", async () => {
        try {
          await api("/api/family/leave", { method: "POST" });
          toast("Left the family.", "success");
          state.familyId = null;
          state.familyRole = null;
          state.family = null;
          await reloadInventory();
          render();
        } catch (err) {
          toast(err.message, "error");
        }
      });
    }

    // ---------- dialog + helpers ----------

    let dialogEl = null;
    function openDialog({ title, body, actions }) {
      closeDialog();
      const titleId = "dlg-" + Math.random().toString(36).slice(2, 8);
      const content = h("div", { class: "dialog", role: "dialog", "aria-modal": "true", "aria-labelledby": titleId }, [
        h("h2", { id: titleId, style: "margin-top:0", text: title }),
        body,
        h("div", { class: "row", style: "justify-content:flex-end;margin-top:1rem;gap:0.5rem" }, actions.map(a =>
          h("button", {
            class: (a.primary ? "primary" : "") + (a.danger ? " danger" : ""),
            type: a.submit ? "submit" : "button",
            form: a.submit || null,
            onClick: a.onClick || null,
            text: a.label,
          }),
        )),
      ]);
      dialogEl = h("div", { class: "dialog-backdrop", onClick: (e) => { if (e.target === dialogEl) closeDialog(); } }, [content]);
      document.body.appendChild(dialogEl);
      document.addEventListener("keydown", escCloser);
      // Focus the first field.
      queueMicrotask(() => {
        const first = content.querySelector("input, select, textarea, button");
        if (first) first.focus();
      });
    }
    function closeDialog() {
      if (dialogEl) {
        dialogEl.remove();
        dialogEl = null;
        document.removeEventListener("keydown", escCloser);
      }
    }
    function escCloser(e) {
      if (e.key === "Escape") closeDialog();
    }

    function selectEl(options, value, onChange) {
      const sel = h("select", { onChange: (e) => onChange(e.target.value) });
      for (const [val, label] of options) {
        const opt = h("option", { value: val, text: label });
        if (val === value) opt.selected = true;
        sel.appendChild(opt);
      }
      return sel;
    }

    function radioEl(name, value, checked, label, onChange) {
      const id = "r_" + Math.random().toString(36).slice(2, 8);
      return h("label", { for: id, style: "display:flex;gap:0.5rem;align-items:center;margin-top:0.3rem" }, [
        h("input", {
          type: "radio", name, value, id,
          onChange: (e) => { if (e.target.checked) onChange(value); },
          checked: checked ? "checked" : null,
        }),
        h("span", { text: label }),
      ]);
    }

    function emptyState(title, body, action, actionLabel) {
      return h("div", { class: "card empty" }, [
        h("h3", { style: "margin-top:0", text: title }),
        h("p", { text: body }),
        action ? h("button", { class: "primary", onClick: action, text: actionLabel }) : null,
      ]);
    }

    // ---------- boot ----------

    (function initTheme() {
      try {
        const stored = localStorage.getItem("stockspace_theme");
        if (stored && stored !== "auto") document.documentElement.dataset.theme = stored;
      } catch (_) {}
      applyCustomTheme();
    })();
    // Reapply custom theme when the OS flips light/dark while in auto mode.
    // Re-render too so the wordmark swaps to match the new chrome luminance.
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (!document.documentElement.dataset.theme) {
          applyCustomTheme();
          try { render(); } catch (_) {}
        }
      });
    } catch (_) {}

    async function boot() {
      render();
      await checkAuth();
      // Only re-render if authentication state actually changed to avoid flash/reload
      if (state.authenticated || state.hasAccounts) {
        render();
      }
    }
    boot();

    // Register the service worker (PWA shell only; private data is never cached).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
      });
    }

    // --- PWA install plumbing (Android Chrome / Edge / Samsung Internet) ---
    if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
      state.isInstalled = true;
    }
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      state.installPromptAvailable = true;
      render();
    });
    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      state.installPromptAvailable = false;
      state.isInstalled = true;
      toast("StockSpace installed. Launch it from your home screen.", "success");
      render();
    });
    async function triggerInstall() {
      if (!deferredInstallPrompt) return;
      try {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
      } catch (_) { /* user dismissed */ }
      deferredInstallPrompt = null;
      state.installPromptAvailable = false;
      render();
    }

    // Lock on tab hidden for a long time (defence in depth; server also expires sessions).
    let hiddenAt = null;
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        hiddenAt = Date.now();
      } else if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) {
        hiddenAt = null;
        if (state.authenticated) lock();
      }
    });
  </script>
</body>
</html>
